                        `        th.column-collapsed .header-content-wrapper { display: none !important; }`,
                        `        td.column-collapsed { min-width: 10px !important; max-width: 10px !important; width: 10px !important; padding: 3px 0 !important; overflow: hidden !important; white-space: nowrap !important; background-color: #f5f5f5 !important; }`,

                        `        td.column-collapsed * { display: none !important; }`,
					    `        .export-controls { position: sticky; top: 0; background: #fff; padding: 8px 0; z-index: 101; display: flex; gap: 15px; align-items: center; margin-bottom: 0; height: 50px; box-sizing: border-box; width: 100%; min-width: max-content; }`,
					    `        .search-wrapper { position: relative; display: inline-block; width: 250px; }`,

                        `        .search-clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 16px; color: #888; user-select: none; display: none; }`,
					    `        .search-clear-btn:hover { color: #000; }`,

				    	`        .filter-active { border: 2px solid var(--color-first-action) !important; border-radius: 4px !important; }`,
                        `        .table-filter-scroll-container { width: 100%; height: 110px; overflow-y: auto; background: #fff; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 6px 2px 2px; text-align: left; overscroll-behavior: contain; }`,
                        `        .filter-option-row { display: flex; align-items: center; padding: 0px 3px; cursor: pointer; user-select: none; white-space: nowrap; line-height: 1.0; }`,
					    `        .filter-option-meta_row_singular:hover { background-color: #f0f4f8; }`,
                		`        .filter-option-checkbox { appearance: none; width: 11px; height: 11px; box-sizing: border-box; border: 1px solid #999; border-radius: 2px; margin-right: 6px; flex-shrink: 0; cursor: pointer; position: relative; background-color: #fff; display: inline-grid; place-content: center; }`,
					    `        .filter-option-checkbox:checked { background-color: var(--color-first-action); border-color: var(--color-first-action); }`,
                        `        .filter-option-checkbox:checked::before { content: ""; width: 6px; height: 3px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translate(0.5px, -0.5px); }`,
                        `        .filter-option-label { font-size: 11px; line-height: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }`,
					    `    </style>`,
					    `</head>`,
					    `<body>`,
					    `  <div style="width: 100%; min-width: max-content; display: block; box-sizing: border-box;">`,

					    `            <span id="export-search-clear" class="search-clear-btn">&times;</span>`,

					    `        <button id="export-expand-all-cols-btn" class="hidden" style="background: #e5e5e5; border: 1px solid #ccc; border-radius: 3px; color: #777; cursor: pointer; font-size: 11px; font-weight: bold; padding: 2px 6px; line-height: 1; margin-left: 10px; user-select: none; display: inline-block;">+</button>`,

            class View {
                constructor(lang, tr) {
                    this.lang = lang;
                    this.tr = tr;
                    this.els = {};
                    this.#getElements();
                    Object.freeze(this.els);
                    this.#updateTranslations();
                }


                clearWarnings() {
                    this.els.warnings.replaceChildren();
                    this.els.warnings.style.display = "none";
                    this.els.output.classList.remove("hidden");
                    this.els.output.classList.remove("hidden");
                    if (this.els.searchStatusWrapper) {
                        this.els.searchStatusWrapper.classList.remove("hidden");
                    }
                }


				showWarning(context, messageKey, details = "") {
				    const colorClass = context === "file1" ? "highlight-first" : "highlight-second";
				    const message = this.tr[this.lang][messageKey] ?? messageKey;
				    const detailList = Array.isArray(details) ? details : [details];
				    detailList.forEach(detail => {
				        const fullMessage = `${message} ${detail}`.trim();
				        if (this.els.warnings.hasChildNodes()) {
				            this.els.warnings.append(document.createElement("br"));
				        }
				        const span = document.createElement("span");
				        span.className = colorClass;
				        span.textContent = fullMessage;
				        this.els.warnings.append(span);
				    });
				
				    this.els.warnings.style.display = "block";

					if (messageKey === "error_no_content_to_save" || messageKey === "error_no_csv_to_save") {
					    this.els.output.classList.add("hidden");
					    if (this.els.searchStatusWrapper) {
					        this.els.searchStatusWrapper.classList.add("hidden");
					    }
					}
                }


                displayCheckboxes(headers, targetContainer, namePrefix, selectedIndices = [], otherHeaders = []) {
                    if (!targetContainer) return;

                    targetContainer.style.display = "flex";
                    targetContainer.style.flexWrap = "wrap";
                    targetContainer.style.rowGap = "4px";
                    targetContainer.style.columnGap = "10px";

                    const isCheckedDefault = targetContainer !== this.els.checkboxes;
                    const fragment = document.createDocumentFragment();
                    const headersLen = headers.length;
                    const selectedSet = new Set(selectedIndices.map(Number));
                    const otherSet = (otherHeaders && otherHeaders.length > 0) 
                        ? new Set(otherHeaders.map(h => String(h || "").trim().toLowerCase())) 
                        : null;

                    for (let index = 0; index < headersLen; index++) {
                        const headerText = (headers[index] ?? "").trim();
                        if (!headerText) continue;

                        const wrapper = document.createElement("div");
                        wrapper.className = "checkbox-item";
                        wrapper.style.display = "inline-flex";
                        wrapper.style.alignItems = "center";
                        wrapper.style.gap = "4px";

                        const checkbox = document.createElement("input");
                        checkbox.type = "checkbox";
                        checkbox.id = `${namePrefix}-${index}`;
                        checkbox.value = index;
                        
                        if (targetContainer === this.els.checkboxes) {
                            checkbox.checked = selectedSet.has(index);
                        } else {
                            checkbox.checked = isCheckedDefault;
                        }

                        const label = document.createElement("label");
                        label.htmlFor = checkbox.id;
                        label.textContent = headerText;

						if (otherSet) {
						    const cleanText = headerText.toLowerCase();
						    if (!otherSet.has(cleanText)) {
						        if (namePrefix === "file1-col") {
						            label.className = "highlight-first";
						        } else if (namePrefix === "file2-col") {
						            label.className = "highlight-second";
						        } else if (namePrefix === "column") {
						            checkbox.disabled = true;
						            label.className = "highlight-first";
						        }
						    }
						}
                        wrapper.append(checkbox, label);
                        fragment.appendChild(wrapper);
                    }
 

                    if (namePrefix === "file1-col" || namePrefix === "file2-col") {
                        const toggleCheckbox = document.createElement("input");
                        toggleCheckbox.type = "checkbox";
                        toggleCheckbox.id = `toggle-all-${namePrefix}`;
                        toggleCheckbox.checked = true;

                        const toggleLabel = document.createElement("label");
                        toggleLabel.htmlFor = toggleCheckbox.id;
                        toggleLabel.style.fontWeight = "normal";
                        toggleLabel.append("(", toggleCheckbox, ")");

                        const toggleDiv = document.createElement("div");
                        toggleDiv.className = "checkbox-item toggle-all-container";
                        toggleDiv.style.display = "inline-flex";
                        toggleDiv.style.alignItems = "center";
                        toggleDiv.style.gap = "2px";
                        toggleDiv.style.marginLeft = "12px";
                        toggleDiv.append(toggleLabel);

                        fragment.appendChild(toggleDiv);
                    }

                    targetContainer.replaceChildren(fragment);
                }


                #getElements() {
                    this.els.body = document.body;
                    this.els.mainContainer = document.querySelector(".main-container") || document.body;
                    this.els.output = document.getElementById("output");
                    this.els.warnings = document.getElementById("warnings");
                    this.els.file1 = document.getElementById("file1");
                    this.els.file2 = document.getElementById("file2");
                    this.els.file1Name = document.getElementById("file1-name");
                    this.els.file2Name = document.getElementById("file2-name");
                    this.els.dropZone1 = document.getElementById("drop-zone-1");
                    this.els.dropZone2 = document.getElementById("drop-zone-2");
                    this.els.encodingToggle = document.getElementById("encoding-toggle");
                    this.els.file1CheckboxSection = document.getElementById("file1-checkbox-section");
                    this.els.file2CheckboxSection = document.getElementById("file2-checkbox-section");
                    this.els.onlyDifferences = document.getElementById("only-differences");
                    this.els.onlyDifferencesContainer = document.getElementById("only-differences-container");
                    this.els.hideIdenticalColumns = document.getElementById("hide-identical-columns");
                    this.els.hideIdenticalColumnsContainer = document.getElementById("hide-identical-columns-container");
                    this.els.includeEmptyLines = document.getElementById("include-empty-lines");
                    this.els.replaceDelimiterWithSpace = document.getElementById("replace-delimiter-with-space");
                    this.els.unifyDates = document.getElementById("unify-dates");
                    this.els.asTable = document.getElementById("as-table");
                    this.els.activateFilter = document.getElementById("activate-filter");
                    this.els.outputOptionsContainer = document.getElementById("output-options-container");
                    this.els.keyColumnContainer = document.getElementById("key-column-container");
                    this.els.asTableContainer = document.getElementById("as-table-container");
                    this.els.replaceDelimiterContainer = document.getElementById("replace-delimiter-container");
                    this.els.checkboxes = document.getElementById("checkboxes");
                    this.els.checkboxesFile1 = document.getElementById("checkboxes-file1");
                    this.els.checkboxesFile2 = document.getElementById("checkboxes-file2");
                    this.els.scrollToTopBtn = document.getElementById("scroll-to-top-btn");
                    this.els.searchStatusWrapper = document.querySelector(".search-status-wrapper");
                    this.els.bottomContainer = document.querySelector(".bottom-container");
                    this.els.globalSearch = document.getElementById("meta_search_placeholder");
                    this.els.i18n = {};
                    Object.keys(this.tr[this.lang]).forEach(
                        (key) => (this.els.i18n[key] = document.getElementById(key))
                    );
                }


                reset(isSoftReset = false) {
                    if (!isSoftReset) {
                        this.els.file1.value = "";
                        this.els.file2.value = "";
                        this.els.file1Name.textContent = this.tr[this.lang].file_none_selected;
                        this.els.file2Name.textContent = this.tr[this.lang].file_none_selected;
                        this.els.checkboxes.replaceChildren();
                        this.els.keyColumnContainer.classList.add("hidden");
                        this.els.encodingToggle.disabled = false;
                        this.els.encodingToggle.checked = false;
                    }
                    this.clearWarnings();
                    this.els.checkboxesFile1.replaceChildren();
                    this.els.checkboxesFile2.replaceChildren();
                    this.els.keyColumnContainer.classList.add("hidden");
                    this.els.file1CheckboxSection.classList.add("hidden");
                    this.els.file2CheckboxSection.classList.add("hidden");
                    this.els.outputOptionsContainer.classList.add("hidden");                    
                    
                    this.els.asTable.checked = true;
                    this.els.activateFilter.checked = true;
                    this.els.onlyDifferences.checked = false;
                    this.els.hideIdenticalColumns.checked = false;
                    this.els.includeEmptyLines.checked = false;
                    this.els.includeEmptyLines.disabled = true;
                    this.els.replaceDelimiterWithSpace.checked = false;
                    this.els.unifyDates.checked = true;
                    if (!isSoftReset) {
                        this.els.outputOptionsContainer.classList.add("hidden");
                    }

                }


                updateFileName(fileInputId, fileName) {
                    const span = this.els[`${fileInputId}Name`];
                    if (span) {
                        span.textContent = fileName || this.tr[this.lang].file_none_selected;
                    }
                }


                #updateTranslations() {
                    Object.keys(this.tr[this.lang]).forEach((key) => {
                        const el = this.els.i18n[key];
                        if (el) {
                            if (el.tagName === "INPUT") {
                                el.placeholder = this.tr[this.lang][key];
                            } else {
                                el.textContent = this.tr[this.lang][key];
                            }
                        }
                    });
                }

            }

            document.addEventListener("DOMContentLoaded", () => {
                new App();
            });

        </script>

        <script src="https://cdn.jsdelivr.net/npm/read-excel-file@9.x/bundle/read-excel-file.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.3/umd/index.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/txml@6.0.0/dist/txml.min.js"></script>

    </body>
