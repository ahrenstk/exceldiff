            class Utility {

                static escapeHTML(str) {
                    if (str == null) return "";
                    const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" };
                    return String(str).replace(/[&<>"']/g, (m) => map[m]);
                }


				static formatDates(data, unify = true, lang = "en") {
				    if (!data || !Array.isArray(data)) return data;
				    const deRegex = /^\s*(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?\s*$/;
				    const usRegex = /^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?\s*$/;
				    return data.map(row => {
				        if (!Array.isArray(row)) return row;
				        return row.map(cell => {
				            if (cell instanceof Date) {
				                if (!unify) {
				                    return cell.toLocaleString(lang, {
				                        year: 'numeric',
				                        month: '2-digit',
				                        day: '2-digit',
				                        hour: '2-digit',
				                        minute: '2-digit',
				                        second: '2-digit'
				                    });
				                }
				                const year = cell.getFullYear();
				                const month = (cell.getMonth() + 1).toString().padStart(2, '0');
				                const day = cell.getDate().toString().padStart(2, '0');
				                return `${year}-${month}-${day}`;
				            }
				            if (!unify) {
				                return cell;
				            }
				            if (typeof cell !== 'string' || !cell.trim()) {
				                return cell;
				            }
				            let match = cell.match(deRegex);
				            if (match) {
				                const day = match[1].padStart(2, '0');
				                const month = match[2].padStart(2, '0');
				                const year = match[3];
				                return `${year}-${month}-${day}`;
				            }
				            match = cell.match(usRegex);
				            if (match) {
				                const month = match[1].padStart(2, '0');
				                const day = match[2].padStart(2, '0');
				                const year = match[3];
				                return `${year}-${month}-${day}`;
				            }
				            return cell;
				        });
				    });
				}
				
				
                static getCellData(cellObj) {
                    if (cellObj == null) {
                        return { type: Comparer.CellStatus.UNCHANGED, value: "", oldValue: "", newValue: "" };
                    }

                    if (typeof cellObj !== "object") {
                        const val = String(cellObj);
                        return { type: Comparer.CellStatus.UNCHANGED, value: val, oldValue: val, newValue: val };
                    }

                    const value = cellObj.value != null ? String(cellObj.value) : "";

                    return {
                        type: cellObj.type ?? Comparer.CellStatus.UNCHANGED,
                        value,
                        oldValue: cellObj.oldValue != null ? String(cellObj.oldValue) : value,
                        newValue: cellObj.newValue != null ? String(cellObj.newValue) : value,
                    };
                }


                static escapeRegExp(str) {
                    return typeof str === "string" ? str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") : "";
                }


				static getTimestamp() {
				    const now = new Date();
				    const year = now.getFullYear();
				    const month = String(now.getMonth() + 1).padStart(2, "0");
				    const day = String(now.getDate()).padStart(2, "0");
				    const hours = String(now.getHours()).padStart(2, "0");
				    const minutes = String(now.getMinutes()).padStart(2, "0");
				    return `${year}-${month}-${day}-${hours}${minutes}`;
				}
				

                static removeEmptyColumns(data) {
                    if (!data?.length) return [];

                    const validIndices = data[0].reduce((acc, cell, i) => {
                        if (cell && String(cell).trim()) acc.push(i);
                        return acc;
                    }, []);

                    return data.map((row) => validIndices.map((i) => row[i]));
                }


                static replaceDelimiters(data, delimiters, shouldReplace = true) {
                    const isEnabled =
                        typeof shouldReplace === "object" ? shouldReplace?.replaceDelimiter : shouldReplace;
                    if (!isEnabled || !delimiters?.length || !data?.length) return data;

                    const pattern = delimiters.map(Utility.escapeRegExp).filter(Boolean).join("|");
                    if (!pattern) return data;

                    const regex = new RegExp(pattern, "g");
                    return data.map((row) =>
                        row.map((cell) => (typeof cell === "string" ? cell.replace(regex, " ") : cell))
                    );
                }

                static removeHTMLTags(str) {
                    return typeof str === "string" ? str.replace(/<[^>]*>/g, "") : "";
                }
                

                static getOptimalColumnWidth(headerText, maxDataLength) {

                    const dataWidth = Math.max(maxDataLength, 8) * 8 + 20;
                    const cleanHeader = Utility.removeHTMLTags(headerText || "");
                    const words = cleanHeader.split(/\s+/).filter(Boolean);

                    if (words.length <= 1) {
                        return Math.max(dataWidth, cleanHeader.length * 8 + 30);
                    }

                    const longestWordLen = Math.max(...words.map(w => w.length));
                    let limit = longestWordLen;
                    for (; limit <= cleanHeader.length; limit++) {
                        let linesCount = 0;
                        let currentLen = 0;
                        
                        for (let i = 0; i < words.length; i++) {
                            const word = words[i];
                            const addedLen = word.length + (currentLen > 0 ? 1 : 0);
                            if (currentLen + addedLen <= limit) {
                                currentLen += addedLen;
                            } else {
                                linesCount++;
                                currentLen = word.length;
                            }
                        }
                        if (currentLen > 0) {
                            linesCount++;
                        }

                        if (linesCount <= 3) {
                            break;
                        }
                    }

                    const minWordWidth = longestWordLen * 8 + 35;
                    const headerWidth = limit * 8 + 35;

                    return Math.max(dataWidth, headerWidth, minWordWidth);
                }

            }


            class Exporter {

				#downloadFile(content, mimeType, fileExtension) {
				    const url = URL.createObjectURL(new Blob([content], { type: `${mimeType};charset=utf-8;` }));
				    const link = Object.assign(document.createElement("a"), {
				        href: url,
				        download: `${Utility.getTimestamp()}.${fileExtension}`,
				    });
				    document.body.appendChild(link);
				    link.click();
				    link.remove();
				    URL.revokeObjectURL(url);
				}
				

                exportAsCSV(selectedText) {
                    this.#downloadFile(`\uFEFF${selectedText}`, "text/csv", "csv");
                }


                exportAsHTML(htmlContent) {
                    this.#downloadFile(htmlContent, "text/html", "html");
                }
            }


            class DataManager {

				constructor(config = {}, lang = "de", tr = {}) {
				        this.config = config;
				        this.lang = lang;
				        this.tr = tr;
				    }


 
                #normalizeRows(rows, fileIndex = 1) {
                    if (!rows?.length) return [];

                    const validRows = [];

                    for (let i = 0; i < rows.length; i++) {
                        const row = rows[i];
                        if (!Array.isArray(row)) continue;

                        let lastNonEmptyIdx = -1;
                        for (let j = 0; j < row.length; j++) {
                            const cell = row[j];
                            if (cell != null && String(cell).trim() !== "") {
                                lastNonEmptyIdx = j;
                            }
                        }

                        if (lastNonEmptyIdx !== -1) {
                            const sliced = row.slice(0, lastNonEmptyIdx + 1);
                            const cleanRow = sliced.map(val => {
                                if (val == null) return "";
                                if (val instanceof Date) return val;
                                return String(val).replace(/\r/g, "").trim();
                            });
                            validRows.push(cleanRow);
                        }
                    }

                    return validRows;
                }



 
 

				async #parseCSV(file, encoding = "UTF-8", fileIndex = 1) {
				    const encodingParam = encoding.toUpperCase() === "ANSI" ? "windows-1252" : "utf-8";
				
				    return new Promise((resolve, reject) => {
				        if (window.Papa) {
				            Papa.parse(file, {
				                encoding: encodingParam,
				                complete: (results) => {
				                    try {
				                        resolve(this.#normalizeRows(results.data, fileIndex));
				                    } catch (err) {
				                        reject(err);
				                    }
				                },
				                error: (err) => reject(err),
				                skipEmptyLines: true,
				            });


				        } else {
				            reject({
				                messageKey: "error_library_missing",
				                details: "'PapaParse'"
				            });
				        }
				    });
				}
				

                async #parseExcel(file, fileIndex = 1) {
                    if (typeof readXlsxFile === "undefined" && typeof readSheet === "undefined") {
                        throw {
                            messageKey: "error_library_missing",
                            details: "'read-excel-file'",
                        };
                    }

                    try {
                        let rows;
                        if (typeof readSheet === "function") {
                            rows = await readSheet(file);
                        } else if (typeof readXlsxFile?.readSheet === "function") {
                            rows = await readXlsxFile.readSheet(file);
                        } else {
                            const result = await readXlsxFile(file);
                            rows = result?.[0]?.data ?? result;
                        }

                        if (!rows || !rows.length) {
                            return [];
                        }

                        return this.#normalizeRows(rows, fileIndex);
                    } catch (err) {
                        throw {
                            messageKey: fileIndex === 1 ? "error_file1_read" : "error_file2_read",
                            details: `${this.tr[this.lang]["error_excel_prefix"] || "(Excel)"} ${err.message}`
                        };
                    }
                }


				async parseFile(file, encoding = "UTF-8", fileIndex = 1) {
				    const extension = file.name.includes(".") ? file.name.split(".").pop().toLowerCase() : "";
				    let parsedData;
				
				    switch (extension) {
				        case "csv":
				        case "txt":
				            parsedData = await this.#parseCSV(file, encoding, fileIndex);
				            break;
				        case "ods":
				            parsedData = await this.#parseODS(file, fileIndex);
				            break;
				        case "xlsx":
				            parsedData = await this.#parseExcel(file, fileIndex);
				            break;
				        default:
				            throw {
				                messageKey: fileIndex === 1 ? "error_file1_unsupported_format" : "error_file2_unsupported_format",
				                details: `.${extension}`,
				            };
				    }
				
				    if (!parsedData || parsedData.length === 0) {
				        throw {
				            messageKey: fileIndex === 1 ? "val_file1_empty" : "val_file2_empty"
				        };
				    }
				
				    if (parsedData.length < 2) {
				        throw {
				            messageKey: fileIndex === 1 ? "error_file1_parsing" : "error_file2_parsing"
				        };
				    }
				
				    const headers = parsedData[0];
				    
				    if (!headers || headers.length === 0 || headers.every(h => String(h || "").trim() === "")) {
				        throw {
				            messageKey: fileIndex === 1 ? "error_file1_parsing" : "error_file2_parsing"
				        };
				    }
				
				    const headerSet = new Set();
				    const duplicateHeaders = new Set();
				    
				    for (let i = 0; i < headers.length; i++) {
				        const hName = String(headers[i] || "").trim().toLowerCase();
				        if (hName === "") continue;
				        if (headerSet.has(hName)) {
				            duplicateHeaders.add(`"${headers[i]}"`);
				        } else {
				            headerSet.add(hName);
				        }
				    }
				    
				    if (duplicateHeaders.size > 0) {
				        throw {
				            messageKey: fileIndex === 1 ? "val_file1_column_not_unique" : "val_file2_column_not_unique",
				            details: Array.from(duplicateHeaders)
				        };
				    }
				
				    let mismatchedRowsCount = 0;
				    const expectedColCount = headers.length;
				    for (let r = 1; r < parsedData.length; r++) {
				        if (parsedData[r].length !== expectedColCount) {
				            mismatchedRowsCount++;
				        }
				    }
				
				    if ((mismatchedRowsCount / (parsedData.length - 1) > 0.2) || (expectedColCount === 1 && mismatchedRowsCount > 0)) {
				        throw {
                            messageKey: fileIndex === 1 ? "error_file1_parsing" : "error_file2_parsing"
				        };
				    }
				
				    const mismatchedRowsDetails = [];
				    for (let r = 1; r < parsedData.length; r++) {
				        if (parsedData[r].length > expectedColCount) {
				            const rowPrefix = parsedData[r]
				                .slice(0, 3)
				                .map(cell => cell == null ? "" : String(cell).trim())
				                .join("; ");
				            mismatchedRowsDetails.push(`"${rowPrefix}"`);
				        }
				    }
				
				    if (mismatchedRowsDetails.length > 0) {
				        throw {
				            messageKey: fileIndex === 1 ? "val_file1_too_many_columns" : "val_file2_too_many_columns",
				            details: mismatchedRowsDetails
				        };
				    }
				
				    const uniqueRows = new Set();
				    let hasTotalDuplicates = false;
				    for (let r = 1; r < parsedData.length; r++) {
				        const rowString = parsedData[r].map(cell => String(cell ?? "").trim()).join("§§§");
				        
				        if (rowString.replace(/§§§/g, "") === "") continue;
				        if (uniqueRows.has(rowString)) {
				            hasTotalDuplicates = true;
				            break; 
				        }
				        uniqueRows.add(rowString);
				    }
				
				    if (hasTotalDuplicates) {
				        throw {
				            messageKey: fileIndex === 1 ? "error_file1_parsing" : "error_file2_parsing"
				        };
				    }
				
				    let maxCols = -1;
				    for (let i = 0; i < parsedData.length; i++) {
				        if (parsedData[i].length - 1 > maxCols) {
				            maxCols = parsedData[i].length - 1;
				        }
				    }
				    const targetLength = maxCols + 1;
				    for (let i = 0; i < parsedData.length; i++) {
				        const r = parsedData[i];
				        while (r.length < targetLength) {
				            r.push("");
				        }
				    }
				
				    return parsedData;
				}
				

                 async #parseODS(file, fileIndex = 1) {
                    if (typeof fflate === "undefined") {
                        throw { messageKey: "error_library_missing", details: "'fflate'" };
                    }
                    const tXmlInstance =
                        typeof tXml !== "undefined"
                            ? tXml
                            : typeof txml !== "undefined"
                              ? txml
                              : window?.tXml || window?.txml;
                    if (!tXmlInstance) {
                        throw { messageKey: "error_library_missing", details: "'txml'" };
                    }
                    const bytes = new Uint8Array(await file.arrayBuffer());
                    return new Promise((resolve, reject) => {
                        fflate.unzip(bytes, (err, unzipped) => {
                        
                            const errorKey = fileIndex === 1 ? "error_file1_read" : "error_file2_read";
                            
                            if (err) {
                                return reject({ messageKey: errorKey, details: `(ODS) ${err.message}` });
                            }
                            const contentXmlData = unzipped["content.xml"];
                            if (!contentXmlData) {
                                return reject({ 
                                    messageKey: errorKey, 
                                    details: this.tr[this.lang]["error_ods_content_missing"] || "(ODS) content.xml missing" 
                                });
                            }
                            try {
                                const xmlString = new TextDecoder("utf-8").decode(contentXmlData);
                                const parseFn = typeof tXmlInstance === "function" ? tXmlInstance : tXmlInstance.parse;
                                if (!parseFn) {
                                    throw {
                                        messageKey: errorKey,
                                        details: this.tr[this.lang]["error_ods_parser_missing"]
                                    };
                                }
                       

                                const parsedXml = parseFn(xmlString);

                                const getLocalName = (node) =>
                                    typeof node === "object" && node?.tagName ? node.tagName.split(":").pop() : "";
                                const extractText = (children) => {
                                    if (!children) return "";
                                    if (typeof children === "string") return children;
                                    if (!Array.isArray(children)) return "";
                                    return children
                                        .map((c) => (typeof c === "string" ? c : extractText(c.children)))
                                        .join("");
                                };
                                const findRows = (nodes) => {
                                    if (!Array.isArray(nodes)) return [];
                                    const rows = [];
                                    const stack = [...nodes];
                                    while (stack.length > 0) {
                                        const node = stack.pop();
                                        if (typeof node !== "object" || !node) continue;
                                        if (getLocalName(node) === "table-row") {
                                            rows.push(node);
                                        } else if (Array.isArray(node.children)) {
                                            stack.push(...node.children);
                                        }
                                    }
                                    return rows.reverse();
                                };
                                const allRows = findRows(parsedXml)
                                    .map((row) => {
                                        const cells = (row.children || []).filter(
                                            (c) => getLocalName(c) === "table-cell"
                                        );
                                        return cells.flatMap((cell) => {
                                            const repeatedAttr =
                                                cell.attributes?.["table:number-columns-repeated"] ||
                                                cell.attributes?.["number-columns-repeated"];
                                            const repeatedColumns = repeatedAttr ? parseInt(repeatedAttr, 10) : 1;
                                            const pNodes = (cell.children || []).filter((c) => getLocalName(c) === "p");
                                            const cellValue = pNodes
                                                .map((p) => extractText(p.children))
                                                .join("\\n")
                                                .trim();
                                            return Array(repeatedColumns).fill(cellValue);
                                        });
                                    })
                                    .filter((row) => row.length > 0 && row.some((cell) => cell.trim() !== ""));
                                resolve(this.#normalizeRows(allRows, fileIndex));
                            } catch (parseErr) {
                                    reject({
                                    messageKey: errorKey,
                                    details: `(ODS) ${parseErr.messageKey ? parseErr.details : parseErr.message}`,
                                });
                            }
                        });
                    });
                }

             class Comparer {
                static RowStatus = Object.freeze({
                    UNCHANGED: "unchanged",
                    MODIFIED: "modified",
                    DELETED: "deleted",
                    ADDED: "added",
                });

                static CellStatus = Object.freeze({
                    UNCHANGED: "unchanged",
                    DIFFERENCE: "difference",
                    DELETED: "deleted",
                    ADDED: "added",
                });

                constructor(lang, tr) {
                    this.lang = lang;
                    this.tr = tr;
                }


				 #buildDataMap(data1, data2, cols1, cols2, keyIndices1, keyIndices2, delimiters) {
				     const headers1 = data1[0] || [];
				     const headers2 = data2[0] || [];
				     const finalHeaders1 = cols1.map((i) => headers1[i] || "");
				     const finalHeaders2 = cols2.map((i) => headers2[i] || "");
				     const file1Data = [finalHeaders1];
				     const file2Data = [finalHeaders2];
				     const dataMap = new Map();
				
				     const headerMap2 = new Map(finalHeaders2.map((h, i) => [h, i]));
				     const idx1ToIdx2Map = finalHeaders1.map(h => headerMap2.has(h) ? headerMap2.get(h) : -1);
				
				     const processRow = (row, cols, keyIndices) => {
				         if (!row) return null;
				         let hasAnyValidKey = false;
				         let isRowCompletelyEmpty = true;
				
				         for (let k = 0; k < cols.length; k++) {
				             const val = row[cols[k]];
				             if (val != null && String(val).trim() !== "") {
				                 isRowCompletelyEmpty = false;
				                 break;
				             }
				         }
				
				         if (isRowCompletelyEmpty) return null;
				
				         const keyParts = new Array(keyIndices.length);
				         for (let k = 0; k < keyIndices.length; k++) {
				             const val = row[cols[keyIndices[k]]];
				             const str = val == null ? "" : String(val).trim();
				             if (str !== "") hasAnyValidKey = true;
				             keyParts[k] = str;
				         }
				
				         return hasAnyValidKey ?
				             {
				                 key: keyParts.join(delimiters.valueDelimiter),
				                 lazyRow: cols.map((idx) => row[idx])
				             } :
				             null;
				     };
				
				     for (let i = 1; i < data1.length; i++) {
				         const processed = processRow(data1[i], cols1, keyIndices1);
				         if (!processed) continue;
				         file1Data.push(processed.lazyRow);
				         dataMap.set(processed.key, {
				             row1: processed.lazyRow,
				             status: Comparer.RowStatus.DELETED
				         });
				     }
				
				     for (let i = 1; i < data2.length; i++) {
				         const processed = processRow(data2[i], cols2, keyIndices2);
				         if (!processed) continue;
				         file2Data.push(processed.lazyRow);
				
				         const entry = dataMap.get(processed.key);
				         if (entry) {
				             entry.row2 = processed.lazyRow;
				             if (entry.row1) {
				                 let isDifferent = false;
				
				                 for (let idx1 = 0; idx1 < finalHeaders1.length; idx1++) {
				                     const idx2 = idx1ToIdx2Map[idx1];
				
				                     const val1 = String(entry.row1[idx1] ?? "").trim();
				                     const val2 = idx2 !== -1 ? String(processed.lazyRow[idx2] ?? "").trim() : "";
				                     if (val1 !== val2) {
				                         isDifferent = true;
				                         break;
				                     }
				                 }
				
				                 if (!isDifferent) {
				                     for (let idx2 = 0; idx2 < finalHeaders2.length; idx2++) {
				                         const h2 = finalHeaders2[idx2];
				                         if (!finalHeaders1.includes(h2)) {
				                             const val2 = String(processed.lazyRow[idx2] ?? "").trim();
				                             if (val2 !== "") {
				                                 isDifferent = true;
				                                 break;
				                             }
				                         }
				                     }
				                 }
				
				                 entry.status = isDifferent ? Comparer.RowStatus.MODIFIED : Comparer.RowStatus.UNCHANGED;
				             } else {
				                 entry.status = Comparer.RowStatus.ADDED;
				             }
				         } else {
				             dataMap.set(processed.key, {
				                 row1: null,
				                 row2: processed.lazyRow,
				                 status: Comparer.RowStatus.ADDED,
				             });
				         }
				     }
				     const res1 = this.#validateKeyUniqueness(
				         file1Data,
				         "file1",
				         "highlight-first",
				         keyIndices1,
				         delimiters
				     );
				     const res2 = this.#validateKeyUniqueness(
				         file2Data,
				         "file2",
				         "highlight-second",
				         keyIndices2,
				         delimiters
				     );
				
				     if (res1.hasCriticalError || res2.hasCriticalError) {
				         return {
				             error: {
				                 warnings: [...res1.warnings, ...res2.warnings],
				                 differences: [],
				                 headers: [],
				             },
				         };
				     }
				
				     return {
				         dataMap,
				         finalHeaders1,
				         finalHeaders2,
				         warnings: [...res1.warnings, ...res2.warnings]
				     };
				 }

 
 

                #buildHeaderIndexMaps(headers1, headers2, cols1, cols2, rawKeyColumns) {
                    const headerMap1 = new Map(
                        cols1.map((colIdx, i) => [String(headers1[colIdx] || "").trim(), i]).filter(([h]) => h !== "")
                    );
                    const headerMap2 = new Map(
                        cols2.map((colIdx, i) => [String(headers2[colIdx] || "").trim(), i]).filter(([h]) => h !== "")
                    );

                    const keyIndices1 = [];
                    const keyIndices2 = [];

                    for (let i = 0; i < rawKeyColumns.length; i++) {
                        const rawKeyName = headers1[rawKeyColumns[i]];
                        const keyName = String(rawKeyName || "").trim();
                        const idx1 = headerMap1.get(keyName);
                        const idx2 = headerMap2.get(keyName);

                        if (idx1 === undefined || idx2 === undefined) {
                            const missingKeyName = rawKeyName || (this.tr[this.lang]["meta_unknown"]);
                            return {
                                error: {
                                    warnings: [
                                        {
                                            context: "file2",
                                            messageKey: "val_cross_key_not_found_in_file2",
                                            details: `"${missingKeyName}"`,
                                        },
                                    ],
                                    differences: [],
                                    headers: [],
                                },
                            };
                        }
                        keyIndices1.push(idx1);
                        keyIndices2.push(idx2);
                    }

                    return { headerMap1, headerMap2, keyIndices1, keyIndices2 };
                }


                compareFiles(data1, data2, options) {
                    const { keyColumns: rawKeyColumns, cols1, cols2, valueDelimiter, columnDelimiter } = options;

                    const headers1 = data1[0] || [];
                    const headers2 = data2[0] || [];

                    const headerRes = this.#buildHeaderIndexMaps(headers1, headers2, cols1, cols2, rawKeyColumns);
                    if (headerRes.error) return headerRes.error;
                    const { keyIndices1, keyIndices2 } = headerRes;

                    const dataRes = this.#buildDataMap(data1, data2, cols1, cols2, keyIndices1, keyIndices2, {
                        valueDelimiter,
                        columnDelimiter,
                    });
                    if (dataRes.error) return dataRes.error;
                    const { dataMap, finalHeaders1, finalHeaders2, warnings } = dataRes;

                    const selectedHeaders1 = cols1.map((i) => (headers1[i] || "").trim());
                    const selectedHeaders2 = cols2.map((i) => (headers2[i] || "").trim());

                    const allHeaders = [];
                    const seenHeaders = new Set();
                    [...selectedHeaders1, ...selectedHeaders2].forEach((h) => {
                        if (h && !seenHeaders.has(h)) {
                            seenHeaders.add(h);
                            allHeaders.push(h);
                        }
                    });

                    const headerMap1 = new Map(finalHeaders1.map((h, i) => [h, i]));
                    const headerMap2 = new Map(finalHeaders2.map((h, i) => [h, i]));
                    const keyHeaderNamesSet = new Set(keyIndices1.map((idx) => finalHeaders1[idx]));

                    const diffRes = this.#createDiffRows(
                        dataMap,
                        allHeaders,
                        headerMap1,
                        headerMap2,
                        keyHeaderNamesSet
                    );

                    return {
                        warnings,
                        differences: diffRes.differences,
                        headers: diffRes.headers,
                        stats: diffRes.stats,
                    };
                }


                #createDiffRows(dataMap, allHeaders, headerMap1, headerMap2, keyHeaderNamesSet) {
                    const allHeadersCount = allHeaders.length;
                    const map1Indices = new Int32Array(allHeadersCount);
                    const map2Indices = new Int32Array(allHeadersCount);
                    const isKeyFlags = new Uint8Array(allHeadersCount);

                    for (let i = 0; i < allHeadersCount; i++) {
                        const header = allHeaders[i];
                        map1Indices[i] = headerMap1.has(header) ? headerMap1.get(header) : -1;
                        map2Indices[i] = headerMap2.has(header) ? headerMap2.get(header) : -1;
                        isKeyFlags[i] = keyHeaderNamesSet.has(header) ? 1 : 0;
                    }

                    const differences = [];
                    let countMatching = 0;
                    let countOnlyFile1 = 0;
                    let countOnlyFile2 = 0;

                    for (const entry of dataMap.values()) {
                        const diffRow = new Array(allHeadersCount);
                        const { status, row1: r1, row2: r2 } = entry;

                        switch (status) {
                            case Comparer.RowStatus.UNCHANGED:
                            case Comparer.RowStatus.MODIFIED:
                                countMatching++;
                                break;
                            case Comparer.RowStatus.DELETED:
                                countOnlyFile1++;
                                break;
                            case Comparer.RowStatus.ADDED:
                                countOnlyFile2++;
                                break;
                        }

                        for (let i = 0; i < allHeadersCount; i++) {
                            const header = allHeaders[i];
                            const idx1 = map1Indices[i];
                            const idx2 = map2Indices[i];
                            const val1 = r1 && idx1 !== -1 ? (r1[idx1] ?? "") : "";
                            const val2 = r2 && idx2 !== -1 ? (r2[idx2] ?? "") : "";

                            switch (status) {
                                case Comparer.RowStatus.UNCHANGED:
                                    diffRow[i] = {
                                        type: Comparer.CellStatus.UNCHANGED,
                                        value: val1,
                                        columnName: header,
                                    };
                                    break;
                                case Comparer.RowStatus.MODIFIED: {
                                    const s1 = String(val1).trim();
                                    const s2 = String(val2).trim();
                                    diffRow[i] =
                                        s1 !== s2
                                            ? {
                                                  type: Comparer.CellStatus.DIFFERENCE,
                                                  oldValue: val1,
                                                  newValue: val2,
                                                  columnName: header,
                                              }
                                            : { type: Comparer.CellStatus.UNCHANGED, value: val1, columnName: header };
                                    break;
                                }
                                case Comparer.RowStatus.DELETED:
                                    diffRow[i] = {
                                        type: Comparer.CellStatus.DELETED,
                                        oldValue: val1,
                                        columnName: header,
                                    };
                                    break;
                                case Comparer.RowStatus.ADDED:
                                    diffRow[i] = {
                                        type: Comparer.CellStatus.ADDED,
                                        newValue: val2,
                                        columnName: header,
                                    };
                                    break;
                            }
                        }
                        differences.push(diffRow);
                    }

                    const headerObjects = new Array(allHeadersCount);
                    for (let i = 0; i < allHeadersCount; i++) {
                        headerObjects[i] = {
                            name: allHeaders[i],
                            isKey: isKeyFlags[i] === 1,
                            onlyInFile1: map2Indices[i] === -1,
                            onlyInFile2: map1Indices[i] === -1
                        };
                    }

                    const diffCount = differences.length;

                    return {
                        differences,
                        headers: headerObjects,
                        stats: {
                            displayedRows: diffCount,
                            totalRows: diffCount,
                            countMatching,
                            countOnlyFile1,
                            countOnlyFile2,
                        },
                    };
                }


				processDuplicateConsolidation(data, selectedColumns, duplicateDelimiter, options = {}) {
				    if (!data || data.length < 2) return { success: true, data: [] };
				
				    const dataLen = data.length;
				    for (let r = 1; r < dataLen; r++) {
				        const row = data[r];
				        if (!row) continue;
				        const rowLen = row.length;
				        for (let c = 0; c < rowLen; c++) {
				            const cellValue = String(row[c] ?? "");
				            if (duplicateDelimiter && cellValue.includes(duplicateDelimiter)) {
				                return { success: false, reason: "HAS_DUPLICATE_DELIMITER", value: cellValue };
				            }
				        }
				    }
				
				    const map = new Map();
				    const valDelimiter = options.valueDelimiter || "~";
				    const textCollator = new Intl.Collator(this.lang || "en", { sensitivity: "base", numeric: true });
				    const selColCount = selectedColumns.length;

                    for (let r = 1; r < dataLen; r++) {
                        const row = data[r];
                        if (!row) continue;

                        let isAllEmpty = true;
                        const rowLen = row.length;
                        for (let c = 0; c < rowLen; c++) {
                            if (String(row[c] ?? "").trim() !== "") {
                                isAllEmpty = false;
                                break;
                            }
                        }
                        if (isAllEmpty) continue;

                        const keyParts = new Array(selColCount);
                        for (let k = 0; k < selColCount; k++) {
                            keyParts[k] = String(row[selectedColumns[k]] ?? "").trim();
                        }
                        const key = keyParts.join(valDelimiter);

                        let entry = map.get(key);

                        if (!entry) {
                            entry = new Array(rowLen);
                            for (let c = 0; c < rowLen; c++) {
                                const val = String(row[c] ?? "").trim();
                                const valueSet = new Set();
                                if (val !== "") valueSet.add(val);
                                entry[c] = valueSet;
                            }
                            map.set(key, entry);
                        } else {
                            for (let c = 0; c < rowLen; c++) {
                                const val = String(row[c] ?? "").trim();
                                if (val !== "") {
                                    entry[c].add(val);
                                }
                            }
                        }
                    }

                    const processedRows = [];
                    for (const entrySets of map.values()) {
                        const rowLen = entrySets.length;
                        const finalRow = new Array(rowLen);

                        for (let c = 0; c < rowLen; c++) {
                            const set = entrySets[c];
                            if (set.size === 0) {
                                finalRow[c] = "";
                            } else if (set.size === 1) {
                                finalRow[c] = set.values().next().value;
                            } else {
                                const parts = Array.from(set);
                                parts.sort(textCollator.compare);
                                finalRow[c] = parts.join(duplicateDelimiter);
                            }
                        }
                        processedRows.push(finalRow);
                    }
                    map.clear();

                    return { success: true, data: processedRows };
                }


                #validateKeyUniqueness(data, fileName, colorClass, keyColumns, delimiters) {
                    const warnings = [];
                    const entityCount = new Map();
                    const headerCount = new Map();
                    let hasCriticalError = false;
                    let foundEmptyKey = false;

                    const valDelimiter = delimiters.valueDelimiter ?? "~";
                    const colDelimiter = delimiters.columnDelimiter ?? ";";

                    const headers = data[0];
                    if (headers) {
                        for (let i = 0; i < headers.length; i++) {
                            const header = String(headers[i] ?? "");
                            const count = (headerCount.get(header) || 0) + 1;
                            headerCount.set(header, count);
                        }

                        const headerMsgKey =
                            fileName === "file1" ? "val_file1_column_not_unique" : "val_file2_column_not_unique";
                        for (const [header, count] of headerCount) {
                            if (count > 1) {
                                hasCriticalError = true;
                                warnings.push({
                                    context: fileName,
                                    messageKey: headerMsgKey,
                                    details: `"${Utility.escapeHTML(header)}"`,
                                });
                            }
                        }
                    }

                    const isFile1 = fileName === "file1";
                    const recordMsgKey = isFile1 ? "val_file1_record_not_unique" : "val_file2_record_not_unique";
                    const keyColCount = keyColumns.length;

                    for (let i = 1; i < data.length; i++) {
                        const row = data[i];
                        if (!Array.isArray(row)) continue;

                        let hasEmptyPart = false;
                        const keyParts = new Array(keyColCount);

                        for (let k = 0; k < keyColCount; k++) {
                            const part = String(row[keyColumns[k]] ?? "").trim();
                            if (!part) {
                                hasEmptyPart = true;
                                break;
                            }
                            keyParts[k] = part;
                        }

                        if (hasEmptyPart) {
                            foundEmptyKey = true;
                            break;
                        }

                        const key = keyParts.join(valDelimiter);
                        const currentCount = entityCount.get(key) || 0;

                        if (currentCount === 1) {
                            hasCriticalError = true;
                            const rawDisplayKey = keyParts.join(`${colDelimiter} `);
                            let decodedKey = rawDisplayKey;

                            if (rawDisplayKey.includes("%")) {
                                try {
                                    decodedKey = decodeURIComponent(rawDisplayKey);
                                } catch (e) {}
                            }

                            warnings.push({
                                context: fileName,
                                messageKey: recordMsgKey,
                                details: `"${Utility.escapeHTML(decodedKey)}"`,
                            });
                        }

                        entityCount.set(key, currentCount + 1);
                    }

                    if (foundEmptyKey) {
                        hasCriticalError = true;
                        warnings.push({
                            context: fileName,
                            messageKey: isFile1 ? "val_file1_empty_keys" : "val_file2_empty_keys",
                        });
                    }

                    return { warnings, hasCriticalError };
                }
            }

				#applyColumnSorting(header, table) {
				    const tbody = table.tBodies[0];
				    if (!tbody) return;
				
				    const columnIndex = header.cellIndex;
				    const rows = Array.from(tbody.rows);
				    const rowCount = rows.length;
				    if (rowCount === 0) return;
				
				    const currentSort = header.dataset.sort || "none";
				    const nextSort = currentSort === "asc" ? "desc" : currentSort === "desc" ? "none" : "asc";
				
				    table.querySelectorAll("th").forEach((th) => {
				        th.dataset.sort = "none";
				        const otherIcon = th.querySelector(".sort-icon");
				        if (otherIcon) otherIcon.innerHTML = '';
				    });
				
				    header.dataset.sort = nextSort;
				
				    const sortIcon = header.querySelector(".sort-icon");
				    if (!sortIcon) return;
				
				    if (nextSort === "none") {
				        sortIcon.innerHTML = '';

				        const mappedRows = rows.map((row) => ({
				            meta_row_singular: row,
				            origIndex: parseInt(row.dataset.origIndex || row.getAttribute("data-orig-index") || 0, 10)
				        }));
				        
				        mappedRows.sort((a, b) => a.origIndex - b.origIndex);
				        
				        const sortedRows = mappedRows.map(item => item.row);
				        tbody.append(...sortedRows);
				    } else {
				        const arrowPoints = nextSort === "asc" ? "18 15 12 9 6 15" : "6 9 12 15 18 9";
				        sortIcon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 1em; height: 1em; display: inline-block; vertical-align: middle; margin-left: 4px;"><polyline points="${arrowPoints}"></polyline></svg>`;
				
				        const isAsc = nextSort === "asc";
				        const modifier = isAsc ? 1 : -1;
				
				        const mappedRows = rows.map((row) => {
				            const cell = row.cells[columnIndex];
				            let sortValue = "";
				
				            if (cell) {
				                const oldVal = cell.dataset.cachedOldVal;

				#createTableBody(data) {
				    const escapeHtml = (str) => {
				        if (str === null || str === undefined) return '';
				        return String(str)
				            .replace(/&/g, '&amp;')
				            .replace(/</g, '&lt;')
				            .replace(/>/g, '&gt;')
				            .replace(/"/g, '&quot;')
				            .replace(/'/g, '&#039;');
				    };
				
				    const tbodyHtmlRows = [];
				    const dataLen = data.length;
				
				    for (let r = 0; r < dataLen; r++) {
				        const row = data[r];
				        const rowLen = row.length;
				        let hasDeleted = false;
				        let hasAdded = false;
				        const cellsHtml = [];
				
						for (let c = 0; c < rowLen; c++) {
						    const cellObj = row[c];
						    let cellContent = "";
						
						    const { type, value, oldValue, newValue } = Utility.getCellData(cellObj);
						    if (type === Comparer.CellStatus.DELETED) hasDeleted = true;
						    else if (type === Comparer.CellStatus.ADDED) hasAdded = true;
						
						    let cacheAttrs = "";
						    switch (type) {
						        case Comparer.CellStatus.DIFFERENCE:
						            cellContent = `<span class="highlight-first">${escapeHtml(oldValue)}</span> <span class="highlight-second">${escapeHtml(newValue)}</span>`;
						            cacheAttrs = `data-cached-old-val="${escapeHtml(oldValue.trim())}" data-cached-new-val="${escapeHtml(newValue.trim())}"`;
						            break;
						        case Comparer.CellStatus.DELETED:
						            cellContent = `<span class="highlight-first">${escapeHtml(oldValue)}</span>`;
						            cacheAttrs = `data-cached-old-val="${escapeHtml(oldValue.trim())}" data-cached-new-val=""`;
						            break;
						        case Comparer.CellStatus.ADDED:
						            cellContent = `<span class="highlight-second">${escapeHtml(newValue)}</span>`;
						            cacheAttrs = `data-cached-old-val="" data-cached-new-val="${escapeHtml(newValue.trim())}"`;
						            break;
						        default:
						            cellContent = escapeHtml(value);
						            cacheAttrs = `data-cached-val="${escapeHtml(value.trim())}"`;
						            break;
						    }
						    cellsHtml.push(`<td data-original-index="${c}" ${cacheAttrs}>${cellContent}</td>`);
						}		
										
				        const rowType = (hasDeleted && !hasAdded) ? "onlyFile1" : (!hasDeleted && hasAdded) ? "onlyFile2" : "matching";
				        tbodyHtmlRows.push(`<tr data-orig-index="${r}" data-row-type="${rowType}">${cellsHtml.join('')}</tr>`);
				    }
				
				    const tbody = document.createElement("tbody");
				    tbody.innerHTML = tbodyHtmlRows.join('');
				    
				    return tbody; 
				}
	
				
                #extractUniqueAndEmptyValues(colCount, data) {
                    const uniqueValuesMap = Array.from({ length: colCount }, () => new Set());
                    const hasEmptyArray = new Array(colCount).fill(false);
                    const dataLen = data.length;

                    for (let i = 0; i < dataLen; i++) {
                        const row = data[i];
                        const rowLen = row.length;

                        for (let j = 0; j < rowLen; j++) {
                            if (j >= colCount) break;

                            const cellObj = row[j];
                            if (cellObj == null) {
                                hasEmptyArray[j] = true;
                                continue;
                            }

                            if (typeof cellObj === "object") {
                                const type = cellObj.type ?? Comparer.CellStatus.UNCHANGED;

                                switch (type) {
                                    case Comparer.CellStatus.DIFFERENCE: {
                                        const oldVal = (
                                            cellObj.oldValue != null ? String(cellObj.oldValue) : ""
                                        ).trim();
                                        const newVal = (
                                            cellObj.newValue != null ? String(cellObj.newValue) : ""
                                        ).trim();

                                        if (oldVal) uniqueValuesMap[j].add(oldVal);
                                        if (newVal) uniqueValuesMap[j].add(newVal);
                                        if (!oldVal || !newVal) hasEmptyArray[j] = true;
                                        break;
                                    }
                                    case Comparer.CellStatus.DELETED: {
                                        const val = (
                                            cellObj.oldValue != null
                                                ? String(cellObj.oldValue)
                                                : cellObj.value != null
                                                  ? String(cellObj.value)
                                                  : ""
                                        ).trim();
                                        if (val) uniqueValuesMap[j].add(val);
                                        else hasEmptyArray[j] = true;
                                        break;
                                    }
                                    case Comparer.CellStatus.ADDED: {
                                        const val = (
                                            cellObj.newValue != null
                                                ? String(cellObj.newValue)
                                                : cellObj.value != null
                                                  ? String(cellObj.value)
                                                  : ""
                                        ).trim();
                                        if (val) uniqueValuesMap[j].add(val);
                                        else hasEmptyArray[j] = true;
                                        break;
                                    }
                                    default: {
                                        const val = (cellObj.value != null ? String(cellObj.value) : "").trim();
                                        if (val) uniqueValuesMap[j].add(val);
                                        else hasEmptyArray[j] = true;
                                        break;
                                    }
                                }
                            } else {
                                const val = String(cellObj).trim();
                                if (val) uniqueValuesMap[j].add(val);
                                else hasEmptyArray[j] = true;
                            }
                        }
                    }

                    return { uniqueValuesMap, hasEmptyArray };
                }


				static #extractValuesFromCell(cell, valuesSet) {
				    if (!cell || !valuesSet) return;
				
				    const oldVal = cell.dataset.cachedOldVal;
				    const newVal = cell.dataset.cachedNewVal;
				
				    if (oldVal !== undefined || newVal !== undefined) {
				        if (oldVal) valuesSet.add(oldVal);
				        if (newVal) valuesSet.add(newVal);
				        if (!oldVal && !newVal) valuesSet.add("empty");
				    } else {
				        const val = cell.dataset.cachedVal ?? "";
				        valuesSet.add(val || "empty");
				    }
				}

                #moveColumn(colIndex, direction) {
                    if (!this.currentTable) return;
                    const newIndex = colIndex + direction;

                    this.currentTable.querySelectorAll('tr').forEach(row => {
                        const cells = Array.from(row.children);
                        const cellToMove = cells[colIndex];
                        const targetCell = cells[newIndex];

                        if (direction === -1) {
                            row.insertBefore(cellToMove, targetCell);
                        } else {
                            row.insertBefore(cellToMove, targetCell.nextSibling);
                        }
                    });

                    this.#updateMoveButtonsState();
                    this.#updateResetButtonVisibility();

                #updateMoveButtonsState() {
                    if (!this.currentTable) return;
                    const headers = this.currentTable.querySelector('thead tr:first-child').children;
                    const numCols = headers.length;

                    Array.from(headers).forEach((th, index) => {
                        const leftBtn = th.querySelector('.move-col-left');
                        const rightBtn = th.querySelector('.move-col-right');
                        if (leftBtn) leftBtn.classList.toggle('disabled', index === 0);
                        if (rightBtn) rightBtn.classList.toggle('disabled', index === numCols - 1);
                    });
                }


                highlightNodeText(node, term) {
                    if (!node || !term) return;
                    if (node.nodeType === Node.TEXT_NODE) {
                        const text = node.textContent;
                        const regex = new RegExp(`(${Utility.escapeRegExp(term)})`, "gi");
                        const parts = text.split(regex);
                        if (parts.length > 1) {
                            const fragment = document.createDocumentFragment();
                            parts.forEach((part) => {
                                if (part.toLowerCase() === term.toLowerCase()) {
                                    const span = document.createElement("span");
                                    span.className = "search-highlight";
                                    span.textContent = part;
                                    fragment.appendChild(span);
                                    this.highlightedSpans.push(span);
                                } else {
                                    fragment.appendChild(document.createTextNode(part));
                                }
                            });
                            node.parentNode.replaceChild(fragment, node);
                        }
                    } else if (
                        node.nodeType === Node.ELEMENT_NODE &&
                        node.nodeName !== "SCRIPT" &&
                        node.nodeName !== "STYLE"
                    ) {
                        Array.from(node.childNodes).forEach((child) => this.highlightNodeText(child, term));
                    }
                }


                handleTableFilterChange(changedCheckbox, scrollContainer) {
                    const checkboxes = Array.from(scrollContainer.querySelectorAll(".filter-option-checkbox"));
                    const allCheckbox = checkboxes.find(cb => cb.value === "select-all");
                    if (!allCheckbox) return;

                    if (changedCheckbox === allCheckbox) {

                        checkboxes.forEach(cb => {
                            if (cb !== allCheckbox) {
                                cb.checked = allCheckbox.checked;
                            }
                        });
                    } else {

                        if (!changedCheckbox.checked) {

                            allCheckbox.checked = false;
                        } else {

                            const allOthersChecked = checkboxes.every(cb => cb === allCheckbox || cb.checked);
                            if (allOthersChecked) {
                                allCheckbox.checked = true;
                            }
                        }
                    }
                    scrollContainer.classList.toggle("filter-active", !allCheckbox.checked);
                }


                getActiveColumnFilters(headerCells, isColumnFilterActive) {
                    if (!isColumnFilterActive) return [];
                    const activeFilters = [];
                    headerCells.forEach((td, index) => {
                        const scrollContainer = td.querySelector(".table-filter-scroll-container");
                        if (!scrollContainer) return;
                        const allCheckbox = scrollContainer.querySelector('.filter-option-checkbox[value="select-all"]');
                        
                        if (allCheckbox && allCheckbox.checked) return;
                        const checkedCheckboxes = Array.from(scrollContainer.querySelectorAll(".filter-option-checkbox:checked"));

                        const selectedValues = new Set(checkedCheckboxes.map(cb => {
                            return cb.value === "select-empty" ? "empty" : cb.value;
                        }));
                        
                        activeFilters.push({
                            colIndex: index,
                            selectedValues,
                        });
                    });
                    return activeFilters;
                }


                reset() {

                    this.clearOutput();
                    this.highlightedColumns.clear();
                    this.highlightedRows.clear();
                    if (this.els.globalSearch) {

                    if (this.els.searchClear) {

                renderTable(headers, data, options = {}) {
                    this.clearOutput();
                    const colCount = headers.length;
                    const { uniqueValuesMap, hasEmptyArray } = this.#extractUniqueAndEmptyValues(colCount, data);
                    const fragment = document.createDocumentFragment();
                    const table = document.createElement("table");
                    table.className = "custom-table";
                    this.currentTable = table;
                    const thead = this.#createTableHeader(headers, uniqueValuesMap, hasEmptyArray, options);
                    table.appendChild(thead);
                    this.filterCells = this.currentFilterRow ? Array.from(this.currentFilterRow.children) : [];
                    const tbody = this.#createTableBody(data);
                    table.appendChild(tbody);
                    fragment.appendChild(table);
                    this.els.output.appendChild(fragment);
                    
                    const originalTableWidth = table.style.width;
                    table.style.width = 'auto';
                    
                    const filterTr = this.currentFilterRow;
                    const originalFilterDisplay = filterTr ? filterTr.style.display : "";
                    if (filterTr) {
                        filterTr.style.display = "none";
                    }
                    

                    const ths = table.querySelectorAll("thead tr:first-child th");

                    const maxDataLens = new Array(colCount).fill(0);
                    for (let r = 0; r < data.length; r++) {

                            const cellObj = row[c];

                            const valLen = Math.max(
                                (cellData.value || "").length,
                                (cellData.oldValue || "").length,
                                (cellData.newValue || "").length
                            );
                            if (valLen > maxDataLens[c]) {
                                maxDataLens[c] = valLen;
                            }

                        totalWidth += w;

                    const containerWidth = this.els.output.clientWidth;
                    const wrapperWidth = this.els.output.parentElement ? this.els.output.parentElement.clientWidth : containerWidth;
                    const targetWidth = Math.max(containerWidth, wrapperWidth) * 0.9;

                    
                    if (totalWidth < targetWidth && targetWidth > 0) {
                        const ratio = targetWidth / totalWidth;
                        ths.forEach((th, i) => {
                            const finalWidth = widths[i] * ratio;
                            th.style.maxWidth = 'none';
                            th.style.width = finalWidth + "px";

                    } else {
                        ths.forEach((th, i) => {
                            const finalWidth = Math.min(widths[i], 250);

				        return headerHtml;

				    const lineElements = [];

				        const row = data[r];

				        for (let c = 0; c < row.length; c++) {
				            const { type, value, oldValue, newValue } = Utility.getCellData(row[c]);
				            switch (type) {
				                case Comparer.CellStatus.DIFFERENCE:
				                    rowParts[c] =
				                        `<span class="highlight-first">${Utility.escapeHTML(oldValue)}</span>${valueDelimiter}<span class="highlight-second">${Utility.escapeHTML(newValue)}</span>`;
				                    break;
				                case Comparer.CellStatus.DELETED:
				                    rowParts[c] =
				                        `<span class="highlight-first">${Utility.escapeHTML(oldValue)}</span>${valueDelimiter}`;
				                    break;
				                case Comparer.CellStatus.ADDED:
				                    rowParts[c] =
				                        `${valueDelimiter}<span class="highlight-second">${Utility.escapeHTML(newValue)}</span>`;
				                    break;
				                default:
				                    rowParts[c] = Utility.escapeHTML(value);
				                    break;

				        }
				
				        const lineDiv = document.createElement("div");

				        lineDiv.innerHTML = rowParts.join(columnDelimiter);

				        const hasFirst = lineDiv.innerHTML.includes("highlight-first");
				        const hasSecond = lineDiv.innerHTML.includes("highlight-second");

				            hasFirst && !hasSecond ? "onlyFile1" : !hasFirst && hasSecond ? "onlyFile2" : "matching";
				
				        lineElements.push(lineDiv);
				    }
				
				    if (includeEmptyLines) {

				            fragment.appendChild(line);

				doesCellMatchFilter(cell, selectedValues) {
				    const oldVal = cell.dataset.cachedOldVal;
				    const newVal = cell.dataset.cachedNewVal;
				
				    if (oldVal !== undefined || newVal !== undefined) {
				        const hasEmptyMatch = selectedValues.has("empty") && (!oldVal || !newVal);
				        const hasValMatch = selectedValues.has(oldVal) || selectedValues.has(newVal);
				        return hasEmptyMatch || hasValMatch;
				    }
				
				    const cellText = cell.dataset.cachedVal ?? "";
				    return selectedValues.has(cellText || "empty");
				}
	
	
                 renderStatus(data) {

                    this.els.status.style.visibility = "visible";

                            this.statusEls.elO1.textContent = data.stats.onlyFile1;
                            this.statusEls.elO2.textContent = data.stats.onlyFile2;

                            const counts = [
                                { cb: this.statusEls.cbM, val: data.comparisonStats?.matching ?? data.stats.matching, key: "matching" },
                                { cb: this.statusEls.cbO1, val: data.comparisonStats?.onlyFile1 ?? data.stats.onlyFile1, key: "onlyFile1" },
                                { cb: this.statusEls.cbO2, val: data.comparisonStats?.onlyFile2 ?? data.stats.onlyFile2, key: "onlyFile2" }
                            ];

                            counts.forEach(({ cb, val, key }) => {
                                if (cb) {
                                    const disabled = val === 0;
                                    cb.disabled = disabled;
                                    cb.checked = !disabled && !!data.rowTypeFilters[key];
                                    cb.parentElement.style.opacity = disabled ? "0.4" : "1";
                                }

                            const keys = [
                                { id: "matching", stat: "matching", filter: "matching" },
                                { id: "only1", stat: "onlyFile1", filter: "onlyFile1" },
                                { id: "only2", stat: "onlyFile2", filter: "onlyFile2" }
                            ];
                            keys.forEach(k => {
                                const el = this.els.status.querySelector(`#status-count-${k.id}`);
                                if (el) el.textContent = data.stats[k.stat];
                                const cb = this.els.status.querySelector(`[data-filter="${k.filter}"]`);
                                if (cb) {
                                    const val = data.comparisonStats?.[k.stat] ?? data.stats[k.stat];
                                    cb.disabled = val === 0;
                                    cb.checked = val > 0 && !!data.rowTypeFilters[k.filter];
                                    cb.parentElement.style.opacity = val === 0 ? "0.4" : "1";
                                }
                            });
                        }
                        return;
                    }

                    this.els.status.replaceChildren();
                    const unitLabel = data.totalCount === 1 ? this.tr[this.lang].meta_row_singular : this.tr[this.lang].meta_row_plural;
                    const elVis = document.createElement("span");
                    elVis.id = "status-visible-count";
                    elVis.textContent = data.visibleCount;

                    const elTotal = document.createElement("span");
                    elTotal.id = "status-total-count";
                    elTotal.textContent = data.totalCount;

                    const txtUnit = ` ${unitLabel}`;

                    if (!data.isSingleView && data.stats) {
                        const rtf = data.rowTypeFilters;
                        const countM = data.comparisonStats?.matching ?? data.stats.matching;
                        const countO1 = data.comparisonStats?.onlyFile1 ?? data.stats.onlyFile1;
                        const countO2 = data.comparisonStats?.onlyFile2 ?? data.stats.onlyFile2;

                        const createFilter = (id, filter, count, isChecked, isDisabled, className = "") => {
                            const lbl = document.createElement("label");
                            lbl.style.cssText = `${isDisabled ? "opacity: 0.4; cursor: not-allowed;" : "cursor: pointer;"} display: inline-flex; align-items: center; gap: 3px;`;

                            cb.disabled = isDisabled;

                            if (filter === "matching") cbM = cb;
                            if (filter === "onlyFile1") cbO1 = cb;

                            lbl.append(span, cb);

                        const lblM = createFilter("matching", "matching", countM, rtf.matching, countM === 0);

                        const lblO2 = createFilter("only2", "onlyFile2", countO2, rtf.onlyFile2, countO2 === 0, "highlight-second");
                        this.els.status.append(" (", lblO1, ", ", lblO2, ", ", lblM, ")");

                    this.els.status.append(txtOf, elTotal, txtUnit);

                    this.statusEls = {

                renderTableOutput(tbody, rows, rowMatchesFilters, originalSearchTerm) {
                    const viewportMin = window.innerHeight - 150;
                    this.els.output.style.minHeight = `${viewportMin}px`;

                    let visibleCount = 0;
                    let visibleOnlyFile1 = 0;
                    let visibleOnlyFile2 = 0;
                    let visibleMatching = 0;

                    const rowCount = rows.length;
                    const hasSearch = originalSearchTerm !== "";

                    for (let i = 0; i < rowCount; i++) {
                        const row = rows[i];
                        const isVisible = rowMatchesFilters(row, -1);
                        row.style.display = isVisible ? "" : "none";

                        if (isVisible) {
                            visibleCount++;
                            const rowType = row.dataset.rowType || "matching";

                            if (rowType === "onlyFile1") visibleOnlyFile1++;
                            else if (rowType === "onlyFile2") visibleOnlyFile2++;
                            else visibleMatching++;

                            if (hasSearch && row._cachedSearchText.includes(originalSearchTerm.toLowerCase())) {
                                const cells = row.cells;
                                const cellCount = cells.length;
                                for (let c = 0; c < cellCount; c++) {
                                    this.highlightNodeText(cells[c], originalSearchTerm);
                                }
                            }
                        }
                    }

                    return {
                        visibleCount,
                        totalRows: rowCount,
                        stats: {
                            matching: visibleMatching,
                            onlyFile1: visibleOnlyFile1,
                            onlyFile2: visibleOnlyFile2,
                        },
                    };
                }

				#toggleColumnHighlight(header, table) {
				    const columnIndex = header.cellIndex;
				    const isAlreadyHighlighted = header.classList.contains("highlighted-column");
				    const action = isAlreadyHighlighted ? "remove" : "add";
				
				    header.classList[action]("highlighted-column");
				    if (isAlreadyHighlighted) {
				        this.highlightedColumns.delete(header);
				    } else {
				        this.highlightedColumns.add(header);
				    }
				
				    const filterRow = table.querySelector("thead tr.table-filter-row");
				    if (filterRow && filterRow.cells[columnIndex]) {
				        const filterCell = filterRow.cells[columnIndex];
				        filterCell.classList[action]("highlighted-column");
				        if (isAlreadyHighlighted) {
				            this.highlightedColumns.delete(filterCell);
				        } else {
				            this.highlightedColumns.add(filterCell);
				        }
				    }
				
				    const tbody = table.tBodies[0];
				    if (tbody) {
				        for (let i = 0; i < tbody.rows.length; i++) {
				            const cell = tbody.rows[i].cells[columnIndex];
				            if (cell) {
				                cell.classList[action]("highlighted-column");
				                if (isAlreadyHighlighted) {
				                    this.highlightedColumns.delete(cell);
				                } else {
				                    this.highlightedColumns.add(cell);
				                }
				            }
				        }
				    }
				}
				


				updateColumnDropdowns(headerCells, allRows, activeFilters, rowMatchesFilters, activeDropdown = null) {
				    const colCount = headerCells.length;
				
				    for (let colIndex = 0; colIndex < colCount; colIndex++) {
				        const scrollContainer = headerCells[colIndex]?.querySelector(".table-filter-scroll-container");
				        if (!scrollContainer) continue;
				
				        let optionsToShow = new Set();
				        for (const row of allRows) {
				            if (rowMatchesFilters(row, colIndex)) {
				                TableManager.#extractValuesFromCell(row.children[colIndex], optionsToShow);
				            }
				        }
				
				        const optionRows = scrollContainer.querySelectorAll(".filter-option-row");
				        const searchInput = scrollContainer.querySelector(".dropdown-search-input");
				        const query = searchInput ? searchInput.value.toLowerCase().trim() : "";

				        optionRows.forEach(row => {
				            const cb = row.querySelector(".filter-option-checkbox");
				            if (!cb) return;
				            
				            const val = cb.value;
				            const labelSpan = row.querySelector(".filter-option-label");
				            
				            if (labelSpan) {
				                if (!labelSpan.dataset.originalText) {
				                    labelSpan.dataset.originalText = labelSpan.textContent;
				                }
				                labelSpan.textContent = labelSpan.dataset.originalText;
				            }

				            let shouldShow = false;
				            if (val === "select-all") {
				                shouldShow = true;
				            } else if (val === "select-empty") {
				                shouldShow = optionsToShow.has("empty");
				            } else {
				                shouldShow = optionsToShow.has(val);
				            }

				            if (shouldShow && query && val !== "select-all" && val !== "select-empty") {
				                const originalText = labelSpan ? labelSpan.dataset.originalText : val;
				                const lowerText = originalText.toLowerCase();
				                if (!lowerText.includes(query)) {
				                    shouldShow = false;
				                } else if (labelSpan) {
				                    const regex = new RegExp(`(${Utility.escapeRegExp(query)})`, "gi");
				                    labelSpan.innerHTML = originalText.replace(regex, '<span class="search-highlight">$1</span>');
				                }
				            }

				            row.style.display = shouldShow ? "flex" : "none";
				        });
				    }
				}

                            if (e.target.closest(".move-col-left")) {
                                const colIndex = th.cellIndex;
                                exportMoveColumn(table, colIndex, -1);
                                return;
                            } else if (e.target.closest(".move-col-right")) {
                                const colIndex = th.cellIndex;
                                exportMoveColumn(table, colIndex, 1);
                                return;
                            }

                            if (e.target.closest(".col-toggle-btn")) {
                                exporttoggleColumnCollapse(th, table);
                            } else if (e.target.closest(".sort-trigger")) {
                                exporthandleColumnSorting(th, table);
                            }
				        });

				        table.tHead.addEventListener("dblclick", e => {
                            if (e.target.tagName === "INPUT" || e.target.classList.contains("filter-option-label") || e.target.closest(".table-filter-scroll-container")) return;
                            const th = e.target.closest("th");
                            if (!th) return;
                            if (!e.target.closest(".sort-trigger")) {
                                exporthandleColumnHighlighting(th, table);
                                window.getSelection()?.removeAllRanges();
                            }
                        });

                        if (table.tBodies[0]) {
                            table.tBodies[0].addEventListener("dblclick", (event) => {
                                const tr = event.target.closest("tr");
                                if (tr) {
                                    exporthandleRowHighlighting(tr);
                                    window.getSelection()?.removeAllRanges();
                                }
                            });
                        }

                        const resetBtn = document.getElementById("export-reset-col-order-btn");
                        if (resetBtn) {
                            resetBtn.addEventListener("click", () => {
                                exportResetColumnOrder(table);
                            });
                        }

                        const expandBtn = document.getElementById("export-expand-all-cols-btn");
                        if (expandBtn) {
                            expandBtn.addEventListener("click", () => {
                                exportExpandAllColumns(table);
                            });
                        }

                        exportUpdateMoveButtonsState(table);
                        exportUpdateResetButtonVisibility(table);
                        exportUpdateExpandButtonVisibility(table);

						exportfilterTable(table, null);
						});
				    `;

					return [
					    htmlHeaderStart,
					    `        body { font-family: Arial, sans-serif; margin: 0; padding: 10px 20px 20px 20px; min-height: 100vh; box-sizing: border-box; color: var(--text-color); font-size: 12px; word-break: break-all; background-color: #fff; }`,

					    `        .col-move-btn { color: #888; cursor: pointer; font-size: 14px; font-weight: 900; line-height: 1; user-select: none; padding: 2px 4px; flex-shrink: 0; }`,
