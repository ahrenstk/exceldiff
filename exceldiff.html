                        ).filter(Boolean)
                    );

                    [this.view.els.checkboxesFile1, this.view.els.checkboxesFile2].forEach((container) => {
                        if (!container) return;

                        container.querySelectorAll("input[type='checkbox']").forEach((cb) => {
                            if (cb.id.startsWith("toggle-all-")) return;

                            const colName = cb.labels?.[0]?.textContent.trim().toLowerCase();
                            const isKey = checkedKeyNames.has(colName);

                            cb.checked = isKey || cb.checked;
                            cb.disabled = isKey;
                        });

                        const firstCb = container.querySelector("input");
                        if (firstCb) {
                            this.handleToggleAllInColumnSelection(firstCb, container);
                        }
                    });
                }

                #syncOptionsState() {
                    this.state.options = {
                        asTable: this.view.els.asTable.checked,
                        onlyDifferences: this.view.els.onlyDifferences.checked,
                        hideIdenticalColumns: this.view.els.hideIdenticalColumns.checked,
                        includeEmptyLines: this.view.els.includeEmptyLines.checked,
                        replaceDelimiter: this.view.els.replaceDelimiterWithSpace.checked,
                        activateFilter: this.view.els.activateFilter.checked,
                    };
                }

                #syncSelectionState() {
                    const getCheckedValues = (container, selector) => {
                        if (!container) return new Set();
                        return new Set(Array.from(container.querySelectorAll(selector), (cb) => Number(cb.value)));
                    };

                    this.state.selectedKeys = getCheckedValues(this.view.els.checkboxes, "input:checked");
                    this.state.selectedCols1 = getCheckedValues(
                        this.view.els.checkboxesFile1,
                        "input:checked:not([id^=toggle-all])"
                    );
                    this.state.selectedCols2 = getCheckedValues(
                        this.view.els.checkboxesFile2,
                        "input:checked:not([id^=toggle-all])"
                    );
                }

                #toggleFilterActivation() {
                    this.tableManager.setFilterRowVisibility(this.view.els.activateFilter.checked);
                }

                #toggleHideIdenticalColumns() {
                    const isChecked = this.view.els.onlyDifferences.checked;
                    this.view.els.hideIdenticalColumns.disabled = !isChecked;
                    if (!isChecked) this.view.els.hideIdenticalColumns.checked = false;
                }

                #toggleTableOptions() {
                    const els = this.view.els;
                    const isTableChecked = els.asTable.checked;
                    els.activateFilter.disabled = !isTableChecked;
                    els.includeEmptyLines.disabled = isTableChecked;

                    if (isTableChecked) {
                        els.activateFilter.checked = true;
                        els.includeEmptyLines.checked = false;
                    } else {
                        els.activateFilter.checked = false;
                    }
                    this.#toggleFilterActivation();
                }

                #updateEncodingState() {
                    const file1 = this.view.els.file1.files[0];
                    const file2 = this.view.els.file2.files[0];
                    const isExcel1 = file1 && ["xlsx", "xls"].includes(file1.name.split(".").pop().toLowerCase());
                    const isExcel2 = file2 && ["xlsx", "xls"].includes(file2.name.split(".").pop().toLowerCase());

                    if (isExcel1 && isExcel2) {
                        this.view.els.encodingToggle.checked = false;
                        this.view.els.encodingToggle.disabled = true;
                        this.view.els.encoding.value = "UTF-8";
                    } else {
                        this.view.els.encodingToggle.disabled = false;
                    }
                }

                #updateUIStatus(visibleCount, totalCount, stats = null) {
                    if (!this.tableManager.els.status) return;

                    const isSingleView = ["file1", "file2", "consolidate"].includes(this.state.currentViewMode);
                    const baseTotal =
                        !isSingleView && this.state.initialTotalRows !== undefined
                            ? this.state.initialTotalRows
                            : totalCount;

                    const statusData = {
                        visibleCount: visibleCount,
                        totalCount: baseTotal,
                        isSingleView: isSingleView,
                        stats: stats,
                        comparisonStats: this.state.comparisonStats,
                        rowTypeFilters: this.state.rowTypeFilters || {
                            matching: true,
                            onlyFile1: true,
                            onlyFile2: true,
                        },
                    };

                    this.tableManager.renderStatus(statusData);
                }
            }


            class Utility {

                static escapeHTML(str) {
                    if (str == null) return "";
                    const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" };
                    return String(str).replace(/[&<>"']/g, (m) => map[m]);
                }

				static formatDates(data) {
				    if (!data || !Array.isArray(data)) return data;
				
                    const deRegex = /^\s*(\d{1,2})\.(\d{1,2})\.(\d{4})\s*$/;
                    const usRegex = /^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/;

				
				    return data.map(row => {
				        if (!Array.isArray(row)) return row;
				
				        return row.map(cell => {
				            if (cell instanceof Date) {
				                const year = cell.getFullYear();
				                const month = (cell.getMonth() + 1).toString().padStart(2, '0');
				                const day = cell.getDate().toString().padStart(2, '0');
				                return `${year}-${month}-${day}`;
				            }
				
				            if (typeof cell !== 'string' || !cell.trim()) {
				                return cell;
				            }

				            let match = cell.match(deRegex);
				            if (match) {
				                const day = match[1].padStart(2, '0');
				                const month = match[2].padStart(2, '0');
				                const year = match[3];
				                return `${year}-${month}-${day}`;
				            }
				
				            match = cell.match(usRegex);
				            if (match) {
				                const month = match[1].padStart(2, '0');
				                const day = match[2].padStart(2, '0');
				                const year = match[3];
				                return `${year}-${month}-${day}`;
				            }

				            return cell;
				        });
				    });
				}
				
                static getCellData(cellObj) {
                    if (cellObj == null) {
                        return { type: Comparer.CellStatus.UNCHANGED, value: "", oldValue: "", newValue: "" };
                    }

                    if (typeof cellObj !== "object") {
                        const val = String(cellObj);
                        return { type: Comparer.CellStatus.UNCHANGED, value: val, oldValue: val, newValue: val };
                    }

                    const value = cellObj.value != null ? String(cellObj.value) : "";

                    return {
                        type: cellObj.type ?? Comparer.CellStatus.UNCHANGED,
                        value,
                        oldValue: cellObj.oldValue != null ? String(cellObj.oldValue) : value,
                        newValue: cellObj.newValue != null ? String(cellObj.newValue) : value,
                    };
                }

                static escapeRegExp(str) {
                    return typeof str === "string" ? str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") : "";
                }

                static getTimestamp() {
                    const now = new Date();
                    return `${now.toISOString().slice(0, 10)}-${now.toTimeString().slice(0, 5).replace(":", "")}`;
                }

                static removeEmptyColumns(data) {
                    if (!data?.length) return [];

                    const validIndices = data[0].reduce((acc, cell, i) => {
                        if (cell && String(cell).trim()) acc.push(i);
                        return acc;
                    }, []);

                    return data.map((row) => validIndices.map((i) => row[i]));
                }

                static replaceDelimiters(data, delimiters, shouldReplace = true) {
                    const isEnabled =
                        typeof shouldReplace === "object" ? shouldReplace?.replaceDelimiter : shouldReplace;
                    if (!isEnabled || !delimiters?.length || !data?.length) return data;

                    const pattern = delimiters.map(Utility.escapeRegExp).filter(Boolean).join("|");
                    if (!pattern) return data;

                    const regex = new RegExp(pattern, "g");
                    return data.map((row) =>
                        row.map((cell) => (typeof cell === "string" ? cell.replace(regex, " ") : cell))
                    );
                }

                static removeHTMLTags(str) {
                    return typeof str === "string" ? str.replace(/<[^>]*>/g, "") : "";
                }
            }

            class Exporter {
                #downloadFile(content, mimeType, fileExtension) {
                    const url = URL.createObjectURL(new Blob([content], { type: `${mimeType};charset=utf-8;` }));
                    const link = Object.assign(document.createElement("a"), {
                        href: url,
                        download: `${Utility.getTimestamp()}.${fileExtension}`,
                    });
                    link.click();
                    URL.revokeObjectURL(url);
                }

                exportAsCSV(selectedText) {
                    this.#downloadFile(`\uFEFF${selectedText}`, "text/csv", "csv");
                }

                exportAsHTML(htmlContent) {
                    this.#downloadFile(htmlContent, "text/html", "html");
                }
            }

            class DataManager {
                constructor(config = {}) {
                    this.config = config;
                }

                #normalizeRows(rows) {
                    if (!rows?.length) return [];

                    let maxCols = -1;
                    const validRows = [];

                    for (let i = 0; i < rows.length; i++) {
                        const row = rows[i];
                        if (!Array.isArray(row)) continue;

                        let lastNonEmptyIdx = -1;
                        for (let j = 0; j < row.length; j++) {
                            const cell = row[j];
                            if (cell != null && String(cell).trim() !== "") {
                                lastNonEmptyIdx = j;
                            }
                        }

                        if (lastNonEmptyIdx !== -1) {
                            validRows.push(row);
                            if (lastNonEmptyIdx > maxCols) {
                                maxCols = lastNonEmptyIdx;
                            }
                        }
                    }

                    if (maxCols === -1) return [];

                    const targetLength = maxCols + 1;
                    const normalized = new Array(validRows.length);

                    for (let i = 0; i < validRows.length; i++) {
                        const row = validRows[i];
                        const cleanRow = new Array(targetLength);

                        for (let j = 0; j < targetLength; j++) {
                            const val = row[j];
                            if (val == null) {
                                cleanRow[j] = "";
                            } else if (val instanceof Date) {
                                cleanRow[j] = val;
                            } else {
                                cleanRow[j] = String(val).replace(/\r/g, "").trim();
                            }
                        }

                        normalized[i] = cleanRow;
                    }

                    return normalized;
                }

                async #parseCSV(file, encoding = "UTF-8") {
                    const encodingParam = encoding.toUpperCase() === "ANSI" ? "windows-1252" : "utf-8";

                    return new Promise((resolve, reject) => {
                        if (window.Papa) {
                            Papa.parse(file, {
                                encoding: encodingParam,
                                complete: (results) => resolve(this.#normalizeRows(results.data)),
                                error: (err) => reject(err),
                                skipEmptyLines: true,
                            });
                        } else {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                const text = e.target.result;
                                const colDelimiter = this.config.COLUMN_DELIMITER || ";";
                                const lines = text.split(/\r\n|\n/).map((line) => line.split(colDelimiter));
                                resolve(this.#normalizeRows(lines));
                            };
                            reader.onerror = (err) => reject(err);
                            reader.readAsText(file, encodingParam);
                        }
                    });
                }

                async #parseExcel(file) {
                    if (typeof readXlsxFile === "undefined" && typeof readSheet === "undefined") {
                        throw {
                            messageKey: "library_missing_error",
                            details: "'read-excel-file'",
                        };
                    }

                    try {
                        let rows;
                        if (typeof readSheet === "function") {
                            rows = await readSheet(file);
                        } else if (typeof readXlsxFile?.readSheet === "function") {
                            rows = await readXlsxFile.readSheet(file);
                        } else {
                            const result = await readXlsxFile(file);
                            rows = result?.[0]?.data ?? result;
                        }

                        if (!rows || !rows.length) {
                            return [];
                        }

                        return this.#normalizeRows(rows);
                    } catch (err) {
                        throw {
                            messageKey: "file_read_error",
                            details: `(Excel) ${err.message}`,
                        };
                    }
                }

                async parseFile(file, encoding = "UTF-8") {
                    const extension = file.name.split(".").pop().toLowerCase();

                    switch (extension) {
                        case "csv":
                        case "txt":
                            return await this.#parseCSV(file, encoding);
                        case "ods":
                            return await this.#parseODS(file);
                        case "xlsx":
                            return await this.#parseExcel(file);
                        default:
                            throw {
                                messageKey: "unsupported_format_error",
                                details: `.${extension}`,
                            };
                    }
                }

                async #parseODS(file) {
                    if (typeof fflate === "undefined") {
                        throw { messageKey: "library_missing_error", details: "'fflate'" };
                    }
                    const tXmlInstance =
                        typeof tXml !== "undefined"
                            ? tXml
                            : typeof txml !== "undefined"
                              ? txml
                              : window?.tXml || window?.txml;
                    if (!tXmlInstance) {
                        throw { messageKey: "library_missing_error", details: "'txml'" };
                    }
                    const bytes = new Uint8Array(await file.arrayBuffer());
                    return new Promise((resolve, reject) => {
                        fflate.unzip(bytes, (err, unzipped) => {
                            if (err) {
                                return reject({ messageKey: "file_read_error", details: `(ODS) ${err.message}` });
                            }
                            const contentXmlData = unzipped["content.xml"];
                            if (!contentXmlData) {
                                return reject({ messageKey: "file_read_error", details: "(ODS) content.xml missing" });
                            }
                            try {
                                const xmlString = new TextDecoder("utf-8").decode(contentXmlData);
                                const parseFn = typeof tXmlInstance === "function" ? tXmlInstance : tXmlInstance.parse;
                                if (typeof parseFn !== "function") {
                                    throw { messageKey: "file_read_error", details: "(ODS) Parser missing" };
                                }
                                const parsedXml = parseFn(xmlString);
                                const getLocalName = (node) =>
                                    typeof node === "object" && node?.tagName ? node.tagName.split(":").pop() : "";
                                const extractText = (children) => {
                                    if (!children) return "";
                                    if (typeof children === "string") return children;
                                    if (!Array.isArray(children)) return "";
                                    return children
                                        .map((c) => (typeof c === "string" ? c : extractText(c.children)))
                                        .join("");
                                };
                                const findRows = (nodes) => {
                                    if (!Array.isArray(nodes)) return [];
                                    const rows = [];
                                    const stack = [...nodes];
                                    while (stack.length > 0) {
                                        const node = stack.pop();
                                        if (typeof node !== "object" || !node) continue;
                                        if (getLocalName(node) === "table-row") {
                                            rows.push(node);
                                        } else if (Array.isArray(node.children)) {
                                            stack.push(...node.children);
                                        }
                                    }
                                    return rows.reverse();
                                };
                                const allRows = findRows(parsedXml)
                                    .map((row) => {
                                        const cells = (row.children || []).filter(
                                            (c) => getLocalName(c) === "table-cell"
                                        );
                                        return cells.flatMap((cell) => {
                                            const repeatedAttr =
                                                cell.attributes?.["table:number-columns-repeated"] ||
                                                cell.attributes?.["number-columns-repeated"];
                                            const repeatedColumns = repeatedAttr ? parseInt(repeatedAttr, 10) : 1;
                                            const pNodes = (cell.children || []).filter((c) => getLocalName(c) === "p");
                                            const cellValue = pNodes
                                                .map((p) => extractText(p.children))
                                                .join("\\n")
                                                .trim();
                                            return Array(repeatedColumns).fill(cellValue);
                                        });
                                    })
                                    .filter((row) => row.length > 0 && row.some((cell) => cell.trim() !== ""));
                                resolve(this.#normalizeRows(allRows));
                            } catch (parseErr) {
                                reject({
                                    messageKey: "file_read_error",
                                    details: `(ODS) ${parseErr.messageKey ? parseErr.details : parseErr.message}`,
                                });
                            }
                        });
                    });
                }
            }

             class Comparer {
                static RowStatus = Object.freeze({
                    UNCHANGED: "unchanged",
                    MODIFIED: "modified",
                    DELETED: "deleted",
                    ADDED: "added",
                });

                static CellStatus = Object.freeze({
                    UNCHANGED: "unchanged",
                    DIFFERENCE: "difference",
                    DELETED: "deleted",
                    ADDED: "added",
                });

                constructor(lang, tr) {
                    this.lang = lang;
                    this.tr = tr;
                }

                #buildDataMap(data1, data2, cols1, cols2, keyIndices1, keyIndices2, delimiters) {
                    const headers1 = data1[0] || [];
                    const headers2 = data2[0] || [];
                    const finalHeaders1 = cols1.map((i) => headers1[i] || "");
                    const finalHeaders2 = cols2.map((i) => headers2[i] || "");
                    const file1Data = [finalHeaders1];
                    const file2Data = [finalHeaders2];
                    const dataMap = new Map();

                    const processRow = (row, cols, keyIndices) => {
                        if (!row) return null;
                        let hasAnyValidKey = false;
                        let isRowCompletelyEmpty = true;

                        for (let k = 0; k < cols.length; k++) {
                            const val = row[cols[k]];
                            if (val != null && String(val).trim() !== "") {
                                isRowCompletelyEmpty = false;
                                break;
                            }
                        }

                        if (isRowCompletelyEmpty) return null;

                        const keyParts = new Array(keyIndices.length);
                        for (let k = 0; k < keyIndices.length; k++) {
                            const val = row[cols[keyIndices[k]]];
                            const str = val == null ? "" : String(val).trim();
                            if (str !== "") hasAnyValidKey = true;
                            keyParts[k] = str;
                        }

                        return hasAnyValidKey
                            ? { key: keyParts.join(delimiters.valueDelimiter), lazyRow: cols.map((idx) => row[idx]) }
                            : null;
                    };

                    for (let i = 1; i < data1.length; i++) {
                        const processed = processRow(data1[i], cols1, keyIndices1);
                        if (!processed) continue;
                        file1Data.push(processed.lazyRow);
                        dataMap.set(processed.key, { row1: processed.lazyRow, status: Comparer.RowStatus.DELETED });
                    }

                    const headerMap2To1 = new Map();
                    finalHeaders2.forEach((h2, idx2) => {
                        const idx1 = finalHeaders1.indexOf(h2);
                        if (idx1 !== -1) headerMap2To1.set(idx2, idx1);
                    });

                    for (let i = 1; i < data2.length; i++) {
                        const processed = processRow(data2[i], cols2, keyIndices2);
                        if (!processed) continue;
                        file2Data.push(processed.lazyRow);

                        const entry = dataMap.get(processed.key);
                        if (entry) {
                            entry.row2 = processed.lazyRow;
                            if (entry.row1) {
                                let isDifferent = false;

                                for (let idx1 = 0; idx1 < finalHeaders1.length; idx1++) {
                                    const h1 = finalHeaders1[idx1];
                                    const idx2 = finalHeaders2.indexOf(h1);
                                    const val1 = String(entry.row1[idx1] ?? "").trim();
                                    const val2 = idx2 !== -1 ? String(processed.lazyRow[idx2] ?? "").trim() : "";
                                    if (val1 !== val2) {
                                        isDifferent = true;
                                        break;
                                    }
                                }

                                if (!isDifferent) {
                                    for (let idx2 = 0; idx2 < finalHeaders2.length; idx2++) {
                                        const h2 = finalHeaders2[idx2];
                                        if (!finalHeaders1.includes(h2)) {
                                            const val2 = String(processed.lazyRow[idx2] ?? "").trim();
                                            if (val2 !== "") {
                                                isDifferent = true;
                                                break;
                                            }
                                        }
                                    }
                                }

                                entry.status = isDifferent ? Comparer.RowStatus.MODIFIED : Comparer.RowStatus.UNCHANGED;
                            } else {
                                entry.status = Comparer.RowStatus.ADDED;
                            }
                        } else {
                            dataMap.set(processed.key, {
                                row1: null,
                                row2: processed.lazyRow,
                                status: Comparer.RowStatus.ADDED,
                            });
                        }
                    }

                    const res1 = this.#validateKeyUniqueness(
                        file1Data,
                        "file1",
                        "highlight-first",
                        keyIndices1,
                        delimiters
                    );
                    const res2 = this.#validateKeyUniqueness(
                        file2Data,
                        "file2",
                        "highlight-second",
                        keyIndices2,
                        delimiters
                    );

                    if (res1.hasCriticalError || res2.hasCriticalError) {
                        return {
                            error: {
                                warnings: [...res1.warnings, ...res2.warnings],
                                differences: [],
                                headers: [],
                            },
                        };
                    }

                    return { dataMap, finalHeaders1, finalHeaders2, warnings: [...res1.warnings, ...res2.warnings] };
                }

                #buildHeaderIndexMaps(headers1, headers2, cols1, cols2, rawKeyColumns) {
                    const headerMap1 = new Map(
                        cols1.map((colIdx, i) => [String(headers1[colIdx] || "").trim(), i]).filter(([h]) => h !== "")
                    );
                    const headerMap2 = new Map(
                        cols2.map((colIdx, i) => [String(headers2[colIdx] || "").trim(), i]).filter(([h]) => h !== "")
                    );

                    const keyIndices1 = [];
                    const keyIndices2 = [];

                    for (let i = 0; i < rawKeyColumns.length; i++) {
                        const rawKeyName = headers1[rawKeyColumns[i]];
                        const keyName = String(rawKeyName || "").trim();
                        const idx1 = headerMap1.get(keyName);
                        const idx2 = headerMap2.get(keyName);

                        if (idx1 === undefined || idx2 === undefined) {
                            const missingKeyName = rawKeyName || "Unknown";
                            return {
                                error: {
                                    warnings: [
                                        {
                                            context: "file2",
                                            messageKey: "key_not_found_in_file2",
                                            details: `"${missingKeyName}"`,
                                        },
                                    ],
                                    differences: [],
                                    headers: [],
                                },
                            };
                        }
                        keyIndices1.push(idx1);
                        keyIndices2.push(idx2);
                    }

                    return { headerMap1, headerMap2, keyIndices1, keyIndices2 };
                }

                compareFiles(data1, data2, options) {
                    const { keyColumns: rawKeyColumns, cols1, cols2, valueDelimiter, columnDelimiter } = options;

                    const headers1 = data1[0] || [];
                    const headers2 = data2[0] || [];

                    const headerRes = this.#buildHeaderIndexMaps(headers1, headers2, cols1, cols2, rawKeyColumns);
                    if (headerRes.error) return headerRes.error;
                    const { keyIndices1, keyIndices2 } = headerRes;

                    const dataRes = this.#buildDataMap(data1, data2, cols1, cols2, keyIndices1, keyIndices2, {
                        valueDelimiter,
                        columnDelimiter,
                    });
                    if (dataRes.error) return dataRes.error;
                    const { dataMap, finalHeaders1, finalHeaders2, warnings } = dataRes;

                    const selectedHeaders1 = cols1.map((i) => (headers1[i] || "").trim());
                    const selectedHeaders2 = cols2.map((i) => (headers2[i] || "").trim());

                    const allHeaders = [];
                    const seenHeaders = new Set();
                    [...selectedHeaders1, ...selectedHeaders2].forEach((h) => {
                        if (h && !seenHeaders.has(h)) {
                            seenHeaders.add(h);
                            allHeaders.push(h);
                        }
                    });

                    const headerMap1 = new Map(finalHeaders1.map((h, i) => [h, i]));
                    const headerMap2 = new Map(finalHeaders2.map((h, i) => [h, i]));
                    const keyHeaderNamesSet = new Set(keyIndices1.map((idx) => finalHeaders1[idx]));

                    const diffRes = this.#createDiffRows(
                        dataMap,
                        allHeaders,
                        headerMap1,
                        headerMap2,
                        keyHeaderNamesSet
                    );

                    return {
                        warnings,
                        differences: diffRes.differences,
                        headers: diffRes.headers,
                        stats: diffRes.stats,
                    };
                }

                #createDiffRows(dataMap, allHeaders, headerMap1, headerMap2, keyHeaderNamesSet) {
                    const allHeadersCount = allHeaders.length;
                    const map1Indices = new Int32Array(allHeadersCount);
                    const map2Indices = new Int32Array(allHeadersCount);
                    const isKeyFlags = new Uint8Array(allHeadersCount);

                    for (let i = 0; i < allHeadersCount; i++) {
                        const header = allHeaders[i];
                        map1Indices[i] = headerMap1.has(header) ? headerMap1.get(header) : -1;
                        map2Indices[i] = headerMap2.has(header) ? headerMap2.get(header) : -1;
                        isKeyFlags[i] = keyHeaderNamesSet.has(header) ? 1 : 0;
                    }

                    const differences = [];
                    let countMatching = 0;
                    let countOnlyFile1 = 0;
                    let countOnlyFile2 = 0;

                    for (const entry of dataMap.values()) {
                        const diffRow = new Array(allHeadersCount);
                        const { status, row1: r1, row2: r2 } = entry;

                        switch (status) {
                            case Comparer.RowStatus.UNCHANGED:
                            case Comparer.RowStatus.MODIFIED:
                                countMatching++;
                                break;
                            case Comparer.RowStatus.DELETED:
                                countOnlyFile1++;
                                break;
                            case Comparer.RowStatus.ADDED:
                                countOnlyFile2++;
                                break;
                        }

                        for (let i = 0; i < allHeadersCount; i++) {
                            const header = allHeaders[i];
                            const idx1 = map1Indices[i];
                            const idx2 = map2Indices[i];
                            const val1 = r1 && idx1 !== -1 ? (r1[idx1] ?? "") : "";
                            const val2 = r2 && idx2 !== -1 ? (r2[idx2] ?? "") : "";

                            switch (status) {
                                case Comparer.RowStatus.UNCHANGED:
                                    diffRow[i] = {
                                        type: Comparer.CellStatus.UNCHANGED,
                                        value: val1,
                                        columnName: header,
                                    };
                                    break;
                                case Comparer.RowStatus.MODIFIED: {
                                    const s1 = String(val1).trim();
                                    const s2 = String(val2).trim();
                                    diffRow[i] =
                                        s1 !== s2
                                            ? {
                                                  type: Comparer.CellStatus.DIFFERENCE,
                                                  oldValue: val1,
                                                  newValue: val2,
                                                  columnName: header,
                                              }
                                            : { type: Comparer.CellStatus.UNCHANGED, value: val1, columnName: header };
                                    break;
                                }
                                case Comparer.RowStatus.DELETED:
                                    diffRow[i] = {
                                        type: Comparer.CellStatus.DELETED,
                                        oldValue: val1,
                                        columnName: header,
                                    };
                                    break;
                                case Comparer.RowStatus.ADDED:
                                    diffRow[i] = {
                                        type: Comparer.CellStatus.ADDED,
                                        newValue: val2,
                                        columnName: header,
                                    };
                                    break;
                            }
                        }
                        differences.push(diffRow);
                    }

                    const coloredHeaders = new Array(allHeadersCount);
                    for (let i = 0; i < allHeadersCount; i++) {
                        const header = allHeaders[i];
                        let headerText = header;

                        if (map1Indices[i] === -1) {
                            headerText = `<span class="highlight-second">${header}</span>`;
                        } else if (map2Indices[i] === -1) {
                            headerText = `<span class="highlight-first">${header}</span>`;
                        }

                        coloredHeaders[i] = isKeyFlags[i]
                            ? `<span class="primary-underlined">${headerText}</span>`
                            : headerText;
                    }

                    const diffCount = differences.length;

                    return {
                        differences,
                        headers: coloredHeaders,
                        stats: {
                            displayedRows: diffCount,
                            totalRows: diffCount,
                            countMatching,
                            countOnlyFile1,
                            countOnlyFile2,
                        },
                    };
                }

                processDuplicateConsolidation(data, selectedColumns, duplicateDelimiter, options = {}) {
                    if (!data || data.length < 2) return { success: true, data: [] };

                    const dataLen = data.length;
                    for (let r = 1; r < dataLen; r++) {
                        const row = data[r];
                        if (!row) continue;
                        const rowLen = row.length;
                        for (let c = 0; c < rowLen; c++) {
                            const cellValue = String(row[c] ?? "");
                            if (duplicateDelimiter && cellValue.includes(duplicateDelimiter)) {
                                return { success: false, reason: "HAS_DUPLICATE_DELIMITER", value: cellValue };
                            }
                        }
                    }

                    const map = new Map();
                    const valDelimiter = options.valueDelimiter || "~";
                    const textCollator = new Intl.Collator("en", { sensitivity: "base", numeric: true });
                    const selColCount = selectedColumns.length;

                    for (let r = 1; r < dataLen; r++) {
                        const row = data[r];
                        if (!row) continue;

                        let isAllEmpty = true;
                        const rowLen = row.length;
                        for (let c = 0; c < rowLen; c++) {
                            if (String(row[c] ?? "").trim() !== "") {
                                isAllEmpty = false;
                                break;
                            }
                        }
                        if (isAllEmpty) continue;

                        const keyParts = new Array(selColCount);
                        for (let k = 0; k < selColCount; k++) {
                            keyParts[k] = String(row[selectedColumns[k]] ?? "").trim();
                        }
                        const key = keyParts.join(valDelimiter);

                        let entry = map.get(key);

                        if (!entry) {
                            entry = new Array(rowLen);
                            for (let c = 0; c < rowLen; c++) {
                                const val = String(row[c] ?? "").trim();
                                const valueSet = new Set();
                                if (val !== "") valueSet.add(val);
                                entry[c] = valueSet;
                            }
                            map.set(key, entry);
                        } else {
                            for (let c = 0; c < rowLen; c++) {
                                const val = String(row[c] ?? "").trim();
                                if (val !== "") {
                                    entry[c].add(val);
                                }
                            }
                        }
                    }

                    const processedRows = [];
                    for (const entrySets of map.values()) {
                        const rowLen = entrySets.length;
                        const finalRow = new Array(rowLen);

                        for (let c = 0; c < rowLen; c++) {
                            const set = entrySets[c];
                            if (set.size === 0) {
                                finalRow[c] = "";
                            } else if (set.size === 1) {
                                finalRow[c] = set.values().next().value;
                            } else {
                                const parts = Array.from(set);
                                parts.sort(textCollator.compare);
                                finalRow[c] = parts.join(duplicateDelimiter);
                            }
                        }
                        processedRows.push(finalRow);
                    }
                    map.clear();

                    return { success: true, data: processedRows };
                }

                #validateKeyUniqueness(data, fileName, colorClass, keyColumns, delimiters) {
                    const warnings = [];
                    const entityCount = new Map();
                    const headerCount = new Map();
                    let hasCriticalError = false;
                    let foundEmptyKey = false;

                    const valDelimiter = delimiters.valueDelimiter ?? "~";
                    const colDelimiter = delimiters.columnDelimiter ?? ";";

                    const headers = data[0];
                    if (headers) {
                        for (let i = 0; i < headers.length; i++) {
                            const header = String(headers[i] ?? "");
                            const count = (headerCount.get(header) || 0) + 1;
                            headerCount.set(header, count);
                        }

                        const headerMsgKey =
                            fileName === "file1" ? "column_not_unique_in_file1" : "column_not_unique_in_file2";
                        for (const [header, count] of headerCount) {
                            if (count > 1) {
                                hasCriticalError = true;
                                warnings.push({
                                    context: fileName,
                                    messageKey: headerMsgKey,
                                    details: `"${Utility.escapeHTML(header)}"`,
                                });
                            }
                        }
                    }

                    const isFile1 = fileName === "file1";
                    const recordMsgKey = isFile1 ? "first_file_record_not_unique" : "second_file_column_not_unique";
                    const keyColCount = keyColumns.length;

                    for (let i = 1; i < data.length; i++) {
                        const row = data[i];
                        if (!Array.isArray(row)) continue;

                        let hasEmptyPart = false;
                        const keyParts = new Array(keyColCount);

                        for (let k = 0; k < keyColCount; k++) {
                            const part = String(row[keyColumns[k]] ?? "").trim();
                            if (!part) {
                                hasEmptyPart = true;
                                break;
                            }
                            keyParts[k] = part;
                        }

                        if (hasEmptyPart) {
                            foundEmptyKey = true;
                            break;
                        }

                        const key = keyParts.join(valDelimiter);
                        const currentCount = entityCount.get(key) || 0;

                        if (currentCount === 1) {
                            hasCriticalError = true;
                            const rawDisplayKey = keyParts.join(`${colDelimiter} `);
                            let decodedKey = rawDisplayKey;

                            if (rawDisplayKey.includes("%")) {
                                try {
                                    decodedKey = decodeURIComponent(rawDisplayKey);
                                } catch (e) {}
                            }

                            warnings.push({
                                context: fileName,
                                messageKey: recordMsgKey,
                                details: `"${Utility.escapeHTML(decodedKey)}"`,
                            });
                        }

                        entityCount.set(key, currentCount + 1);
                    }

                    if (foundEmptyKey) {
                        hasCriticalError = true;
                        warnings.push({
                            context: fileName,
                            messageKey: isFile1 ? "first_file_has_empty_keys" : "second_file_has_empty_keys",
                        });
                    }

                    return { warnings, hasCriticalError };
                }
            }
            
            class TableManager {
                constructor(lang, tr, handlers = {}) {
                    this.lang = lang;
                    this.tr = tr;
                    this.els = {};
                    this.currentTable = null;
                    this.currentFilterRow = null;
                    this.hiddenColumns = new Set();
                    this.#getElements();

                    Object.freeze(this.els);
                    this.#updateTranslations();
                }

                #applyColumnSorting(header, table) {
                    const tbody = table.tBodies[0];
                    if (!tbody) return;

                    const columnIndex = header.cellIndex;
                    const rows = Array.from(tbody.rows);
                    const rowCount = rows.length;
                    if (rowCount === 0) return;

                    const currentSort = header.dataset.sort || "none";
                    const nextSort = currentSort === "asc" ? "desc" : currentSort === "desc" ? "none" : "asc";

                    table.querySelectorAll("th").forEach((th) => {
                        th.dataset.sort = "none";
                        const otherIcon = th.querySelector(".sort-icon");
                        if(otherIcon) otherIcon.innerHTML = '';
                    });

                    header.dataset.sort = nextSort;

                    const sortIcon = header.querySelector(".sort-icon");
                    if (!sortIcon) return;

                    if (nextSort === "none") {
                        sortIcon.innerHTML = '';
                        rows.sort((a, b) => parseInt(a.dataset.origIndex, 10) - parseInt(b.dataset.origIndex, 10));
                    } else {
                        const arrowPoints = nextSort === "asc" ? "18 15 12 9 6 15" : "6 9 12 15 18 9";
                        sortIcon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 1em; height: 1em; display: inline-block; vertical-align: middle; margin-left: 4px;"><polyline points="${arrowPoints}"></polyline></svg>`;

                        const headerIsInFile1 = header.innerHTML.includes("highlight-first");
                        const headerIsInFile2 = header.innerHTML.includes("highlight-second");
                        const selector = headerIsInFile1
                            ? ".highlight-first"
                            : headerIsInFile2
                              ? ".highlight-second"
                              : null;

                        const decorated = new Array(rowCount);
                        for (let i = 0; i < rowCount; i++) {
                            const row = rows[i];
                            const cell = row.cells[columnIndex];
                            let rawVal = "";

                            if (cell) {
                                if (selector) {
                                    const el = cell.querySelector(selector);
                                    rawVal = el ? el.textContent.trim() : "";
                                } else {
                                    rawVal = cell.textContent.trim();
                                }
                            }

                            const num = parseFloat(rawVal.replace(/\./g, "").replace(",", "."));
                            decorated[i] = {
                                row,
                                rawVal,
                                num: isNaN(num) ? null : num,
                            };
                        }

                        const isAsc = nextSort === "asc";
                        const modifier = isAsc ? 1 : -1;
                        const collator = new Intl.Collator(this.lang, { sensitivity: "base", numeric: true });

                        decorated.sort((a, b) => {
                            if (a.num !== null && b.num !== null) {
                                return (a.num - b.num) * modifier;
                            }
                            return collator.compare(a.rawVal, b.rawVal) * modifier;
                        });

                        for (let i = 0; i < rowCount; i++) {
                            rows[i] = decorated[i].row;
                        }
                    }

                    tbody.append(...rows);
                }

			    clearOutput() {
			        this.els.output.style.minHeight = "";
			        this.els.output.replaceChildren();
			        this.els.searchContainer?.classList.add("hidden");
			        this.hiddenColumns.clear();
			        this.columnHeaders = [];
			    }

                clearStatus() {
                    if (!this.els.status) return;
                    this.els.status.replaceChildren();
                    this.els.status.style.visibility = "hidden";
                }


			    #createTableHeader(headers, uniqueValuesMap, hasEmptyArray, options) {
			        const textCollator = new Intl.Collator("en", { sensitivity: "base", numeric: true });
			        const thead = document.createElement("thead");
			        const headerTr = document.createElement("tr");
			        const filterTr = document.createElement("tr");
			
			        this.columnHeaders = [];
			        this.currentFilterRow = filterTr;
			        filterTr.className = "table-filter-row";
			        if (!(options.activateFilter ?? true)) {
			            filterTr.style.display = "none";
			        }
			
			        const { filter_all: textFilterAll, filter_empty: textFilterEmpty } = this.tr[this.lang];
			        const headersLen = headers.length;
			
			        for (let colIndex = 0; colIndex < headersLen; colIndex++) {
			            const header = headers[colIndex];
			            const th = document.createElement("th");
			            th.dataset.originalIndex = colIndex;
			
			            const headerWrapper = document.createElement('div');
			            headerWrapper.className = 'header-content-wrapper';
			
			            const moveLeft = document.createElement('span');
			            moveLeft.className = 'col-move-btn move-col-left';
			            moveLeft.title = 'Spalte nach links verschieben';
			            moveLeft.innerHTML = '←';
			
			            const sortTrigger = document.createElement('span');
			            sortTrigger.className = 'sort-trigger';
			            sortTrigger.innerHTML = header;
			
			            const sortIcon = document.createElement('span');
			            sortIcon.className = 'sort-icon';
			
			            sortTrigger.appendChild(sortIcon);
			
			            const moveRight = document.createElement('span');
			            moveRight.className = 'col-move-btn move-col-right';
			            moveRight.title = 'Spalte nach rechts verschieben';
			            moveRight.innerHTML = '→';
			
			            headerWrapper.append(moveLeft, sortTrigger, moveRight);
			            th.appendChild(headerWrapper);
			            headerTr.appendChild(th);
			
			            this.columnHeaders.push({ th, icon: sortIcon });
			
			            const filterTd = document.createElement("td");
			            filterTd.className = "table-filter-cell";
			            filterTd.dataset.originalIndex = colIndex;
			
			            const optionsHtml = [`<option value="select-all" selected>${textFilterAll}</option>`];
			
			            if (hasEmptyArray[colIndex]) {
			                optionsHtml.push(`<option value="empty">${textFilterEmpty}</option>`);
			            }
			
			            const sortedValues = Array.from(uniqueValuesMap[colIndex]).sort(textCollator.compare);
			            const sortedLen = sortedValues.length;
			
			            for (let i = 0; i < sortedLen; i++) {
			                const val = sortedValues[i];
			                optionsHtml.push(
			                    `<option value="${Utility.escapeHTML(val)}">${Utility.escapeHTML(val)}</option>`
			                );
			            }
			
			            const select = document.createElement("select");
			            select.multiple = true;
			            select.dataset.colIndex = colIndex;
			            select.className = "table-filter-dropdown";
			            select.innerHTML = optionsHtml.join("");
			
			            filterTd.appendChild(select);
			            filterTr.appendChild(filterTd);
			        }
			
			        thead.append(headerTr, filterTr);
			        return thead;
			    }


                #createTableBody(data) {
                    const tbody = document.createElement("tbody");
                    const tbodyFragment = document.createDocumentFragment();
                    const dataLen = data.length;

                    for (let r = 0; r < dataLen; r++) {
                        const row = data[r];
                        const rowLen = row.length;
                        let hasDeleted = false;
                        let hasAdded = false;

                        const tr = document.createElement("tr");
                        tr.dataset.origIndex = r;

                        for (let c = 0; c < rowLen; c++) {
                            const cellObj = row[c];
                            const td = document.createElement("td");
                            td.dataset.originalIndex = c; 

                            if (cellObj != null) {
                                if (typeof cellObj !== "object") {
                                    td.textContent = cellObj;
                                } else {
                                    const type = cellObj.type ?? Comparer.CellStatus.UNCHANGED;

                                    if (type === Comparer.CellStatus.DELETED) hasDeleted = true;
                                    else if (type === Comparer.CellStatus.ADDED) hasAdded = true;

                                    switch (type) {
                                        case Comparer.CellStatus.DIFFERENCE: {
                                            const span1 = document.createElement("span");
                                            span1.className = "highlight-first";
                                            span1.textContent = cellObj.oldValue ?? "";

                                            const span2 = document.createElement("span");
                                            span2.className = "highlight-second";
                                            span2.textContent = cellObj.newValue ?? "";

                                            td.append(span1, " ", span2);
                                            break;
                                        }
                                        case Comparer.CellStatus.DELETED: {
                                            const span = document.createElement("span");
                                            span.className = "highlight-first";
                                            span.textContent =
                                                cellObj.value !== undefined ? cellObj.value : (cellObj.oldValue ?? "");
                                            td.appendChild(span);
                                            break;
                                        }
                                        case Comparer.CellStatus.ADDED: {
                                            const span = document.createElement("span");
                                            span.className = "highlight-second";
                                            span.textContent =
                                                cellObj.value !== undefined ? cellObj.value : (cellObj.newValue ?? "");
                                            td.appendChild(span);
                                            break;
                                        }
                                        case Comparer.CellStatus.UNCHANGED:
                                        default:
                                            td.textContent = cellObj.value ?? "";
                                            break;
                                    }
                                }
                            }
                            tr.appendChild(td);
                        }

                        tr.dataset.rowType =
                            hasDeleted && !hasAdded ? "onlyFile1" : !hasDeleted && hasAdded ? "onlyFile2" : "matching";
                        tbodyFragment.appendChild(tr);
                    }

                    tbody.appendChild(tbodyFragment);
                    return tbody;
                }

                #extractUniqueAndEmptyValues(colCount, data) {
                    const uniqueValuesMap = Array.from({ length: colCount }, () => new Set());
                    const hasEmptyArray = new Array(colCount).fill(false);
                    const dataLen = data.length;

                    for (let i = 0; i < dataLen; i++) {
                        const row = data[i];
                        const rowLen = row.length;

                        for (let j = 0; j < rowLen; j++) {
                            if (j >= colCount) break;

                            const cellObj = row[j];
                            if (cellObj == null) {
                                hasEmptyArray[j] = true;
                                continue;
                            }

                            if (typeof cellObj === "object") {
                                const type = cellObj.type ?? Comparer.CellStatus.UNCHANGED;

                                switch (type) {
                                    case Comparer.CellStatus.DIFFERENCE: {
                                        const oldVal = (
                                            cellObj.oldValue != null ? String(cellObj.oldValue) : ""
                                        ).trim();
                                        const newVal = (
                                            cellObj.newValue != null ? String(cellObj.newValue) : ""
                                        ).trim();

                                        if (oldVal) uniqueValuesMap[j].add(oldVal);
                                        if (newVal) uniqueValuesMap[j].add(newVal);
                                        if (!oldVal || !newVal) hasEmptyArray[j] = true;
                                        break;
                                    }
                                    case Comparer.CellStatus.DELETED: {
                                        const val = (
                                            cellObj.oldValue != null
                                                ? String(cellObj.oldValue)
                                                : cellObj.value != null
                                                  ? String(cellObj.value)
                                                  : ""
                                        ).trim();
                                        if (val) uniqueValuesMap[j].add(val);
                                        else hasEmptyArray[j] = true;
                                        break;
                                    }
                                    case Comparer.CellStatus.ADDED: {
                                        const val = (
                                            cellObj.newValue != null
                                                ? String(cellObj.newValue)
                                                : cellObj.value != null
                                                  ? String(cellObj.value)
                                                  : ""
                                        ).trim();
                                        if (val) uniqueValuesMap[j].add(val);
                                        else hasEmptyArray[j] = true;
                                        break;
                                    }
                                    default: {
                                        const val = (cellObj.value != null ? String(cellObj.value) : "").trim();
                                        if (val) uniqueValuesMap[j].add(val);
                                        else hasEmptyArray[j] = true;
                                        break;
                                    }
                                }
                            } else {
                                const val = String(cellObj).trim();
                                if (val) uniqueValuesMap[j].add(val);
                                else hasEmptyArray[j] = true;
                            }
                        }
                    }

                    return { uniqueValuesMap, hasEmptyArray };
                }

                static #extractValuesFromCell(cell, valuesSet) {
                    if (!cell || !valuesSet) return;

                    const firstEl = cell.querySelector(".highlight-first");
                    const secondEl = cell.querySelector(".highlight-second");

                    if (firstEl || secondEl) {
                        const oldVal = (firstEl?.textContent ?? "").trim();
                        const newVal = (secondEl?.textContent ?? "").trim();
                        if (oldVal) valuesSet.add(oldVal);
                        if (newVal) valuesSet.add(newVal);
                        if (!oldVal && !newVal) valuesSet.add("empty");
                    } else {
                        const val = cell.textContent.trim();
                        valuesSet.add(val || "empty");
                    }
                }

                #getElements() {
                    this.els.output = document.getElementById("output");
                    this.els.globalSearch = document.getElementById("search_placeholder");
                    this.els.searchClear = document.getElementById("search_clear");
                    if (this.els.searchClear) this.els.searchClear.style.display = "none";
                    this.els.searchContainer = document.getElementById("search-container");
                    this.els.status = document.getElementById("status");
                    this.els.resetColOrderBtn = document.getElementById("reset-col-order-btn");
                }

                getActiveColumnFilters(headerCells, isColumnFilterActive) {
                    if (!isColumnFilterActive) return [];
                    const activeFilters = [];
                    headerCells.forEach((td, index) => {
                        const dropdown = td.querySelector("select");
                        if (!dropdown) return;
                        const selectAllOpt = dropdown.querySelector('option[value="select-all"]');
                        if (selectAllOpt && selectAllOpt.selected) return;
                        const selectedValues = new Set(Array.from(dropdown.selectedOptions, (o) => o.value));
                        if (selectedValues.size > 0 && !selectedValues.has("select-all")) {
                            activeFilters.push({
                                colIndex: index,
                                selectedValues,
                            });
                        }
                    });
                    return activeFilters;
                }
                
              
                resetColumnOrder() {
                    if (!this.currentTable) return;
                    
                    this.#resetAllHighlights();

                    const rows = this.currentTable.querySelectorAll('tr');
                    rows.forEach(row => {
                        const cells = Array.from(row.children).sort((a, b) => 
                            parseInt(a.dataset.originalIndex, 10) - parseInt(b.dataset.originalIndex, 10)
                        );
                        row.replaceChildren(...cells);
                    });

                    this.#updateMoveButtonsState();
                    this.#updateResetButtonVisibility();
                }
                
                
                #isOrderDefault() {
                    if (!this.currentTable) return true;
                    const headers = this.currentTable.querySelector('thead tr:first-child').children;
                    return Array.from(headers).every((th, index) => parseInt(th.dataset.originalIndex, 10) === index);
                }

                #updateResetButtonVisibility() {
                    if (!this.els.resetColOrderBtn) return;
                    this.els.resetColOrderBtn.classList.toggle('hidden', this.#isOrderDefault());
                }


                handleHeaderClick(header, eventTarget) {
                    const colIndex = header.cellIndex;
                    if (eventTarget.closest(".move-col-left")) {
                        this.#moveColumn(colIndex, -1);
                    } else if (eventTarget.closest(".move-col-right")) {
                        this.#moveColumn(colIndex, 1);
                    } else if (eventTarget.closest(".sort-trigger")) {
                        this.#applyColumnSorting(header, this.currentTable);
                    } else {
                        this.#toggleColumnHighlight(header, this.currentTable);
                    }
                }


                #resetAllHighlights() {
                    if (!this.currentTable) return;
                    this.currentTable.querySelectorAll('.highlighted-column').forEach(cell => {
                        cell.classList.remove('highlighted-column');
                    });
                    this.currentTable.querySelectorAll('tbody tr').forEach(row => {
                        row.style.backgroundColor = '';
                    });
                    this.currentTable.querySelectorAll('.search-highlight').forEach(span => {
                        span.replaceWith(span.textContent);
                    });
                }



                #moveColumn(colIndex, direction) {
                    if (!this.currentTable) return;
                    const newIndex = colIndex + direction;

                    this.currentTable.querySelectorAll('tr').forEach(row => {
                        const cells = Array.from(row.children);
                        const cellToMove = cells[colIndex];
                        const targetCell = cells[newIndex];

                        if (direction === -1) {
                            row.insertBefore(cellToMove, targetCell);
                        } else {
                            row.insertBefore(cellToMove, targetCell.nextSibling);
                        }
                    });

                    this.#updateMoveButtonsState();
                    this.#updateResetButtonVisibility();
                }
                
                #updateMoveButtonsState() {
                    if (!this.currentTable) return;
                    const headers = this.currentTable.querySelector('thead tr:first-child').children;
                    const numCols = headers.length;

                    Array.from(headers).forEach((th, index) => {
                        const leftBtn = th.querySelector('.move-col-left');
                        const rightBtn = th.querySelector('.move-col-right');
                        if (leftBtn) leftBtn.classList.toggle('disabled', index === 0);
                        if (rightBtn) rightBtn.classList.toggle('disabled', index === numCols - 1);
                    });
                }




                #updateRestoreButton() {
                    const count = this.hiddenColumns.size;
                    this.els.restoreColsBtn.classList.toggle('hidden', count === 0);
                }


                highlightNodeText(node, term) {
                    if (!node || !term) return;
                    if (node.nodeType === Node.TEXT_NODE) {
                        const text = node.textContent;
                        const regex = new RegExp(`(${Utility.escapeRegExp(term)})`, "gi");
                        const parts = text.split(regex);
                        if (parts.length > 1) {
                            const fragment = document.createDocumentFragment();
                            parts.forEach((part) => {
                                if (part.toLowerCase() === term.toLowerCase()) {
                                    const span = document.createElement("span");
                                    span.className = "search-highlight";
                                    span.textContent = part;
                                    fragment.appendChild(span);
                                } else {
                                    fragment.appendChild(document.createTextNode(part));
                                }
                            });
                            node.parentNode.replaceChild(fragment, node);
                        }
                    } else if (
                        node.nodeType === Node.ELEMENT_NODE &&
                        node.nodeName !== "SCRIPT" &&
                        node.nodeName !== "STYLE"
                    ) {
                        Array.from(node.childNodes).forEach((child) => this.highlightNodeText(child, term));
                    }
                }

                handleTableFilterChange(dropdown) {
                    const allOption = dropdown.querySelector('option[value="select-all"]');
                    if (!allOption) return;

                    const selectedOptions = Array.from(dropdown.selectedOptions);
                    const numSelected = selectedOptions.length;

                    const allIsSelected = selectedOptions.some((o) => o.value === "select-all");

                    if (numSelected > 1 && allIsSelected) {
                        allOption.selected = false;
                    } else if (numSelected === 0) {
                        allOption.selected = true;
                    } else if (numSelected >= 1 && !allIsSelected) {
                        allOption.selected = false;
                    }

                    dropdown.classList.toggle("filter-active", !allOption.selected);
                }

                #updateTranslations() {
                    if (this.els.globalSearch) {
                        this.els.globalSearch.placeholder = this.tr[this.lang]["search_placeholder"];
                    }
                }

                reset() {
                    this.clearStatus();
                    this.clearOutput();
                    if (this.els.globalSearch) {
                        this.els.globalSearch.value = "";
                    }
                    if (this.els.searchClear) {
                        this.els.searchClear.style.display = "none";
                    }
                    if (this.els.resetColOrderBtn) {
                        this.els.resetColOrderBtn.classList.add('hidden');
                    }                    
                }

                renderTable(headers, data, options = {}) {
                    this.clearOutput();
                    const colCount = headers.length;
                    const { uniqueValuesMap, hasEmptyArray } = this.#extractUniqueAndEmptyValues(colCount, data);
                    const fragment = document.createDocumentFragment();
                    const table = document.createElement("table");
                    table.className = "custom-table";
                    this.currentTable = table;
                    const thead = this.#createTableHeader(headers, uniqueValuesMap, hasEmptyArray, options);
                    table.appendChild(thead);
                    const tbody = this.#createTableBody(data);
                    table.appendChild(tbody);
                    fragment.appendChild(table);
                    this.els.output.appendChild(fragment);
                    

                    const viewportMin = window.innerHeight - 150;
                    this.els.output.style.minHeight = `${viewportMin}px`;

                    if (this.els.searchContainer) {
                        this.els.searchContainer.classList.remove("hidden");
                    }
                    const rows = table.tBodies[0].rows;
                    for (const row of rows) {
                        row._cachedSearchText = row.textContent.toLowerCase();
                    }
                    this.#updateMoveButtonsState();
                    this.#updateResetButtonVisibility();                    
                }


                renderText(headers, data, { includeEmptyLines, columnDelimiter, valueDelimiter }) {
                    this.clearOutput();
                    this.currentTable = null;

                    if (this.els.resetColOrderBtn) {
                        this.els.resetColOrderBtn.classList.add('hidden');
                    }

                    const fragment = document.createDocumentFragment();

                    const headerEl = document.createElement("div");
                    headerEl.className = "text-header";
                    headerEl.innerHTML = headers.join(columnDelimiter);
                    fragment.appendChild(headerEl);

                    if (includeEmptyLines && data.length > 0) {
                        fragment.appendChild(document.createElement("br"));
                    }

                    const lineElements = [];
                    for (let r = 0; r < data.length; r++) {
                        const row = data[r];
                        const rowParts = new Array(row.length);

                        for (let c = 0; c < row.length; c++) {
                            const { type, value, oldValue, newValue } = Utility.getCellData(row[c]);
                            switch (type) {
                                case Comparer.CellStatus.DIFFERENCE:
                                    rowParts[c] =
                                        `<span class="highlight-first">${Utility.escapeHTML(oldValue)}</span>${valueDelimiter}<span class="highlight-second">${Utility.escapeHTML(newValue)}</span>`;
                                    break;
                                case Comparer.CellStatus.DELETED:
                                    rowParts[c] =
                                        `<span class="highlight-first">${Utility.escapeHTML(oldValue)}</span>${valueDelimiter}`;
                                    break;
                                case Comparer.CellStatus.ADDED:
                                    rowParts[c] =
                                        `${valueDelimiter}<span class="highlight-second">${Utility.escapeHTML(newValue)}</span>`;
                                    break;
                                default:
                                    rowParts[c] = Utility.escapeHTML(value);
                                    break;
                            }
                        }

                        const lineDiv = document.createElement("div");
                        lineDiv.className = "text-line";
                        lineDiv.innerHTML = rowParts.join(columnDelimiter);

                        lineDiv.dataset.searchText = lineDiv.textContent.toLowerCase();
                        const hasFirst = lineDiv.innerHTML.includes("highlight-first");
                        const hasSecond = lineDiv.innerHTML.includes("highlight-second");
                        lineDiv.dataset.rowType =
                            hasFirst && !hasSecond ? "onlyFile1" : !hasFirst && hasSecond ? "onlyFile2" : "matching";

                        lineElements.push(lineDiv);
                    }

                    if (includeEmptyLines) {
                        lineElements.forEach((line, index) => {
                            fragment.appendChild(line);
                            if (index < lineElements.length - 1) {
                                fragment.appendChild(document.createElement("br"));
                            }
                        });
                    } else {
