                            cbO2.checked = !o2Disabled && !!data.rowTypeFilters.onlyFile2;
                            cbO2.parentElement.style.opacity = o2Disabled ? "0.4" : "1";
                        }
                        return;
                    }

                    this.els.status.replaceChildren();
                    const unitLabel = data.totalCount === 1 ? this.tr[this.lang].row : this.tr[this.lang].rows;
                    const elVis = document.createElement("span");
                    elVis.id = "status-visible-count";
                    elVis.textContent = data.visibleCount;
                    const elTotal = document.createElement("span");
                    elTotal.id = "status-total-count";
                    elTotal.textContent = data.totalCount;
                    const txtOf = ` ${this.tr[this.lang].of} `;
                    const txtUnit = ` ${unitLabel}`;

                    this.els.status.appendChild(elVis);

                    if (!data.isSingleView && data.stats) {
                        const rtf = data.rowTypeFilters;
                        const countM = data.comparisonStats?.matching ?? data.stats.matching;
                        const countO1 = data.comparisonStats?.onlyFile1 ?? data.stats.onlyFile1;
                        const countO2 = data.comparisonStats?.onlyFile2 ?? data.stats.onlyFile2;

                        const createFilter = (id, filter, count, isChecked, isDisabled, className = "") => {
                            const lbl = document.createElement("label");
                            lbl.style.cssText = `${isDisabled ? "opacity: 0.4; cursor: not-allowed;" : "cursor: pointer;"} display: inline-flex; align-items: center; gap: 3px;`;

                            const span = document.createElement("span");
                            span.id = `status-count-${id}`;
                            if (className) span.className = className;
                            span.textContent = count;

                            const cb = document.createElement("input");
                            cb.type = "checkbox";
                            cb.className = "status-filter-checkbox";
                            cb.dataset.filter = filter;
                            cb.checked = !isDisabled && isChecked;
                            cb.disabled = isDisabled;
                            cb.style.cssText = "cursor: inherit; margin: 0; vertical-align: middle;";

                            lbl.append(span, cb);
                            return lbl;
                        };

                        const lblM = createFilter("matching", "matching", countM, rtf.matching, countM === 0);
                        const lblO1 = createFilter(
                            "only1",
                            "onlyFile1",
                            countO1,
                            rtf.onlyFile1,
                            countO1 === 0,
                            "highlight-first"
                        );
                        const lblO2 = createFilter(
                            "only2",
                            "onlyFile2",
                            countO2,
                            rtf.onlyFile2,
                            countO2 === 0,
                            "highlight-second"
                        );

                        this.els.status.append(" (", lblO1, ", ", lblO2, ", ", lblM, ")");

                    }

                    this.els.status.append(txtOf, elTotal, txtUnit);
                }


                renderTableOutput(tbody, rows, rowMatchesFilters, originalSearchTerm) {
                    if (!this.els.output.style.minHeight) {
                        this.els.output.style.minHeight = `${this.els.output.offsetHeight}px`;
                    }

                    let visibleCount = 0;
                    let visibleOnlyFile1 = 0;
                    let visibleOnlyFile2 = 0;
                    let visibleMatching = 0;

                    const rowCount = rows.length;
                    const hasSearch = originalSearchTerm !== "";

                    for (let i = 0; i < rowCount; i++) {
                        const row = rows[i];
                        const isVisible = rowMatchesFilters(row, -1);
                        row.style.display = isVisible ? "" : "none";

                        if (isVisible) {
                            visibleCount++;
                            const rowType = row.dataset.rowType || "matching";

                            if (rowType === "onlyFile1") visibleOnlyFile1++;
                            else if (rowType === "onlyFile2") visibleOnlyFile2++;
                            else visibleMatching++;

                            if (hasSearch && row._cachedSearchText.includes(originalSearchTerm.toLowerCase())) {
                                const cells = row.cells;
                                const cellCount = cells.length;
                                for (let c = 0; c < cellCount; c++) {
                                    this.highlightNodeText(cells[c], originalSearchTerm);
                                }
                            }
                        }
                    }

                    return {
                        visibleCount,
                        totalRows: rowCount,
                        stats: {
                            matching: visibleMatching,
                            onlyFile1: visibleOnlyFile1,
                            onlyFile2: visibleOnlyFile2,
                        },
                    };
                }

                #resetAllFilters(table) {
                    table.querySelectorAll(".table-filter-dropdown").forEach((dropdown) => {
                        dropdown.value = "select-all";
                        dropdown.classList.remove("filter-active");
                    });
                }

				#toggleColumnHighlight(header, table) {
				    const columnIndex = header.cellIndex;
				    const isAlreadyHighlighted = header.classList.contains("highlighted-column");
				
				    const action = isAlreadyHighlighted ? "remove" : "add";

				    header.classList[action]("highlighted-column");
				
				    const filterRow = table.querySelector("thead tr.table-filter-row");
				    if (filterRow && filterRow.cells[columnIndex]) {
				        filterRow.cells[columnIndex].classList[action]("highlighted-column");
				    }
				
				    const tbody = table.tBodies[0];
				    if (tbody) {
				        for (let i = 0; i < tbody.rows.length; i++) {
				            const cell = tbody.rows[i].cells[columnIndex];
				            if (cell) {
				                cell.classList[action]("highlighted-column");
				            }
				        }
				    }
				}


			updateColumnDropdowns(headerCells, allRows, activeFilters, rowMatchesFilters, activeDropdown = null) {
			    const colCount = headerCells.length;
			    const textCollator = new Intl.Collator("en", { sensitivity: "base", numeric: true });
			
			    for (let colIndex = 0; colIndex < colCount; colIndex++) {
			        const dropdown = headerCells[colIndex]?.querySelector("select");
			        if (!dropdown) continue;
			
			        const previouslySelected = new Set(Array.from(dropdown.selectedOptions, o => o.value));
			        const isFilterActive = previouslySelected.size > 0 && !previouslySelected.has("select-all");
			        
			        if (isFilterActive && dropdown !== activeDropdown) {
			            continue; 
			        }
			
			        let optionsToShow = new Set();

			        for (const row of allRows) {
			            if (rowMatchesFilters(row, colIndex)) {
			                TableManager.#extractValuesFromCell(row.children[colIndex], optionsToShow);
			            }
			        }

			        
			        const fragment = document.createDocumentFragment();
			        const selectAllOpt = dropdown.querySelector('option[value="select-all"]');
			        
			        if (selectAllOpt) {
			            selectAllOpt.selected = !isFilterActive;
			            fragment.appendChild(selectAllOpt);
			        }
			
			        if (optionsToShow.has("empty")) {
			            const opt = document.createElement("option");
			            opt.value = "empty";
			            opt.textContent = this.tr[this.lang].filter_empty;
			            if (previouslySelected.has("empty")) opt.selected = true;
			            fragment.appendChild(opt);
			        }
			
			        const sortedValues = Array.from(optionsToShow).filter(v => v !== "empty").sort(textCollator.compare);
			        for (const val of sortedValues) {
			            const opt = document.createElement("option");
			            opt.value = val;
			            opt.textContent = val;
			            if (previouslySelected.has(val)) opt.selected = true;
			            fragment.appendChild(opt);
			        }
			
			        dropdown.replaceChildren(fragment);
			    }
			}
			
						
			
			getHtmlForExport(asTable = true) {
			    const outputEl = this.els.output;
			    if (!outputEl?.innerHTML.trim()) {
			        return null;
			    }
			    const zoneFirstColor =
			        getComputedStyle(document.documentElement).getPropertyValue("--zone-first-color").trim() ||
			        "red";
			    const zoneSecondColor =
			        getComputedStyle(document.documentElement).getPropertyValue("--zone-second-color").trim() ||
			        "blue";
			    const txtAll = this.tr[this.lang]["filter_all"] || "(alle)";
			    const txtEmpty = this.tr[this.lang]["filter_empty"] || "(leer)";
			    const scriptTagStart = "<scr" + "ipt>";
			    const scriptTagEnd = "</scr" + "ipt>";
			
			    const htmlHeaderStart = [
			        `<!DOCTYPE html>`,
			        `<html lang="${this.lang}">`,
			        `<head>`,
			        `    <meta charset="UTF-8" />`,
			        `    <meta name="viewport" content="width=device-width, initial-scale=1.0" />`,
			        `    <title>exceldiff</title>`,
			        `    <link rel="icon" href="data:," />`,
			        `    <style>`,
			        `        :root {`,
			        `            --zone-first-color: ${zoneFirstColor};`,
			        `            --zone-second-color: ${zoneSecondColor};`,
			        `            --color-first-action: #0056b3;`,
			        `            --border-color: #d9d9d9;`,
			        `            --text-color: #2c3e50;`,
			        `            accent-color: var(--color-first-action);`,
			        `        }`,
			        `        body { font-family: Arial, sans-serif; margin: 20px; color: var(--text-color); font-size: 12px; word-break: break-all; }`,
			        `        .filter-active { border: 2px solid var(--color-first-action) !important; border-radius: 4px !important; }`,
			        `        .highlight-first { font-weight: normal; color: var(--zone-first-color); }`,
			        `        .highlight-second { font-weight: normal; color: var(--zone-second-color); }`,
			        `        .primary-underlined { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; display: inline-block; padding-bottom: 2px; }`,
			    ].join("\n");
			
			
			
			    if (!asTable) {
			        const outputClone = outputEl.cloneNode(true);
			        outputClone.querySelectorAll("script").forEach((s) => s.remove());
			        outputClone.querySelectorAll(".search-highlight").forEach((span) => {
			            span.replaceWith(document.createTextNode(span.textContent));
			        });
			        return [
			            htmlHeaderStart,
			            `    </style>`,
			            `</head>`,
			            `<body>`,
			            outputClone.innerHTML.trim(),
			            `</body>`,
			            `</html>`,
			        ].join("\n");
			    }
			
			    const tableElement = outputEl.querySelector("table");
			    if (!tableElement) return null;
			
			    const table = tableElement.cloneNode(true);
			    table.querySelectorAll("tbody tr[style*='display: none']").forEach((row) => row.remove());
			    
                table.querySelectorAll("thead th").forEach(th => {
                    const sortTrigger = th.querySelector(".sort-trigger");
                    if (sortTrigger) {
                        th.innerHTML = `<span class="sort-trigger">${sortTrigger.innerHTML}</span>`;
                    }
                });
			
			    const filterRow = table.querySelector("thead tr.table-filter-row");
			    if (filterRow) {
			        const tbody = table.querySelector("tbody");
			        const rows = tbody ? Array.from(tbody.querySelectorAll("tr")) : [];
			
			        filterRow.querySelectorAll("td").forEach((td, index) => {
			            const uniqueValues = new Set();
			            rows.forEach((row) => {
			                const cell = row.children[index];
			                if (cell) {
			                    const text = cell.textContent.trim();
			                    uniqueValues.add(text !== "" ? text : txtEmpty);
			                }
			            });
			
			            const sortedValues = Array.from(uniqueValues).sort((a, b) => {
			                if (a === txtEmpty) return 1;
			                if (b === txtEmpty) return -1;
			                const numA = parseFloat(a.replace(",", "."));
			                const numB = parseFloat(b.replace(",", "."));
			                return !isNaN(numA) && !isNaN(numB)
			                    ? numA - numB
			                    : a.localeCompare(b, "de", { sensitivity: "base", numeric: true });
			            });
			
			            const optionsHtml = [`<option value="select-all">${txtAll}</option>`]
			                .concat(sortedValues.map((val) => `<option value="${val}">${val}</option>`))
			                .join("");
			
			            td.innerHTML = `<select multiple data-col-index="${index}" class="table-filter-dropdown">${optionsHtml}</select>`;
			        });
			    }
			
			    table.querySelectorAll("td, th").forEach((cell) => {
			        cell.querySelectorAll("script").forEach((s) => s.remove());
			        for (let i = cell.attributes.length - 1; i >= 0; i--) {
			            const attrName = cell.attributes[i].name;
			            if (attrName.startsWith("on")) cell.removeAttribute(attrName);
			        }
			    });
			
			
			    const interactiveScript = `
			        const TXT_ALL = ${JSON.stringify(txtAll)};
			        const TXT_EMPTY = ${JSON.stringify(txtEmpty)};
			        const textCollator = new Intl.Collator('de', { sensitivity: 'base', numeric: true });
			
			
			        function exporthandleRowHighlighting(row) {
			            row.style.backgroundColor = (row.style.backgroundColor === "yellow") ? "" : "yellow";
			        }
			
					function exporthandleColumnHighlighting(header, table) {
					    const columnIndex = header.cellIndex;
					    const isAlreadyHighlighted = header.classList.contains("highlighted-column");
					
					    const action = isAlreadyHighlighted ? "remove" : "add";
					
			
					    header.classList[action]("highlighted-column");
			
					    const filterRow = table.querySelector("thead tr.table-filter-row");
					    if (filterRow && filterRow.cells[columnIndex]) {
					        filterRow.cells[columnIndex].classList[action]("highlighted-column");
					    }
					
					    const tbody = table.tBodies[0];
					    if (tbody) {
					        for (let i = 0; i < tbody.rows.length; i++) {
					            const cell = tbody.rows[i].cells[columnIndex];
					            if (cell) {
					                cell.classList[action]("highlighted-column");
					            }
					        }
					    }
					}
			
			
			        function exporthandleColumnSorting(header, table) {
			            const tbody = table.querySelector("tbody");
			            if (!tbody) return;
			            const columnIndex = Array.from(header.parentNode.children).indexOf(header);
			            const rows = Array.from(tbody.querySelectorAll("tr"));
			            let currentSort = header.dataset.sort || "none";
			            let nextSort = currentSort === "asc" ? "desc" : "asc";
			            
			            document.querySelectorAll("th").forEach(th => {
			                if (th !== header) {
			                    th.dataset.sort = "none";
			                    const otherIcon = th.querySelector(".sort-icon");
			                    if(otherIcon) otherIcon.remove();
			                }
			            });
			            header.dataset.sort = nextSort;
			            
			            let sortIcon = header.querySelector(".sort-icon");
			            if (!sortIcon) {
			                sortIcon = document.createElement("span");
			                sortIcon.className = "sort-icon";
			                header.querySelector(".sort-trigger").appendChild(sortIcon);
			            }
			            sortIcon.innerHTML = nextSort === 'asc' 
			                ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 1em; height: 1em; display: inline-block; vertical-align: middle; margin-left: 4px;"><polyline points="18 15 12 9 6 15"></polyline></svg>' 
			                : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 1em; height: 1em; display: inline-block; vertical-align: middle; margin-left: 4px;"><polyline points="6 9 12 15 18 9"></polyline></svg>';
			            
			            const headerIsInFile1 = header.innerHTML.includes("highlight-first");
			            const headerIsInFile2 = header.innerHTML.includes("highlight-second");
			            const isNonSharedColumn = headerIsInFile1 || headerIsInFile2;
			            
			            rows.sort((a, b) => {
			                const cellA = a.children[columnIndex];
			                const cellB = b.children[columnIndex];
			                let valA = (isNonSharedColumn && cellA) 
			                    ? (cellA.querySelector(headerIsInFile1 ? ".highlight-first" : ".highlight-second")?.textContent.trim() ?? "")
			                    : (cellA?.textContent.trim() ?? "");
			                let valB = (isNonSharedColumn && cellB) 
			                    ? (cellB.querySelector(headerIsInFile1 ? ".highlight-first" : ".highlight-second")?.textContent.trim() ?? "")
			                    : (cellB?.textContent.trim() ?? "");
			                
			                const numA = parseFloat(valA.replace(/\\./g, '').replace(',', '.'));
			                const numB = parseFloat(valB.replace(/\\./g, '').replace(',', '.'));
			                
			                if (!isNaN(numA) && !isNaN(numB)) {
			                    return nextSort === "asc" ? numA - numB : numB - numA;
			                }
			                return nextSort === "asc" 
			                    ? textCollator.compare(valA, valB)
			                    : textCollator.compare(valB, valA);
			            });
			            
			            rows.forEach(row => tbody.appendChild(row));
			        }
			
			        function exportextractValuesFromCell(cell, valuesSet) {
			            if (!cell || !valuesSet) return;
			            const firstEl = cell.querySelector(".highlight-first");
			            const secondEl = cell.querySelector(".highlight-second");
			            if (firstEl || secondEl) {
			                const oldVal = (firstEl?.textContent ?? "").trim();
			                const newVal = (secondEl?.textContent ?? "").trim();
			                if (oldVal) valuesSet.add(oldVal);
			                if (newVal) valuesSet.add(newVal);
			                if (!oldVal && !newVal) valuesSet.add("empty");
			            } else {
			                const val = cell.textContent.trim();
			                valuesSet.add(val || "empty");
			            }
			        }
			
			        function exportdoesCellMatchFilter(cell, selectedValues) {
			            const oldVal = cell.querySelector(".highlight-first")?.textContent.trim() ?? "";
			            const newVal = cell.querySelector(".highlight-second")?.textContent.trim() ?? "";
			            if (oldVal || newVal) {
			                const hasEmptyMatch = selectedValues.has("empty") && (!oldVal || !newVal);
			                return hasEmptyMatch || selectedValues.has(oldVal) || selectedValues.has(newVal);
			            }
			            const cellText = cell.textContent.trim();
			            return selectedValues.has(cellText || "empty");
			        }
			        
			        function exportupdateColumnDropdowns(table, activeDropdown) {
			            const headerCells = Array.from(table.tHead.querySelectorAll("tr:nth-child(2) td"));
			            const allRows = Array.from(table.tBodies[0].rows);
			            
			            const activeFilters = headerCells.map((td, index) => {
			                const s = td.querySelector("select");
			                if (!s) return null;
			                const v = new Set(Array.from(s.selectedOptions, o => o.value));
			                if (v.size > 0 && !v.has(TXT_ALL) && !v.has("select-all")) return { colIndex: index, selectedValues: v };
			                return null;
			            }).filter(Boolean);
			
			            for (let i = 0; i < headerCells.length; i++) {
			                const dropdown = headerCells[i].querySelector("select");
			                if (!dropdown) continue;
			
			                const previouslySelected = new Set(Array.from(dropdown.selectedOptions, o => o.value));
			                const isFilterActive = previouslySelected.size > 0 && !previouslySelected.has(TXT_ALL) && !previouslySelected.has("select-all");
			                
			                let optionsToShow = new Set();
			                if (isFilterActive && dropdown !== activeDropdown) {
			                    previouslySelected.forEach(val => optionsToShow.add(val));
			                } else {
			                    const otherFilters = activeFilters.filter(f => f.colIndex !== i);
			                    for (const row of allRows) {
			                        let matches = true;
			                        for (const filter of otherFilters) {
			                            if (!exportdoesCellMatchFilter(row.children[filter.colIndex], filter.selectedValues)) {
			                                matches = false;
			                                break;
			                            }
			                        }
			                        if (matches) exportextractValuesFromCell(row.children[i], optionsToShow);
			                    }
			                }
			
			                const fragment = document.createDocumentFragment();
			                const selectAllOpt = document.createElement('option');
			                selectAllOpt.value = "select-all";
			                selectAllOpt.textContent = TXT_ALL;
			                if (!isFilterActive) selectAllOpt.selected = true;
			                fragment.appendChild(selectAllOpt);
			                
			                if (optionsToShow.has("empty")) {
			                    const opt = document.createElement("option");
			                    opt.value = "empty";
			                    opt.textContent = TXT_EMPTY;
			                    if (previouslySelected.has("empty")) opt.selected = true;
			                    fragment.appendChild(opt);
			                }
			
			                const sortedValues = Array.from(optionsToShow).filter(v => v !== "empty").sort(textCollator.compare);
			                for (const val of sortedValues) {
			                    const opt = document.createElement("option");
			                    opt.value = val;
			                    opt.textContent = val;
			                    if (previouslySelected.has(val)) opt.selected = true;
			                    fragment.appendChild(opt);
			                }
			                dropdown.replaceChildren(fragment);
			            }
			        }
			
			        function exportfilterTable(table, activeDropdown) {
			            const headerCells = Array.from(table.tHead.querySelectorAll("tr:nth-child(2) td"));
			            const rows = Array.from(table.tBodies[0].rows);
			
			            const activeFilters = headerCells.map((td, index) => {
			                const s = td.querySelector("select");
			                if (!s) return null;
			                const v = new Set(Array.from(s.selectedOptions, o => o.value));
			                const isActive = v.size > 0 && !v.has(TXT_ALL) && !v.has("select-all");
			                s.classList.toggle("filter-active", isActive);
			                if (isActive) return { colIndex: index, selectedValues: v };
			                return null;
			            }).filter(Boolean);
			
			            rows.forEach(row => {
			                let isVisible = true;
			                for (const filter of activeFilters) {
			                    if (!exportdoesCellMatchFilter(row.children[filter.colIndex], filter.selectedValues)) {
			                        isVisible = false;
			                        break;
			                    }
			                }
			                row.style.display = isVisible ? "" : "none";
			            });
			            
			            exportupdateColumnDropdowns(table, activeDropdown);
			        }
			
			        document.addEventListener('DOMContentLoaded', function() {
			            const table = document.querySelector("table");
			            if (!table) return;
			
			            table.tHead.addEventListener("click", e => {
			                if (e.target.tagName === "SELECT" || e.target.tagName === "OPTION") return;
			                const th = e.target.closest("th");
			                if (!th) return;
			
			                if (e.target.closest(".sort-trigger")) {
			                    exporthandleColumnSorting(th, table);
			                } else {
			                    exporthandleColumnHighlighting(th, table);
			                }
			            });
			
			            table.tHead.addEventListener("change", e => {
			                if (e.target.tagName === "SELECT") {
			                    const select = e.target;
			                    const allOptValue = "select-all";
			                    const allOpt = select.querySelector('option[value="' + allOptValue + '"]');
			                    if(select.value === allOptValue) {
			                        Array.from(select.options).forEach(o => o.selected = (o.value === allOptValue));
			                    } else {
			                        if (allOpt) allOpt.selected = false;
			                    }
			                    if (Array.from(select.selectedOptions).length === 0 && allOpt) allOpt.selected = true;
			
			                    exportfilterTable(table, select);
			                }
			            });
			
			            if (table.tBodies[0]) {
			                table.tBodies[0].addEventListener("click", (event) => {
			                    const tr = event.target.closest("tr");
			                    if (tr) exporthandleRowHighlighting(tr);
			                });
			            }
			        });
			    `;
			
			
			    return [
			        htmlHeaderStart,
			        `        table { border-collapse: collapse; width: 100%; }`,
			        `        th, td { border: 1px solid var(--border-color); padding: 6px; text-align: left; min-width: 110px; max-width: 200px; word-wrap: break-word; white-space: normal; }`,
			        `        th { word-break: normal; overflow-wrap: normal; background-color: #f2f2f2; text-align: center; cursor: pointer; }`,
			        `        .sort-trigger { display: inline-flex; align-items: center; justify-content: center; gap: 4px; }`,
			        `        .highlighted-column { background-color: yellow !important; }`,
			        `        td { word-break: break-word; }`,
			        `        tr.table-filter-row td { padding: 4px; }`,
			        `        select { width: 100%; box-sizing: border-box; padding: 4px; font-size: 12px; border: 1px solid var(--border-color); background: #fff; min-height: 50px; max-height: 100px; }`,
			        `        select:focus { outline: none; border-color: var(--color-first-action); }`,
			        `        tr.table-filter-row select.table-filter-dropdown option:checked:not([value="select-all"]) {`,
			        `            background-color: var(--color-first-action) !important;`,
			        `            background-image: linear-gradient(0deg, var(--color-first-action) 0%, var(--color-first-action) 100%) !important;`,
			        `            color: #ffffff !important;`,
			        `        }`,
			        `        tr.table-filter-row select.table-filter-dropdown option[value="select-all"]:checked {`,
			        `            background-color: transparent !important;`,
			        `            background-image: none !important;`,
			        `            color: #222 !important;`,
			        `        }`,
			        `    </style>`,
			        `</head>`,
			        `<body>`,
			        table.outerHTML,
			        scriptTagStart,
			        interactiveScript,
			        scriptTagEnd,
			        `</body>`,
			        `</html>`,
			    ].join("\n");
			
			}

            }

            class View {
                constructor(lang, tr, handlers = {}) {
                    this.lang = lang;
                    this.tr = tr;
                    this.els = {};

                    this.#getElements();

                    Object.freeze(this.els);
                    this.#updateTranslations();

                }


                clearWarnings() {
                    this.els.warnings.replaceChildren();
                    this.els.warnings.style.display = "none";
                }

                showWarning(context, messageKey, details = "") {
                    const colorClass = context === "file1" ? "highlight-first" : "highlight-second";
                    const message = this.tr[this.lang][messageKey] ?? messageKey;
                    const fullMessage = `${message} ${details}`.trim();

                    if (this.els.warnings.hasChildNodes()) {
                        this.els.warnings.append(document.createElement("br"));
                    }

                    const span = document.createElement("span");
                    span.className = colorClass;
                    span.textContent = fullMessage;

                    this.els.warnings.append(span);
                    this.els.warnings.style.display = "block";
                }

                displayCheckboxes(headers, targetContainer, namePrefix) {
                    if (!targetContainer) return;

                    targetContainer.style.display = "flex";
                    targetContainer.style.flexWrap = "wrap";
                    targetContainer.style.rowGap = "4px";
                    targetContainer.style.columnGap = "10px";

                    const isCheckedDefault = targetContainer !== this.els.checkboxes;
                    const fragment = document.createDocumentFragment();
                    const headersLen = headers.length;

                    for (let index = 0; index < headersLen; index++) {
                        const headerText = (headers[index] ?? "").trim();
                        if (!headerText) continue;

                        const wrapper = document.createElement("div");
                        wrapper.className = "checkbox-item";
                        wrapper.style.display = "inline-flex";
                        wrapper.style.alignItems = "center";
                        wrapper.style.gap = "4px";

                        const checkbox = document.createElement("input");
                        checkbox.type = "checkbox";
                        checkbox.id = `${namePrefix}-${index}`;
                        checkbox.value = index;
                        checkbox.checked = isCheckedDefault;

                        const label = document.createElement("label");
                        label.htmlFor = checkbox.id;
                        label.textContent = headerText;

                        wrapper.append(checkbox, label);
                        fragment.appendChild(wrapper);
                    }

                    if (namePrefix === "file1-col" || namePrefix === "file2-col") {
                        const toggleCheckbox = document.createElement("input");
                        toggleCheckbox.type = "checkbox";
                        toggleCheckbox.id = `toggle-all-${namePrefix}`;
                        toggleCheckbox.checked = true;

                        const toggleLabel = document.createElement("label");
                        toggleLabel.htmlFor = toggleCheckbox.id;
                        toggleLabel.style.fontWeight = "normal";
                        toggleLabel.append("(", toggleCheckbox, ")");

                        const toggleDiv = document.createElement("div");
                        toggleDiv.className = "checkbox-item toggle-all-container";
                        toggleDiv.style.display = "inline-flex";
                        toggleDiv.style.alignItems = "center";
                        toggleDiv.style.gap = "2px";
                        toggleDiv.style.marginLeft = "12px";
                        toggleDiv.append(toggleLabel);

                        fragment.appendChild(toggleDiv);
                    }

                    targetContainer.replaceChildren(fragment);
                }

                #getElements() {
                    this.els.body = document.body;
                    this.els.mainContainer = document.querySelector(".main-container") || document.body;
                    this.els.output = document.getElementById("output");
                    this.els.warnings = document.getElementById("warnings");
                    this.els.file1 = document.getElementById("file1");
                    this.els.file2 = document.getElementById("file2");
                    this.els.file1Name = document.getElementById("file1-name");
                    this.els.file2Name = document.getElementById("file2-name");
                    this.els.dropZone1 = document.getElementById("drop-zone-1");
                    this.els.dropZone2 = document.getElementById("drop-zone-2");
                    this.els.encoding = document.getElementById("encoding");
                    this.els.encodingToggle = document.getElementById("encoding-toggle");
                    this.els.file1CheckboxSection = document.getElementById("file1-checkbox-section");
                    this.els.file2CheckboxSection = document.getElementById("file2-checkbox-section");
                    this.els.onlyDifferences = document.getElementById("only-differences");
                    this.els.onlyDifferencesContainer = document.getElementById("only-differences-container");
                    this.els.hideIdenticalColumns = document.getElementById("hide-identical-columns");
                    this.els.hideIdenticalColumnsContainer = document.getElementById("hide-identical-columns-container");
                    this.els.includeEmptyLines = document.getElementById("include-empty-lines");
                    this.els.replaceDelimiterWithSpace = document.getElementById("replace-delimiter-with-space");
                    this.els.asTable = document.getElementById("as-table");
                    this.els.activateFilter = document.getElementById("activate-filter");
                    this.els.outputOptionsContainer = document.getElementById("output-options-container");
                    this.els.keyColumnContainer = document.getElementById("key-column-container");
                    this.els.asTableContainer = document.getElementById("as-table-container");
                    this.els.replaceDelimiterContainer = document.getElementById("replace-delimiter-container");
                    this.els.checkboxes = document.getElementById("checkboxes");
                    this.els.checkboxesFile1 = document.getElementById("checkboxes-file1");
                    this.els.checkboxesFile2 = document.getElementById("checkboxes-file2");
                    this.els.i18n = {};
                    Object.keys(this.tr[this.lang]).forEach(
                        (key) => (this.els.i18n[key] = document.getElementById(key))
                    );
                }


                reset(isSoftReset = false) {
                    if (!isSoftReset) {
                        this.els.file1.value = "";
                        this.els.file2.value = "";
                        this.els.file1Name.textContent = this.tr[this.lang].no_file_selected;

                    }

                    });
                    if (this.els.globalSearch) {
                        this.els.globalSearch.placeholder = this.tr[this.lang]["search_placeholder"];
                    }
                }
            }


            document.addEventListener("DOMContentLoaded", () => {
                new App();
            });
