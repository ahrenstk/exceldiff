<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>exceldiff</title>
        <link rel="icon" href="data:," />

        <style>
			:root {
			    --zone-first-color: #e02424;
			    --zone-second-color: #1a56db;
			    --color-first-action: #0056b3;
			    --color-second-action: #198754;
			    --button-text-color: #ffffff;
			    --border-color: #d9d9d9;
			    --text-color: #2c3e50;
			    --drop-zone-bg-color: #fcfcfc; 
			    --drop-zone-drag-border-color: #4b5563;
			    --drop-zone-drag-bg-color: #f3f4f6;
			    --search-highlight-color: #ffd700;
			    accent-color: var(--color-first-action);
			}
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 10px 20px 80px 20px;
                background-color: #fff;
                color: var(--text-color);
                opacity: 0;
                transition: opacity 0.15s ease-in;
            }
            body.is-ready {
                opacity: 1;
            }
            h3 {
                font-size: 18px;
                margin-bottom: 5px;
                color: #555;
            }
            p {
                margin: 5px 0;
                font-size: 14px;
            }
            button,
            input,
            select,
            textarea {
                font-family: inherit;
                font-size: inherit;
            }
            .hidden {
                display: none !important;
            }
			.main-container {
			    background-color: #fff;
			    padding: 5px 15px 15px 15px;
			}
			.main-container h1 {
			    font-size: 22px;
			    margin-top: 0;
			    margin-bottom: 12px;
			    color: var(--text-color);
			    text-align: center;
			}
            .file-upload-group {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 15px 0 15px 0;
                max-width: 740px;
                width: 100%;
            }
		    .file-drop-zone {
		        flex: 1;
		        border: 2px dashed var(--border-color);
		        border-radius: 6px;
		        padding: 4px 8px;
		        text-align: center;
		        background-color: var(--drop-zone-bg-color);
		        cursor: pointer;
		        transition:
		            background-color 0.15s,
		            border-color 0.15s;
		        display: flex;
		        flex-direction: column;
		        align-items: center;
		        justify-content: center;
		        min-height: 36px;
		        box-sizing: border-box;
		    }
		    .file-drop-zone:hover,
        		.file-drop-zone.drag-over {
		        border-color: var(--drop-zone-drag-border-color);
		        background-color: var(--drop-zone-drag-bg-color);
    		}
	    	.file-drop-zone.zone-first {
		        border-color: var(--zone-first-color);
		    }
		    .file-drop-zone.zone-second {
		        border-color: var(--zone-second-color);
		    }
            .drop-instruction {
                font-size: 11px;
                color: var(--text-color);
                margin: 0;
                line-height: 1.2;
            }
            .file-name {
                font-size: 11px;
                color: #555;
                font-style: italic;
                margin-top: 2px;
                word-break: break-all;
                line-height: 1.2;
            }
            .file-name:empty {
                display: none;
            }
            .switch-container {
                display: inline-block;
                position: relative;
                user-select: none;
                flex: 0 0 auto;
            }
            .switch-checkbox {
                display: none;
            }
            .switch-label {
                display: flex;
                align-items: center;
                justify-content: space-between;
                cursor: pointer;
                width: 160px;
                height: 28px;
                background-color: #f0f0f0;
                border: 1px solid var(--border-color);
                border-radius: 14px;
                position: relative;
                padding: 0;
                transition: background-color 0.2s;
            }
            .switch-text {
                font-size: 11px;
                font-weight: normal;
                z-index: 2;
                width: 50%;
                text-align: center;
                color: #555;
                transition: color 0.2s;
            }
            .switch-button {
                position: absolute;
                top: 2px;
                left: 2px;
                width: 76px;
                height: 24px;
                background-color: var(--color-first-action);
                border-radius: 12px;
                transition: transform 0.2s ease-in-out;
                z-index: 1;
            }
            .switch-checkbox:checked + .switch-label .switch-button {
                transform: translateX(80px);
            }
            .switch-checkbox:not(:checked) + .switch-label .switch-text-left,
            .switch-checkbox:checked + .switch-label .switch-text-right {
                color: #fff;
            }
            .switch-checkbox:disabled + .switch-label {
                background-color: #e0e0e0;
                border-color: var(--border-color);
                cursor: not-allowed;
                opacity: 0.6;
            }
            .switch-checkbox:disabled + .switch-label .switch-button {
                background-color: #999;
            }
            .button-container {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
                margin-top: 20px;
            }
            button {
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                text-align: center;
                flex: 0 0 auto;
            }
            .button-green {
                background-color: var(--color-second-action);
                color: var(--button-text-color);
            }
            .button-blue {
                background-color: var(--color-first-action);
                color: var(--button-text-color);
            }
            .bottom-container {
                min-width: max-content;
                background-color: #fff;
                padding: 0 15px 15px 15px;
            }
            #scroll-to-top-btn {
                background: none;
                border: none;
                padding: 0;
                font-weight: 900;
                font-size: 20px;
                color: #888;
                cursor: pointer;
                margin-left: 10px;
                transition: color 0.15s;
            }
            #scroll-to-top-btn:hover {
                color: var(--color-first-action);
            }
            .output-options {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                gap: 16px;
                margin: 10px 0;
                width: 100%;
            }
            .option-item {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                white-space: nowrap;
            }
            input[type="checkbox"] {
                cursor: pointer;
            }
            .option-item input[type="checkbox"] {
                margin: 0;
                cursor: pointer;
            }
            .option-item label {
                cursor: pointer;
                user-select: none;
            }
            .options-wrapper {
                min-height: 30px;
            }
            .status-filter-checkbox {
                width: 14px;
                height: 14px;
                outline: 1.5px solid #666;
                outline-offset: -1px;
                border-radius: 2px;
            }
            .status-filter-checkbox:disabled {
                outline: 1.5px solid #999;
                background-color: #eee;
                filter: none;
            }
			table {
			    border-collapse: separate;
			    border-spacing: 0; 
			    width: 100%;
			}

            .custom-table thead {
                position: sticky;
                top: 50px;
                z-index: 99;
                background-color: #fff;
            }
            .custom-table th {
                cursor: pointer;
                background-color: #f2f2f2;
            }
            .custom-table tr.table-filter-row td {
                padding: 2px;
                background-color: #f9f9f9;
            }
            .output {
                margin-top: 0px;
                padding: 5px 0px 10px 0px;
                border-radius: 4px;
                background-color: #fff;
            }
            .output table {
                display: inline-table;
                vertical-align: top;
            }
            .custom-table {
                margin-right: 50px;
            }
            th,
            td {
                border: 1px solid var(--border-color);
                padding: 6px;
                text-align: left;
                min-width: 110px;
                max-width: 200px;
                word-wrap: break-word;
                white-space: normal;
                background-clip: padding-box;
            }

            th {
                background-color: #f2f2f2;
                text-align: center;
            }
            th > div {
                position: relative;
                display: inline-block; 
                padding-right: 20px,
                box-sizing: border-box;
            }
            .col-move-btn {
                font-weight: 900;
                font-size: 19px;
                color: #888;
                cursor: pointer;
                line-height: 1;
                user-select: none;
            }
            #reset-col-order-btn {
                background: none;
                border: none;
                padding: 0;
                font-weight: normal;
                font-size: 14px;
                color: #999;
                cursor: pointer;
            }
            .col-move-btn.disabled {
                visibility: hidden;
            }
            .sort-trigger {
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            .sort-icon {
                line-height: 1;
            }
            .column-hidden {
                opacity: 0.6;
            }
            .header-content-wrapper {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                position: relative;
            }
            .custom-table .table-filter-dropdown {
                margin-top: 5px;
                width: 100%;
                font-size: 12px;
                box-sizing: border-box;
                overscroll-behavior: contain; /* Verhindert, dass die Hintergrundseite scrollt, wenn das Menü-Ende erreicht wird */
            }
            select option {
                color: black;
                background-color: white;
            }
            select:focus {
                background-color: white;
                color: black;
                outline: none;
                border-color: #0066cc;
            }
            .filter-active {
                border: 2px solid var(--color-first-action) !important;
                border-radius: 4px !important;
            }
            tr.table-filter-row select.table-filter-dropdown:focus {
                outline: none;
                border-color: var(--color-first-action);
                box-shadow: 0 0 5px rgba(0, 86, 179, 0.4);
            }
            .highlighted-column {
                background-color: yellow !important;
            }
            .search-input {
                width: 100%;
                padding: 8px 30px 8px 12px;
                box-sizing: border-box;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 13px;
                transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
            }
            .search-input:focus {
                outline: none;
                border-color: var(--color-first-action);
                box-shadow: 0 0 5px rgba(0, 86, 179, 0.4);
            }
            .search-wrapper {
                position: relative;
                display: inline-block;
                width: 350px;
                max-width: 100%;
            }
            .search-clear-btn {
                position: absolute;
                right: 8px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                font-family: Arial, sans-serif;
                font-size: 16px;
                line-height: 1;
                color: #888;
                user-select: none;
                display: none;
            }
            .search-clear-btn:hover {
                color: #000;
            }
            .search-highlight {
                background-color: var(--search-highlight-color);
            }
            .search-status-wrapper {
                position: sticky;
                top: 0;
                background-color: #ffffff;
                z-index: 101;
                padding: 8px 0;
                margin-bottom: 0;
                display: flex;
                justify-content: flex-start;
                align-items: center;
                flex-wrap: wrap;
                gap: 20px;
                height: 50px;
                box-sizing: border-box;
                width: 100%;
            }
            #output {
                font-size: 12px;
                background: none;
            }
            .text-header {
                position: sticky;
                top: 49px;
                z-index: 99;
                background-color: #ffffff;
                font-weight: bold;
                padding: 6px 0;
                border-bottom: 2px solid var(--border-color);
                margin-bottom: 8px;
                display: block;
            }
            #status,
            #warnings {
                font-size: 13px;
                font-weight: normal;
                margin-bottom: 10px;
                color: #555;
            }
            .highlight-first {
                color: var(--zone-first-color);
            }
            .highlight-second {
                color: var(--zone-second-color);
            }
            .primary-underlined {
                text-decoration: underline;
                text-decoration-thickness: 2px;
                text-underline-offset: 4px;
                display: inline-block;
                padding-bottom: 2px;
            }
            #key_columns_label,
            #file1_column,
            #file2_column,
            .checkbox-container label,
            .output-options label,
            .search-input,
            .button-container button {
                font-size: 14px !important;
            }
            .disclaimer {
                font-size: 14px;
                color: gray;
                text-align: center;
                margin-top: -10px;
                display: block;
            }

        </style>
    </head>
    
	<body>
	    <div class="main-container">
	        <h1>exceldiff - <span id="title_long"></span></h1>
	        <p class="disclaimer">
	            <em id="disclaimer"></em>
	        </p>
	
	        <div class="file-upload-group">
	            <div id="drop-zone-1" class="file-drop-zone zone-first">
	                <input type="file" id="file1" accept=".xlsx, .ods, .csv, .txt" style="display: none" />
	                <p class="drop-instruction">
	                    <strong><span id="file1_label"></span></strong>
	                    <br />
	                </p>
	                <span id="file1-name" class="file-name"></span>
	            </div>
	
	            <div id="drop-zone-2" class="file-drop-zone zone-second">
	                <input type="file" id="file2" accept=".xlsx, .ods, .csv, .txt" style="display: none" />
	                <p class="drop-instruction">
	                    <strong><span id="file2_label"></span></strong>
	                    <br />
	                </p>
	                <span id="file2-name" class="file-name"></span>
	            </div>
	
	            <div class="switch-container">
	                <input type="checkbox" id="encoding-toggle" class="switch-checkbox" />
	                <label for="encoding-toggle" class="switch-label">
	                    <span class="switch-text switch-text-left">UTF-8</span>
	                    <span class="switch-button"></span>
	                    <span class="switch-text switch-text-right">ANSI</span>
	                </label>
	            </div>
	            <input type="hidden" id="encoding" value="UTF-8" />
	        </div>
	
	        <div class="options-wrapper">
	            <div
	                id="key-column-container"
	                class="checkbox-container hidden"
	                style="display: flex; flex-direction: column; gap: 8px">
	                <div id="key-section" style="display: inline-flex; align-items: flex-start; gap: 10px; width: 100%">
	                    <h3 id="key_columns_label" style="margin: 0; white-space: nowrap; line-height: 1.4"></h3>
	                    <div id="checkboxes"></div>
	                </div>
	
	                <div
	                    id="file1-checkbox-section"
	                    class="hidden"
	                    style="display: inline-flex; align-items: flex-start; gap: 10px; width: 100%">
	                    <strong id="file1_column" style="white-space: nowrap; line-height: 1.4"></strong>
	                    <div id="checkboxes-file1"></div>
	                </div>
	
	                <div
	                    id="file2-checkbox-section"
	                    class="hidden"
	                    style="display: inline-flex; align-items: flex-start; gap: 10px; width: 100%">
	                    <strong id="file2_column" style="white-space: nowrap; line-height: 1.4"></strong>
	                    <div id="checkboxes-file2"></div>
	                </div>
	            </div>
	
	            <div
	                id="output-options-container"
	                class="output-options hidden"
	                style="display: inline-flex; align-items: flex-start; gap: 10px; width: 100%">
	                <strong id="options_label" style="white-space: nowrap; line-height: 1.4"></strong>
	                <div style="display: flex; flex-wrap: wrap; gap: 8px 12px">
	                    <div id="as-table-container" class="hidden">
	                        <input type="checkbox" id="as-table" checked />
	                        <label for="as-table" id="show_as_table"></label>
	                    </div>
	
	                    <div>
	                        <input type="checkbox" id="activate-filter" checked />
	                        <label for="activate-filter" id="activate_filter"></label>
	                    </div>
	
	                    <div id="only-differences-container">
	                        <input type="checkbox" id="only-differences" />
	                        <label for="only-differences" id="show_differences_only"></label>
	                    </div>
	
	                    <div id="hide-identical-columns-container">
	                        <input type="checkbox" id="hide-identical-columns" disabled />
	                        <label for="hide-identical-columns" id="hide_identical_columns"></label>
	                    </div>
	
	                    <div id="replace-delimiter-container" class="hidden">
	                        <input type="checkbox" id="replace-delimiter-with-space" />
	                        <label for="replace-delimiter-with-space" id="replace_delimiter_with_space"></label>
	                    </div>
	
	                    <div>
	                        <input type="checkbox" id="include-empty-lines" />
	                        <label for="include-empty-lines" id="add_blank_lines"></label>
	                    </div>
	                </div>
	            </div>
	

	            <div class="button-container">
	                <button id="compare_files" class="button-green" data-action="compare"></button>
	                <button id="save_as_html" class="button-blue" data-action="export-html"></button>
	                <button id="save_as_csv" class="button-blue" data-action="export-csv"></button>
	                <button id="show_file1" class="button-green" data-action="show-file1"></button>
	                <button id="show_file2" class="button-green" data-action="show-file2"></button>
	                <button id="consolidate_duplicates" class="button-green" data-action="remove-duplicates"></button>
	                <button id="reset" class="button-blue" data-action="reset"></button>
	            </div>

	            <br />
	            <div id="warnings" style="margin-bottom: 20px"></div>
	        </div>
	    </div>
	        <div class="bottom-container">
	            <div class="search-status-wrapper">
	                <div id="search-container" class="hidden" style="margin-bottom: 5px">
	                    <div class="search-wrapper">
	                        <input type="text" id="search_placeholder" class="search-input" placeholder="" />
	                        <span id="search_clear" class="search-clear-btn">&times;</span>
	                    </div>
	                </div>
	                <div id="status"></div>
	                <button id="scroll-to-top-btn" class="hidden" title="Nach oben scrollen">↑</button>
	                <button id="reset-col-order-btn" class="hidden">← →</button>
	            </div>

	            <div class="output">
	                <div id="output"></div>
	            </div>
	        </div>
	    



        <script>



            class App {
                static Config = Object.freeze({
                    LANG: "en",
                    COLUMN_DELIMITER: ";",
                    VALUE_DELIMITER: "~",
                    DUPLICATE_DELIMITER: "#",
                });

                static Translations = Object.freeze({
                    en: {
                        activate_filter: "Activate filter",
                        add_blank_lines: "Add blank lines",
                        column_not_unique_in_file1: "The column is not unique in first file:",
                        column_not_unique_in_file2: "The column is not unique in second file:",
                        compare_files: "Compare files",
                        consolidate_duplicates: "Consolidate duplicates in first file",
                        delimiter_exists_in_file1: "In the first file, a delimiter is included.",
                        delimiter_exists_in_file2: "In the second file, a delimiter is included.",
                        disclaimer: "The comparison results are provided without warranty. Please verify their accuracy carefully.",
                        file_is_empty: "The file is empty and cannot be processed:",
                        file_read_error: "Error reading file:",
                        file1_column: "1. file:",
                        file1_is_empty: "The first file is empty and cannot be processed.",
                        file1_label: "1. file",
                        file2_column: "2. file:",
                        file2_is_empty: "The second file is empty and cannot be processed.",
                        file2_label: "2. file",
                        filter_all: "(all)",
                        filter_empty: "(empty)",
                        first_file_has_empty_keys: "The first file contains empty primary keys.",
                        first_file_record_not_unique: "The following entry is not unique in first file:",
                        hide_identical_columns: "Show keys and modified columns only",
                        key_columns_label: "Primary key:",
                        key_not_found_in_file2: "Key from first file was not found in second file:",
                        library_missing_error: "Required library is not loaded:",
                        no_content_to_save: "There is no content to save.",
                        no_file_selected: "No file selected",
                        no_text_to_select_and_save: "There is no text to select and save.",
                        of: "of",
                        parsing_error: "Error while parsing the file:",
                        replace_delimiter_with_space: "Replace delimiter with space",
                        reset: "Reset",
                        row: "entry",
                        rows: "entries",
                        save_as_csv: "Save as CSV",
                        save_as_html: "Save as HTML",
                        search_placeholder: "Search output...",
                        second_file_column_not_unique: "The following entry is not unique in second file:",
                        second_file_has_empty_keys: "The second file contains empty primary keys.",
                        select_a_file: "Please select a file.",
                        select_one_column: "Please select at least one column to define the primary key.",
                        select_two_files: "Please select two files.",
                        show_as_table: "Show as table",
                        show_differences_only: "Show modified rows only",
                        show_file1: "Show 1. file",
                        show_file2: "Show 2. file",
                        title_long: ".xlsx, .ods & .csv comparison made easy",
                        unsupported_format_error: "Unsupported file format:",

                constructor() {
                    this.config = App.Config;
                    this.tr = App.Translations;
                    this.isLockedAtBottom = false;
                    this.isScrollingUp = false;
                    const requestedLang = App.Config.LANG;
                    const fallbackLang = "en";
                    this.lang = App.Translations[requestedLang] ? requestedLang : fallbackLang;
                    document.documentElement.lang = this.lang;
                    this.columnDelimiter = App.Config.COLUMN_DELIMITER || ";";
                    this.valueDelimiter = App.Config.VALUE_DELIMITER || "~";
                    this.duplicateDelimiter = App.Config.DUPLICATE_DELIMITER || "#";
                    this.view = new View(this.lang, this.tr);
                    this.tableManager = new TableManager(this.lang, this.tr);
                    this.dataManager = new DataManager(this.config);
                    this.comparer = new Comparer(this.lang, this.tr);
                    this.exporter = new Exporter();
                    this.state = {
                        currentViewMode: "compare",
                        file1Data: null,
                        file2Data: null,
                        file1Headers: [],
                        file2Headers: [],
                        selectedKeys: new Set(),
                        selectedCols1: new Set(),
                        selectedCols2: new Set(),
                        options: {
                            asTable: true,
                            onlyDifferences: false,
                            hideIdenticalColumns: false,
                            includeEmptyLines: false,
                            replaceDelimiter: false,
                            activateFilter: true,
                        },
                        rowTypeFilters: {
                            matching: true,
                            onlyFile1: true,
                            onlyFile2: true,
                        },
                        comparisonStats: null,
                    };

                    this.#initializeApp();
                }


                #addEventListeners() {
                    document.addEventListener("click", (e) => this.handleGlobalClick(e));
                    document.addEventListener("change", (e) => this.handleGlobalChange(e));


                    const searchInput = this.tableManager.els.globalSearch;
                    const searchClear = this.tableManager.els.searchClear;

                    if (searchInput) {
                        let searchTimeout;
                        searchInput.addEventListener("input", () => {
                            if (searchClear) {
                                searchClear.style.display = searchInput.value.length > 0 ? "block" : "none";
                            }
                            clearTimeout(searchTimeout);
                            searchTimeout = setTimeout(() => {
                                this.#applyAllFilters();
                            }, 200);
                        });
                    }

                    if (searchClear) {
                        searchClear.addEventListener("click", () => {
                            if (searchInput) {
                                searchInput.value = "";
                                searchClear.style.display = "none";
                                searchInput.focus();
                                this.#applyAllFilters();
                            }
                        });
                    }

                    this.#setupDropZone(this.view.els.dropZone1, this.view.els.file1, "file1");
                    this.#setupDropZone(this.view.els.dropZone2, this.view.els.file2, "file2");
                    
					window.addEventListener("scroll", () => {
					    const btn = document.getElementById("scroll-to-top-btn");
					    const bottomContainer = document.querySelector(".bottom-container");
					
					    if (bottomContainer) {
					        const triggerPoint = bottomContainer.offsetTop;
					

					        if (this.isLockedAtBottom && window.scrollY < triggerPoint) {
					            window.scrollTo(0, triggerPoint);
					        }
					
					        if (btn) {
					
					            if (window.scrollY >= triggerPoint - 5) {
					                btn.classList.remove("hidden");
					                if (!this.isScrollingUp) {
					                    this.isLockedAtBottom = true;
					                }
					            } else {
					                btn.classList.add("hidden");
					
					                if (this.isScrollingUp || !this.tableManager.currentTable) {
					                    this.isLockedAtBottom = false;
					                    this.isScrollingUp = false;
					                }
					            }
					        }
					    }
					});
					

					window.addEventListener("wheel", (e) => {
					    if (e.target.closest('.table-filter-dropdown')) {
					        return;
					    }

					    const bottomContainer = document.querySelector(".bottom-container");
					    if (bottomContainer && this.tableManager.currentTable) {
					        const triggerPoint = bottomContainer.offsetTop;
					
					        if (e.deltaY < 0 && (window.scrollY + e.deltaY < triggerPoint)) {
					            window.scrollTo(0, triggerPoint);
					            e.preventDefault();
					        }
					    }
					}, {
					    passive: false
					});
					
					let touchStartY = 0;
					window.addEventListener("touchstart", (e) => {
					    touchStartY = e.touches[0].clientY;
					}, {
					    passive: true
					});
					
					window.addEventListener("touchmove", (e) => {
					    if (e.target.closest('.table-filter-dropdown')) {
					        return;
					    }

					    const bottomContainer = document.querySelector(".bottom-container");
					    if (bottomContainer && this.tableManager.currentTable) {
					        const triggerPoint = bottomContainer.offsetTop;
					        const touchEndY = e.touches[0].clientY;
					        const deltaY = touchStartY - touchEndY;
					
					        if (deltaY < 0 && (window.scrollY + deltaY < triggerPoint)) {
					            window.scrollTo(0, triggerPoint);
					            e.preventDefault();
					        }
					    }
					}, {
					    passive: false
					});

                }

				#applyAllFilters(activeDropdown = null) {
				    const outputEl = this.tableManager.els.output;
				    const searchInput = this.tableManager.els.globalSearch;
				    const originalSearchTerm = searchInput ? searchInput.value.trim() : "";
				    const searchTerm = originalSearchTerm.toLowerCase();
				    const table = this.tableManager.currentTable;
				
				    if (!table) {
				        this.#filterTextOutput(outputEl, searchTerm, originalSearchTerm);
				    } else {
				        this.#filterTableOutput(table, searchTerm, originalSearchTerm, activeDropdown);
				    }
				    
                    const bottomContainer = document.querySelector(".bottom-container");
                        if (bottomContainer && window.scrollY > bottomContainer.offsetTop) {
                            window.scrollTo({
                                top: bottomContainer.offsetTop,
                                behavior: "auto"
                            });
                    }

				}


                async compareFiles() {
                    this.tableManager.clearOutput();
                    this.view.clearWarnings();
                    this.view.els.asTable.disabled = false;
                    if (this.view.els.asTableContainer) {
                        this.view.els.asTableContainer.classList.remove("disabled-option");
                    }
                    window.getSelection()?.removeAllRanges();

                    const file1 = this.view.els.file1?.files?.[0];
                    const file2 = this.view.els.file2?.files?.[0];
                    if (!file1 || !file2) return;

                    this.#syncSelectionState();
                    this.#syncOptionsState();

                    const keyColumns = Array.from(this.state.selectedKeys);
                    if (keyColumns.length === 0) {
                        this.view.showWarning("file1", "select_one_column");
                        this.tableManager.clearStatus();
                        return;
                    }

                    const cols1 = Array.from(this.state.selectedCols1);
                    const cols2 = Array.from(this.state.selectedCols2);
                    const options = {
                        ...this.state.options,
                        keyColumns,
                        cols1,
                        cols2,
                    };

                    try {
                        const encoding = this.#getCurrentEncoding();
                        if (!this.state.file1Data)
                            this.state.file1Data = await this.dataManager.parseFile(file1, encoding);
                        if (!this.state.file2Data)
                            this.state.file2Data = await this.dataManager.parseFile(file2, encoding);

                        if (!options.replaceDelimiter && !options.asTable) {
                            const valDelim = this.valueDelimiter;
                            const colDelim = this.columnDelimiter;
                            const hasDelimiter = (data) => {
                                if (!data) return false;
                                return data.some(
                                    (row) =>
                                        row &&
                                        row.some((cell) => {
                                            const str = String(cell);
                                            return str.includes(valDelim) || str.includes(colDelim);
                                        })
                                );
                            };
                            if (hasDelimiter(this.state.file1Data)) {
                                this.view.showWarning("file1", "delimiter_exists_in_file1");
                                this.tableManager.clearStatus();
                                return;
                            }
                            if (hasDelimiter(this.state.file2Data)) {
                                this.view.showWarning("file2", "delimiter_exists_in_file2");
                                this.tableManager.clearStatus();
                                return;
                            }
                        }

                        const delimiters = [this.columnDelimiter, this.valueDelimiter];

                        let tempProcessed1 = Utility.replaceDelimiters(this.state.file1Data, delimiters, options);
                        let data1 = Utility.formatDates(tempProcessed1);

                        let tempProcessed2 = Utility.replaceDelimiters(this.state.file2Data, delimiters, options);
                        let data2 = Utility.formatDates(tempProcessed2);

                        const result = this.comparer.compareFiles(data1, data2, {
                            ...options,
                            valueDelimiter: this.valueDelimiter,
                            columnDelimiter: this.columnDelimiter,
                        });


                        if (!result.stats) {
                            if (result.warnings && result.warnings.length > 0) {
                                result.warnings.forEach((warning) => {
                                    this.view.showWarning(warning.context, warning.messageKey, warning.details);
                                });
                                this.tableManager.clearStatus();
                            }
                            return;
                        }

                        const changeTypes = [
                            Comparer.CellStatus.DIFFERENCE,
                            Comparer.CellStatus.DELETED,
                            Comparer.CellStatus.ADDED,
                        ];
                        const hasUnchangedRows = result.differences.some((row) =>
                            row.every((cell) => !cell || !changeTypes.includes(cell.type))
                        );

                        this.view.els.onlyDifferences.disabled = !hasUnchangedRows;
                        if (!hasUnchangedRows) {
                            this.view.els.onlyDifferences.checked = true;
                            options.onlyDifferences = true;
                        }

                        this.#toggleHideIdenticalColumns();

                        const hasAddedOrDeletedRows =
                            result.stats.countOnlyFile1 > 0 || result.stats.countOnlyFile2 > 0;
                        if (hasAddedOrDeletedRows) {
                            this.view.els.hideIdenticalColumns.checked = false;
                            this.view.els.hideIdenticalColumns.disabled = true;
                            options.hideIdenticalColumns = false;
                        }

                        this.state.initialTotalRows = result.stats.totalRows;
                        this.state.rowTypeFilters = {
                            matching: true,
                            onlyFile1: true,
                            onlyFile2: true,
                        };

                        this.#displayDifferences(result.differences, result.headers, options, result.stats);
                    } catch (error) {
                        this.view.showWarning("file1", "parsing_error", error.message);
                        this.tableManager.clearStatus();
                    }
                }

                #displayDifferences(differences, headers, formData, stats) {
                    const changeTypes = [
                        Comparer.CellStatus.DIFFERENCE,
                        Comparer.CellStatus.DELETED,
                        Comparer.CellStatus.ADDED,
                    ];

                    let finalDifferences = differences;

                    if (formData.onlyDifferences) {
                        finalDifferences = finalDifferences.filter((row) =>
                            row.some((cell) => cell && changeTypes.includes(cell.type))
                        );
                    }

                    if (stats) {
                        let fMatching = 0,
                            fOnly1 = 0,
                            fOnly2 = 0;

                        finalDifferences.forEach((row) => {
                            const hasAdded = row.some((c) => c?.type === Comparer.CellStatus.ADDED);
                            const hasDeleted = row.some((c) => c?.type === Comparer.CellStatus.DELETED);

                            if (hasDeleted && !hasAdded) fOnly1++;
                            else if (hasAdded && !hasDeleted) fOnly2++;
                            else fMatching++;
                        });

                        this.state.comparisonStats = { matching: fMatching, onlyFile1: fOnly1, onlyFile2: fOnly2 };
                        this.state.rowTypeFilters = {
                            matching: fMatching > 0,
                            onlyFile1: fOnly1 > 0,
                            onlyFile2: fOnly2 > 0,
                        };
                    }

                    let filteredHeaders = headers;
                    if (formData.hideIdenticalColumns) {
                        const keyColNames = new Set(
                            formData.keyColumns.map((idx) => (this.state.file1Headers[idx] || "").trim())
                        );

                        finalDifferences.forEach((row) => {
                            row.forEach((cell) => {
                                if (cell && changeTypes.includes(cell.type)) {
                                    keyColNames.add(Utility.removeHTMLTags(cell.columnName || "").trim());
                                }
                            });
                        });

                        const headerIndices = headers
                            .map((h, i) => (keyColNames.has(Utility.removeHTMLTags(h).trim()) ? i : -1))
                            .filter((i) => i !== -1);

                        filteredHeaders = headerIndices.map((i) => headers[i]);
                        finalDifferences = finalDifferences.map((row) => headerIndices.map((i) => row[i]));
                    }

                    const finalRowCount = finalDifferences.length;

                    if (formData.asTable) {
                        this.tableManager.renderTable(filteredHeaders, finalDifferences, {
                            activateFilter: formData.activateFilter,
                        });
                    } else {
                        this.tableManager.renderText(filteredHeaders, finalDifferences, {
                            includeEmptyLines: formData.includeEmptyLines,
                            columnDelimiter: this.columnDelimiter,
                            valueDelimiter: this.valueDelimiter,
                        });
                    }

                    this.#updateUIStatus(
                        finalRowCount,
                        this.state.initialTotalRows ?? differences.length,
                        this.state.comparisonStats
                    );

                    if (this.tableManager.els.globalSearch?.value.trim()) {
                        this.#applyAllFilters();
                    }
          
                }

				#filterTableOutput(table, searchTerm, originalSearchTerm, activeDropdown = null) {
				    const tbody = table.tBodies[0];
				    if (!tbody) {
				        return;
				    }
				
				    this.tableManager.resetTableHighlights(tbody);
				
				    const activateFilterEl = this.view.els.activateFilter;
				    const isColumnFilterActive = Boolean(activateFilterEl && activateFilterEl.checked);
				    const allRows = Array.from(tbody.rows);
				
				    const headerCells = isColumnFilterActive ? Array.from(table.tHead?.querySelectorAll("tr:nth-child(2) td") || []) : [];
				    const activeFilters = this.tableManager.getActiveColumnFilters(headerCells, isColumnFilterActive);
				
				    const isSingleView = ["file1", "file2", "consolidate"].includes(this.state.currentViewMode);
				    const rtf = this.state.rowTypeFilters || { matching: true, onlyFile1: true, onlyFile2: true };
				
				    const rowMatchesAllFilters = (row, colIndexToIgnore = -1) => {
				        if (!isSingleView) {
				            const rowType = row.dataset.rowType || "matching";
				            if ((rowType === "onlyFile1" && !rtf.onlyFile1) || (rowType === "onlyFile2" && !rtf.onlyFile2) || (rowType === "matching" && !rtf.matching)) {
				                return false;
				            }
				        }
				        if (searchTerm && !row._cachedSearchText.includes(searchTerm)) return false;
				
				        for (const filter of activeFilters) {
				            if (filter.colIndex === colIndexToIgnore) continue;
				            
				            const cell = row.children[filter.colIndex];
				            if (!cell || !this.tableManager.doesCellMatchFilter(cell, filter.selectedValues)) {
				                return false;
				            }
				        }
				        return true;
				    };
				
				    const result = this.tableManager.renderTableOutput(tbody, allRows, (row) => rowMatchesAllFilters(row), originalSearchTerm);
				    this.#updateUIStatus(result.visibleCount, result.totalRows, result.stats);
				
				    if (isColumnFilterActive) {
				        if (this.dropdownUpdateTimeout) {
				            clearTimeout(this.dropdownUpdateTimeout);
				        }
				        
				        this.dropdownUpdateTimeout = setTimeout(() => {
				            this.tableManager.updateColumnDropdowns(headerCells, allRows, activeFilters, rowMatchesAllFilters, activeDropdown);
				        }, 10);
				    }
				}
				




				

                #filterTextOutput(outputEl, searchTerm, originalSearchTerm) {
                    const lines = outputEl.querySelectorAll(".text-line");
                    if (lines.length === 0) {
                        this.#updateUIStatus(0, 0, null);
                        return;
                    }

                    const rtf = this.state.rowTypeFilters || { matching: true, onlyFile1: true, onlyFile2: true };
                    const hasSearch = searchTerm !== "";
                    const searchRegex = hasSearch
                        ? new RegExp(`(${Utility.escapeRegExp(originalSearchTerm)})`, "gi")
                        : null;

                    let visibleCount = 0;
                    let visibleOnlyFile1 = 0;
                    let visibleOnlyFile2 = 0;
                    let visibleMatching = 0;

                    for (const line of lines) {
                        const rowType = line.dataset.rowType;
                        let isVisible = true;

                        if (
                            (rowType === "onlyFile1" && !rtf.onlyFile1) ||
                            (rowType === "onlyFile2" && !rtf.onlyFile2) ||
                            (rowType === "matching" && !rtf.matching)
                        ) {
                            isVisible = false;
                        }

                        if (isVisible && hasSearch && !line.dataset.searchText.includes(searchTerm)) {
                            isVisible = false;
                        }

                        if (line.style.display !== (isVisible ? "" : "none")) {
                            line.style.display = isVisible ? "" : "none";
                        }

                        if (isVisible) {
                            visibleCount++;
                            if (rowType === "onlyFile1") visibleOnlyFile1++;
                            else if (rowType === "onlyFile2") visibleOnlyFile2++;
                            else visibleMatching++;

                            const oldHtml = line.innerHTML;
                            let newHtml = oldHtml.replace(/<span class="search-highlight">(.*?)<\/span>/gi, "$1");
                            if (hasSearch) {
                                newHtml = newHtml.replace(searchRegex, '<span class="search-highlight">$1</span>');
                            }
                            if (newHtml !== oldHtml) {
                                line.innerHTML = newHtml;
                            }
                        }
                    }

                    const totalRows =
                        this.state.initialTotalRows !== undefined ? this.state.initialTotalRows : lines.length;
                    this.#updateUIStatus(visibleCount, totalRows, {
                        matching: visibleMatching,
                        onlyFile1: visibleOnlyFile1,
                        onlyFile2: visibleOnlyFile2,
                    });
                }

                #getCurrentEncoding() {
                    return this.view.els.encoding?.value ?? "UTF-8";
                }

                #handleAction(action) {
                    const viewChangingActions = ["compare", "remove-duplicates", "reset", "show-file1", "show-file2"];
                    if (viewChangingActions.includes(action)) {
                        if (this.tableManager.els.globalSearch) this.tableManager.els.globalSearch.value = "";
                        if (this.tableManager.els.searchClear) this.tableManager.els.searchClear.style.display = "none";
                        this.tableManager.clearStatus();
                        this.view.clearWarnings();
                    }

                    const file1 = this.view.els.file1?.files?.[0];
                    const file2 = this.view.els.file2?.files?.[0];

                    switch (action) {
                        case "reset":
                            this.state.file1Data = null;
                            this.state.file2Data = null;
                            this.state.file1Headers = [];
                            this.state.file2Headers = [];
                            this.state.currentViewMode = "compare";
                            this.state.rowTypeFilters = {
                                matching: true,
                                onlyFile1: true,
                                onlyFile2: true,
                            };
                            this.state.comparisonStats = null;
                            this.view.reset();
                            this.tableManager.reset();
                            break;

                        case "export-html": {
                            this.view.clearWarnings();
                            const asTable = this.view.els.asTable.checked;
                            const htmlContent = this.tableManager.getHtmlForExport(asTable);
                            if (htmlContent) {
                                this.exporter.exportAsHTML(htmlContent);
                            } else {
                                this.tableManager.clearOutput();
                                this.view.showWarning("file1", "no_content_to_save");
                            }
                            break;
                        }

                        case "export-csv": {
                            this.view.clearWarnings();
                            if (this.view.els.asTable.checked) {
                                this.view.showWarning("file1", "no_content_to_save");
                            } else {
                                const outputText = this.view.els.output?.innerText.trim();
                                if (outputText) {
                                    this.exporter.exportAsCSV(outputText);
                                } else {
                                    this.tableManager.clearOutput();
                                    this.view.showWarning("file1", "no_text_to_select_and_save");
                                }
                            }
                            break;
                        }

                        case "compare":
                            if (file1 && file2) {
                                this.state.currentViewMode = "compare";
                                this.compareFiles();
                            } else {
                                this.tableManager.clearOutput();
                                this.view.showWarning("file1", "select_two_files");
                            }
                            break;

                        case "show-file1":
                            if (file1) {
                                this.state.currentViewMode = "file1";
                                this.#showFile("file1");
                            } else {
                                this.tableManager.clearOutput();
                                this.view.showWarning("file1", "select_a_file");
                            }
                            break;

                        case "show-file2":
                            if (file2) {
                                this.state.currentViewMode = "file2";
                                this.#showFile("file2");
                            } else {
                                this.tableManager.clearOutput();
                                this.view.showWarning("file2", "select_a_file");
                            }
                            break;

                        case "remove-duplicates":
                            if (file1) {
                                this.state.currentViewMode = "consolidate";
                                this.#removeDuplicates();
                            } else {
                                this.tableManager.clearOutput();
                                this.view.showWarning("file1", "select_a_file");
                            }
                            break;
                    }
                }

                async handleFileSelect(fileInputId) {
                    if (fileInputId === "file1") {
                        this.view.reset(true);
                    }
                    this.tableManager.clearOutput();
                    this.view.clearWarnings();
                    this.tableManager.clearStatus();

                    const file = this.view.els[fileInputId].files[0];
                    this.view.updateFileName(fileInputId, file ? file.name : null);
                    this.#updateEncodingState();

                    if (!file) {
                        this.state[`${fileInputId}Data`] = null;
                        this.state[`${fileInputId}Headers`] = [];
                        if (fileInputId === "file1") {
                            this.state.file2Data = null;
                            this.state.file2Headers = [];
                            this.view.reset();
                        }
                        return;
                    }

                    if (file.size === 0) {
                        const messageKey = fileInputId === "file1" ? "file1_is_empty" : "file2_is_empty";
                        this.view.showWarning(fileInputId, messageKey);
                        this.state[`${fileInputId}Data`] = null;
                        this.state[`${fileInputId}Headers`] = [];

                        if (fileInputId === "file1") {
                            this.state.file2Data = null;
                            this.state.file2Headers = [];
                            this.view.els.checkboxesFile2.innerHTML = "";
                            this.view.els.file2CheckboxSection.classList.add("hidden");
                        }
                        return;
                    }

                    try {
                        const data = await this.dataManager.parseFile(file, this.#getCurrentEncoding());
                        const headers = data && data.length > 0 ? data[0] : [];
                        this.state[`${fileInputId}Data`] = data;
                        this.state[`${fileInputId}Headers`] = headers;

                        if (fileInputId === "file1") {
                            this.#onFirstFileSelected(headers);
                        } else {
                            this.#onSecondFileSelected(headers);
                        }

                        this.#toggleTableOptions();
                        this.#syncSelectionState();
                        this.#syncOptionsState();
                    } catch (error) {
                        if (typeof error === "object" && error.messageKey) {
                            this.view.showWarning(fileInputId, error.messageKey, error.details);
                        } else {
                            this.view.showWarning(fileInputId, "parsing_error", error.message);
                        }
                    }
                }

                handleGlobalChange(e) {
                    const target = e.target;
                    if (target.classList.contains("status-filter-checkbox")) {
                        const filterType = target.dataset.filter;
                        if (filterType && this.state.rowTypeFilters) {
                            this.state.rowTypeFilters[filterType] = target.checked;
                            this.#applyAllFilters();
                        }
                        return;
                    }

                    if (target === this.view.els.encodingToggle) {
                        this.view.els.encoding.value = target.checked ? "ANSI" : "UTF-8";
                        this.state.file1Data = null;
                        this.state.file2Data = null;
                        this.#rerenderView();
                        return;
                    }

                    if (target.classList.contains("table-filter-dropdown")) {
                        this.tableManager.handleTableFilterChange(target);
                        
                        this.#applyAllFilters(target);

                        if (this.dropdownUpdateTimeout) {
                            clearTimeout(this.dropdownUpdateTimeout);
                        }
                        this.dropdownUpdateTimeout = setTimeout(() => {
                            const table = this.tableManager.currentTable;
                            if (table) {
                                const tbody = table.tBodies[0];
                                const isColumnFilterActive = Boolean(this.view.els.activateFilter && this.view.els.activateFilter.checked);
                                const headerCells = isColumnFilterActive ? Array.from(table.tHead?.querySelectorAll("tr:nth-child(2) td") || []) : [];
                                const activeFilters = this.tableManager.getActiveColumnFilters(headerCells, isColumnFilterActive);
                                const allRows = tbody ? Array.from(tbody.rows) : [];

                                const rtf = this.state.rowTypeFilters || { matching: true, onlyFile1: true, onlyFile2: true };
                                const isSingleView = ["file1", "file2", "consolidate"].includes(this.state.currentViewMode);

                                const rowMatchesAllFilters = (row, colIndexToIgnore = -1) => {
                                    if (!isSingleView) {
                                        const rowType = row.dataset.rowType || "matching";
                                        if ((rowType === "onlyFile1" && !rtf.onlyFile1) || (rowType === "onlyFile2" && !rtf.onlyFile2) || (rowType === "matching" && !rtf.matching)) {
                                            return false;
                                        }
                                    }
                                    const searchInput = this.tableManager.els.globalSearch;
                                    const searchTerm = searchInput ? searchInput.value.trim().toLowerCase() : "";
                                    if (searchTerm && !row._cachedSearchText.includes(searchTerm)) return false;

                                    for (const filter of activeFilters) {
                                        if (filter.colIndex === colIndexToIgnore) continue;
                                        const cell = row.children[filter.colIndex];
                                        if (!cell || !this.tableManager.doesCellMatchFilter(cell, filter.selectedValues)) {
                                            return false;
                                        }
                                    }
                                    return true;
                                };

                                this.tableManager.updateColumnDropdowns(headerCells, allRows, activeFilters, (row, colIdx) => rowMatchesAllFilters(row, colIdx), target);
                            }
                        }, 0);

                        return;
                    }

                    if (target.closest("#checkboxes")) {
                        this.#syncKeyCheckboxes();
                        this.#syncSelectionState();
                        return;
                    }

                    const checkboxContainer = target.closest("#checkboxes-file1, #checkboxes-file2");
                    if (checkboxContainer) {
                        this.handleToggleAllInColumnSelection(target, checkboxContainer);
                        this.#syncSelectionState();
                        return;
                    }

                    if (target === this.view.els.asTable) {
                        this.#toggleTableOptions();
                        this.#syncOptionsState();
                        this.#rerenderView();
                        return;
                    }

                    if (target === this.view.els.activateFilter) {
                        this.#toggleFilterActivation();
                        this.#syncOptionsState();
                        return;
                    }

                    if (target === this.view.els.onlyDifferences) {
                        this.#toggleHideIdenticalColumns();
                        this.#syncOptionsState();
                        this.#rerenderView();
                        return;
                    }

                    if (
                        target === this.view.els.hideIdenticalColumns ||
                        target === this.view.els.includeEmptyLines ||
                        target === this.view.els.replaceDelimiterWithSpace
                    ) {
                        this.#syncOptionsState();
                        this.#rerenderView();
                        return;
                    }
                }

                handleGlobalClick(e) {
                    const button = e.target.closest("[data-action]");
                    if (button) {
                        e.preventDefault();
                        button.blur();
                        const action = button.getAttribute("data-action");
                        this.#handleAction(action);
                        return;
                    }
                    
                    if (e.target.closest('#restore-cols-btn')) {
                        this.tableManager.showAllColumns();
                        return;
                    }
                    
                    if (e.target.closest('#reset-col-order-btn')) {
                        this.tableManager.resetColumnOrder();
                        return;
                    }
                    

                    if (e.target.closest('#scroll-to-top-btn')) {
                        this.isScrollingUp = true;
                        this.isLockedAtBottom = false;
                        window.scrollTo({ top: 0, behavior: 'auto' });
                        return;
                    }

                    const table = this.tableManager.currentTable;
                    if (!table || !table.contains(e.target)) return;

                    const clickedHeader = e.target.closest("th");
                    if (clickedHeader) {
                        this.tableManager.handleHeaderClick(clickedHeader, e.target);
                        return;
                    }

                    const clickedRow = e.target.closest("tr");
                    if (clickedRow && clickedRow.parentElement.tagName === "TBODY") {
                        clickedRow.style.backgroundColor =
                            clickedRow.style.backgroundColor === "yellow" ? "" : "yellow";
                    }
                }

                handleToggleAllInColumnSelection(target, container) {
                    const namePrefix = container.id === "checkboxes-file1" ? "file1-col" : "file2-col";
                    const toggleAll = container.querySelector(`#toggle-all-${namePrefix}`);
                    if (!toggleAll) return;

                    if (target === toggleAll) {
                        for (const cb of container.querySelectorAll(`input[id^="${namePrefix}-"]:not(:disabled)`)) {
                            cb.checked = target.checked;
                        }
                    } else {
                        let allChecked = true;
                        for (const cb of container.querySelectorAll(
                            `input[id^="${namePrefix}-"]:not(#toggle-all-${namePrefix})`
                        )) {
                            if (!cb.checked) {
                                allChecked = false;
                                break;
                            }
                        }
                        toggleAll.checked = allChecked;
                    }
                }

                #initializeApp() {
                    this.view.reset();
                    this.#toggleTableOptions();
                    this.#addEventListeners();
                    this.view.els.body.classList.add("is-ready");
                }

                #onFirstFileSelected(headers) {
                    this.view.displayCheckboxes(headers, this.view.els.checkboxes, "column");
                    this.view.displayCheckboxes(headers, this.view.els.checkboxesFile1, "file1-col");
                    this.view.els.keyColumnContainer.classList.remove("hidden");
                    this.view.els.checkboxes.classList.remove("hidden");
                    this.view.els.outputOptionsContainer.classList.remove("hidden");
                    this.view.els.asTableContainer.classList.remove("hidden");
                    this.view.els.replaceDelimiterContainer.classList.remove("hidden");
                    this.view.els.onlyDifferences.checked = false;
                    this.view.els.onlyDifferences.disabled = true;
                    this.view.els.hideIdenticalColumns.checked = false;
                    this.view.els.hideIdenticalColumns.disabled = true;
                    this.view.els.file2.value = "";
                    this.view.updateFileName("file2", null);
                    this.state.file2Data = null;
                    this.state.file2Headers = [];
                    this.view.els.checkboxesFile2.innerHTML = "";
                    this.view.els.file1CheckboxSection.classList.remove("hidden");
                    this.view.els.file2CheckboxSection.classList.add("hidden");
                }

                #onSecondFileSelected(headers) {
                    this.view.displayCheckboxes(headers, this.view.els.checkboxesFile2, "file2-col");
                    this.#syncKeyCheckboxes();
                    this.view.els.outputOptionsContainer.classList.remove("hidden");
                    this.view.els.onlyDifferencesContainer.style.display = "block";
                    this.view.els.hideIdenticalColumnsContainer.style.display = "block";
                    this.view.els.file1CheckboxSection.classList.remove("hidden");
                    this.view.els.file2CheckboxSection.classList.remove("hidden");
                    this.view.els.onlyDifferences.checked = true;
                    this.view.els.onlyDifferences.disabled = false;
                    this.#toggleHideIdenticalColumns();
                }

                async #removeDuplicates() {
                    this.state.currentViewMode = "consolidate";
                    this.tableManager.clearOutput();
                    this.view.clearWarnings();
                    this.tableManager.clearStatus();

                    if (this.view.els.asTableContainer) {
                        this.view.els.asTableContainer.classList.add("disabled-option");
                    }

                    this.#toggleTableOptions();

                    this.view.els.onlyDifferences.checked = false;
                    this.view.els.onlyDifferences.disabled = true;
                    this.view.els.hideIdenticalColumns.checked = false;
                    this.view.els.hideIdenticalColumns.disabled = true;

                    this.#syncSelectionState();
                    const keyColumns = Array.from(this.state.selectedKeys);
                    if (keyColumns.length === 0) {
                        this.view.showWarning("file1", "select_one_column");
                        return;
                    }

                    const file1 = this.view.els.file1.files[0];
                    if (!file1) return;

                    try {
                        if (!this.state.file1Data) {
                            this.state.file1Data = await this.dataManager.parseFile(file1, this.#getCurrentEncoding());
                        }
                        const originalData = this.state.file1Data;
                        if (!originalData || originalData.length < 2) return;

                        const originalHeaders = originalData[0] || [];
                        const originalRowCount = originalData.length - 1;

                        let dataStep1 = [...originalData];

                        let dataStep2 = Utility.formatDates(dataStep1);
                        let dataStep3 = Utility.removeEmptyColumns(dataStep2);


                        let dataStep4 = Utility.replaceDelimiters(
                            dataStep3,
                            [this.duplicateDelimiter],
                            this.state.options
                        );


                        const consolidationResult = this.comparer.processDuplicateConsolidation(
                            dataStep4,
                            keyColumns,
                            this.duplicateDelimiter,
                            {
                                valueDelimiter: this.valueDelimiter,
                            }
                        );


                        if (!consolidationResult.success) {
                            if (consolidationResult.reason === "HAS_DUPLICATE_DELIMITER") {
                                this.view.showWarning("file1", "delimiter_exists_in_file1");
                                this.tableManager.clearStatus();
                            }
                            return;
                        }

                        let processedRows = consolidationResult.data;
                        const newRowCount = processedRows.length;
                        const unitLabel = originalRowCount === 1 ? this.tr[this.lang].row : this.tr[this.lang].rows;
                        this.tableManager.setStatus(
                            `${newRowCount} ${this.tr[this.lang].of} ${originalRowCount} ${unitLabel}`
                        );

                        const renderedRows = new Array(processedRows.length);
                        for (let i = 0; i < processedRows.length; i++) {
                            const row = processedRows[i];
                            renderedRows[i] = row.map((c) => ({
                                value: c,
                            }));
                        }

                        this.tableManager.renderText(originalHeaders, renderedRows, {
                            includeEmptyLines: this.state.options.includeEmptyLines,
                            columnDelimiter: this.columnDelimiter,
                            valueDelimiter: this.valueDelimiter,
                            duplicateDelimiter: this.duplicateDelimiter,
                        });
                        
           
                        
                    } catch (error) {
                        this.view.showWarning("file1", "parsing_error", error.message);
                        this.tableManager.clearStatus();
                    }
                }

                #rerenderView() {
                    switch (this.state.currentViewMode) {
                        case "compare":
                            this.compareFiles();
                            break;
                        case "file1":
                            this.#showFile("file1");
                            break;
                        case "file2":
                            this.#showFile("file2");
                            break;
                        case "consolidate":
                            this.#removeDuplicates();
                            break;
                    }
                }

				#setupDropZone(zone, input, fileInputId) {
				    if (!zone) return;
				
				    input.addEventListener("change", () => this.handleFileSelect(fileInputId));
				    zone.addEventListener("click", () => input.click());
				
				    ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
				        zone.addEventListener(eventName, (e) => e.preventDefault(), false);
				    });
				

				    ["dragenter", "dragover"].forEach((eventName) => {
				        zone.addEventListener(eventName, () => {
				            zone.classList.add("drag-over");
				        }, false);
				    });
				

				    ["dragleave", "drop"].forEach((eventName) => {
				        zone.addEventListener(eventName, () => {
				            zone.classList.remove("drag-over");
				        }, false);
				    });
				
				    zone.addEventListener("drop", (e) => {
				        input.files = e.dataTransfer.files;
				        input.dispatchEvent(new Event("change", { bubbles: true }));
				    });
				}
			    

                async #showFile(fileKey) {
                    this.state.currentViewMode = fileKey;
                    this.tableManager.reset();
                    this.view.clearWarnings();
                    this.tableManager.clearStatus();
                    window.getSelection()?.removeAllRanges();

                    this.#syncOptionsState();

                    const file = this.view.els[fileKey].files[0];
                    if (!file) return;

                    try {
                        if (!this.state[`${fileKey}Data`]) {
                            this.state[`${fileKey}Data`] = await this.dataManager.parseFile(
                                file,
                                this.#getCurrentEncoding()
                            );
                        }
                        let data = this.state[`${fileKey}Data`];
                        if (!data || data.length === 0) return;

                        const delimiters = [this.columnDelimiter, this.valueDelimiter];

                        let tempProcessed = Utility.replaceDelimiters(data, delimiters, this.state.options);
                        let processedData = Utility.formatDates(tempProcessed);


                        const selectedColsSet =
                            fileKey === "file1" ? this.state.selectedCols1 : this.state.selectedCols2;
                        const selectedCols = Array.from(selectedColsSet);

                        let headers = processedData[0].map((h) => Utility.removeHTMLTags((h || "").trim()));
                        let rows = processedData.slice(1);

                        if (selectedCols.length > 0 && selectedCols.length < headers.length) {
                            headers = selectedCols.map((index) => headers[index]);
                            rows = rows.map((row) => selectedCols.map((index) => row[index]));
                        }

                        
                        const unitLabel = rows.length === 1 ? this.tr[this.lang].row : this.tr[this.lang].rows;
                        this.tableManager.setStatus(`${rows.length} ${this.tr[this.lang].of} ${rows.length} ${unitLabel}`);

                        if (this.state.options.asTable) {
                            this.tableManager.renderTable(headers, rows, {
                                activateFilter: this.state.options.activateFilter,
                            });
                        } else {
                            this.tableManager.renderText(
                                headers,
                                rows.map((r) =>
                                    r.map((c) => ({
                                        value: c,
                                    }))
                                ),
                                {
                                    includeEmptyLines: this.state.options.includeEmptyLines,
                                    columnDelimiter: this.columnDelimiter,
                                    valueDelimiter: this.valueDelimiter,
                                }
                            );
                        }

                        if (this.tableManager.els.globalSearch?.value.trim()) {
                            this.#applyAllFilters();
                        }

                   


                    } catch (error) {
                        this.view.showWarning(fileKey, "parsing_error", error.message);
                        this.tableManager.clearStatus();
                    }
                }

                #syncKeyCheckboxes() {
                    const checkedKeyNames = new Set(
                        Array.from(this.view.els.checkboxes.querySelectorAll("input:checked"), (cb) =>
                            cb.labels?.[0]?.textContent.trim().toLowerCase()
